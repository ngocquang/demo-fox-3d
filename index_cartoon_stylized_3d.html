<!DOCTYPE html>
<!--
================================================================================
  CLASH VILLAGE — cartoon-stylised real-time three.js scene (r186, single file, no build)
================================================================================
  A Clash-of-Clans-style base: houses, trees, dirt roads, a pond, walls, defences and
  troops. Everything is generated procedurally at startup; only three.js (jsDelivr) and
  the "Lilita One" web font come from the network (the font has a system fallback).

  TECHNIQUES (41 — the numbered tables in index_cartoon_stylized.md give line refs;
  they follow the section banners "// ==== ... ====" below)
  - Look: MeshToonMaterial with a 5-band gradient map (a cool-violet hemisphere ground tints the
    shadows), rim light + cut-off specular, inverted-hull outlines with a constant pixel width
    (welded hull normals, instanced hulls, tinted per-primitive weights, state colours), sun
    + hemisphere light, 4096² PCF shadow map (PCFSoft was removed in r186), drifting cloud
    shadows from invisible casters, blob contact shadows, fog, CSS vignette. No post chain.
  - Geometry: "Kit" merges vertex-coloured primitives (RoundedBox, Extrude prisms, ...) into
    one mesh per building, with a baked bottom-to-top gradient, world-unit UVs and fragment-
    shader surface patterns (brick, planks, scales, thatch, cobble, leaves); lumpy icosphere
    rocks with baked crevices; 12 building types with upgrade tiers; instanced trees / bushes /
    rocks (near / far tree LOD) with per-instance tint and shader wind sway; auto-connecting
    walls with towers and gates; pivot-rigged characters (barbarian, goblin, builder, villager,
    archer).
  - World: ground painted on a 2304² canvas (checker grass, tufts, cobbled plaza, Catmull-Rom
    dirt roads that also feed the tile masks); stylised pond shader (banded depth, animated
    stripes, foam ring) with rim, lily pads, reeds, dock, boat and ducks.
  - Motion / FX: animated props (flags, wheels, fire, turrets), chimney smoke, instanced
    particle pool, squash-and-stretch selection, construction pop, villagers walking road
    splines, parabolic and homing projectiles.
  - Interaction: ground-grab pan, damped zoom, rotate (Pointer Events + touch), raycast
    picking, tile-snapped placement with grid / blocked-tile overlays, BFS pathfinding,
    world-to-screen DOM bubbles, 3D shop thumbnails rendered through MSAA render targets.
  URL params: ?shadow=2048 · ?scale=0.75 · ?seed=<n> · ?debug (FPS) · ?test (no loop; drive via window.__app)
================================================================================
-->

<script type="module">
// ==== IMPORTS ================================================================
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ==== ERROR SURFACE ==========================================================
const errBox = document.getElementById('err');
const app = window.__app = { ready: false, errors: [] };
function showError(msg) {
  app.errors.push(msg);
  errBox.style.display = 'block';
  errBox.textContent = 'Something went wrong while building the village:\n\n' + msg;
  console.error(msg);
}
addEventListener('error', (e) => showError(e.message || String(e)));
addEventListener('unhandledrejection', (e) => showError((e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)));

// ==== PARAMETERS =============================================================
const QS = new URLSearchParams(location.search);
const PARAMS = {
  seed: +QS.get('seed') || 20240917,
  shadow: +QS.get('shadow') || (matchMedia('(pointer: coarse)').matches ? 2048 : 4096),
  scale: QS.has('scale') ? +QS.get('scale') : 1,
  test: QS.has('test'),
  debug: QS.has('debug'),
};
const N = 40, HALF = N / 2, PAD = 4;      // playable tiles, half size, painted margin (tiles)

// ==== SMALL UTILITIES ========================================================
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(PARAMS.seed);
const rr = (a, b) => a + (b - a) * rng();
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const css = (hex, m = 1) => `rgb(${[16, 8, 0].map((s) => Math.min(255, Math.round(((hex >> s) & 255) * m))).join(',')})`;
const $ = (id) => document.getElementById(id);
let loadFill = $('loadbar');
async function setLoading(msg, p) {
  $('loadmsg').textContent = msg; loadFill.style.width = (p * 100) + '%';
  await new Promise((r) => requestAnimationFrame(() => r()));
}

// ==== PALETTE ================================================================
const PAL = {
  haze: 0xa6dcae,
  grassA: 0x9bd94a, grassB: 0x8fce40, border: 0x63a83b, curb: 0x4c8c2e,
  dirt: 0xe9c98c, dirtEdge: 0xcfa267, dirtDark: 0xbf9459, dirtLight: 0xf6e0b2,
  stone: 0xd8cfbb, stoneDark: 0xa39a86, stoneMid: 0xbdb5a3,
  sand: 0xf0dc9c, sandDark: 0xcfae6a,
  wood: 0x9a5b2e, woodDark: 0x6b3a1d, woodLight: 0xc78a4d,
  gold: 0xffc933, goldDark: 0xd99a10, elixir: 0xea4fb8, elixirDark: 0xb02a86,
  red: 0xd8432b, blue: 0x3f86d9, orange: 0xee8a26, cream: 0xf3e6c2,

// ---- Wall pieces (one merged mesh, rebuilt when the set changes): pillars, crenellated arms, corner towers, gate posts
let wallMesh = null, wallsDirty = false;
const byId = new Map();
const isWall = (i, j) => inb(i, j) && byId.get(occ[idx(i, j)])?.type === 'wall';
// One wall tile: a round tower on corners and free ends, a squared pier otherwise, and a curtain wall towards each E / S neighbour.
// Returns true for a free end (a gate post).
function wallPiece(k, x, z, nE, nW, nS, nN) {
  const n4 = nE + nW + nS + nN, corner = n4 === 2 && (nE || nW) && (nS || nN), end = n4 === 1;
  k.p = PAT.brick;
  if (corner || end) {
    k.cyl(0.5, 0.58, 1.55, CL.brick, [x, 0.78, z], 0, 0, 12);
    k.p = 0; k.cyl(0.62, 0.62, 0.1, CL.stone, [x, 1.6, z], 0, 0, 12);

    k.p = PAT.tile; k.cone(0.62, 0.8, corner ? CL.roofB : CL.roofR, [x, 2.15, z], 0, 0, 12); k.p = 0;
    k.sh = 0.7; k.sph(0.06, PAL.gold, [x, 2.6, z], null, null, 6, 5); k.sh = 0;
    k.box(0.04, 0.3, 0.05, 0x2b2b2b, [x, 1.05, z + 0.5]);
  } else {
    k.rbox(0.86, 1.0, 0.86, CL.brick, [x, 0.5, z]);
    k.p = 0; k.rbox(0.98, 0.14, 0.98, CL.stone, [x, 1.07, z]);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) k.box(0.24, 0.2, 0.24, CL.stone, [x + sx * 0.36, 1.24, z + sz * 0.36]);
  }
  for (const [has, dx, dz] of [[nE, 1, 0], [nS, 0, 1]]) if (has) {
    const ax = dx ? 1 : 0.5, az = dz ? 1 : 0.5, cx = x + dx * 0.5, cz = z + dz * 0.5;
    k.p = PAT.brick; k.rbox(dx ? 1.0 : 0.5, 0.68, dz ? 1.0 : 0.5, CL.brick, [cx, 0.34, cz]);
    k.p = 0; k.rbox(dx ? 1.02 : 0.6, 0.08, dz ? 1.02 : 0.6, CL.stone, [cx, 0.72, cz]);
    for (const m of [-0.25, 0.25]) for (const s of [-1, 1]) k.rbox(dx ? 0.2 : 0.14, 0.16, dz ? 0.2 : 0.14, CL.stone, [cx + (dx ? m : s * 0.22), 0.84, cz + (dz ? m : s * 0.22)]);
  }
  return end;
}
function rebuildWalls() {
  wallsDirty = false;
  if (wallMesh) { scene.remove(wallMesh); wallMesh.traverse((o) => o.geometry?.dispose()); wallMesh = null; }
  const ws = [...byId.values()].filter((b) => b.type === 'wall');
  if (!ws.length) return;
  const k = new Kit(), posts = [];
  for (const { i, j } of ws) {
    const nE = isWall(i + 1, j), nW = isWall(i - 1, j), nS = isWall(i, j + 1), nN = isWall(i, j - 1);
    if (wallPiece(k, i + 0.5 - HALF, j + 0.5 - HALF, nE, nW, nS, nN)) posts.push({ i, j, dir: nE ? [-1, 0] : nW ? [1, 0] : nS ? [0, -1] : [0, 1] });
  }
  const seen = new Set();
  for (const a of posts) {
    let bx = a.i, bz = a.j;
    for (let t = 1; t <= 4; t++) {
      bx += a.dir[0]; bz += a.dir[1];
      if (!isWall(bx, bz)) continue;
      const other = posts.find((q) => q.i === bx && q.j === bz && q.dir[0] === -a.dir[0] && q.dir[1] === -a.dir[1]), key = [Math.min(a.i, bx), Math.min(a.j, bz), Math.max(a.i, bx), Math.max(a.j, bz)].join();
      if (other && !seen.has(key)) {
        seen.add(key);
        const cx = (a.i + bx) / 2 + 0.5 - HALF, cz = (a.j + bz) / 2 + 0.5 - HALF, len = (t - 1) * 1 + 0.1, yaw = a.dir[0] ? 0 : Math.PI / 2;
        k.p = PAT.planksH; k.rbox(len + 0.9, 0.24, 0.36, PAL.woodDark, [cx, 1.55, cz], [0, yaw, 0]);
        k.p = PAT.planksV; k.rbox(len + 0.5, 0.5, 0.1, PAL.wood, [cx, 1.2, cz], [0, yaw, 0]);
        k.p = 0; k.box(0.4, 0.66, 0.05, CL.roofR, [cx, 1.05, cz + (yaw ? 0 : 0.08)], [0, yaw, 0]); k.sh = 0.6; k.cyl(0.11, 0.11, 0.05, PAL.gold, [cx, 1.1, cz + (yaw ? 0 : 0.12)], [Math.PI / 2, yaw, 0]); k.sh = 0;
      }
      break;
    }
  }
  wallMesh = meshOf(k, 0.8); wallMesh.userData.wall = true;
  scene.add(wallMesh);
}

const HI_D = 26;   // trees closer than this to the map centre (Chebyshev) get the detailed kit
function scatterNature() {

  const add = (x, z, sc, kind) => kinds[kind].push([x, z, sc, rng() * 6.28]);
  for (let n = 0; n < 6000 && kinds[0].length + kinds[1].length + kinds[4].length < 340; n++) {
    const x = rr(-56, 56), z = rr(-56, 56), d = Math.max(Math.abs(x), Math.abs(z));
    if (d < 20.8 || rng() > 1.15 - (d - 20.8) / 28) continue;

  }
  for (let n = 0; n < 60; n++) {
    const x = rr(-50, 50), z = rr(-50, 50), d = Math.max(Math.abs(x), Math.abs(z));
    if (d > 21.4) add(x, z, rr(0.8, 1.6), n % 3 ? 3 : 2);
  }
  let inner = 0;
  for (let n = 0; n < 2500 && inner < 46; n++) {
    const i = Math.floor(rr(2, N - 2)), j = Math.floor(rr(2, N - 2));
    if (!freeArea(i, j, 2)) continue;
    obst[idx(i, j)] = 1; inner++;
    const kind = n % 5 === 0 ? 3 : n % 3 === 0 ? 2 : rng() < 0.6 ? 0 : 1;
    add(i + 0.5 - HALF, j + 0.5 - HALF, kind === 0 || kind === 1 ? rr(0.85, 1.15) : rr(0.8, 1.1), kind === 0 ? 4 : kind);
  }
  const mat = swayMat(0.032);
  kinds.forEach((list, kind) => {
    if (!list.length) return;
    const im = new THREE.InstancedMesh(treeKit(kind).build(), kind === 3 ? toonMat : mat, list.length);
    im.castShadow = im.receiveShadow = true; im.frustumCulled = false;
    list.forEach(([x, z, sc, yaw], n) => {
      im.setMatrixAt(n, _m.compose(_v.set(x, 0, z), _q.setFromAxisAngle(UP, yaw), _s.set(sc, sc * rr(0.92, 1.12), sc)));
      im.setColorAt(n, _col.setRGB(1 + rr(-0.1, 0.08), 1 + rr(-0.08, 0.1), 1 + rr(-0.12, 0.04)));
    });
    addOutline(im, 1, kind === 3 ? 0 : 0.032);
    scene.add(im);

}

let shopTab = 'all';

const shopEl = $('shop'), shopWrap = $('shopwrap');

// ==== RAID (goblins steal loot; cannons, archers and deployed barbarians defend)
const raid = { active: false, goblins: [], allies: [], shots: [], spawned: 0, total: 10, killed: 0, escaped: 0, lost: { gold: 0, elixir: 0 }, timer: 0 };
const EDGE = [[20, 1], [20, 38], [38, 17], [1, 20]];
const shotGeo = new THREE.SphereGeometry(0.17, 8, 6), shotMat = new THREE.MeshBasicMaterial({ color: 0x2a2f38 });
const arrowGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.7, 5), arrowMat = new THREE.MeshBasicMaterial({ color: 0xf1e2b0 });
const d2 = (a, b) => (a.x - b.x) ** 2 + (a.z - b.z) ** 2;
const tileOf = (p) => [clamp(Math.floor(p.x + HALF), 0, N - 1), clamp(Math.floor(p.z + HALF), 0, N - 1)];
function retarget(g) {
  const ts = [...byId.values()].filter((b) => (b.def.store || b.def.make) && !b.build);
  if (!ts.length) { g.state = 'gone'; return; }
  ts.sort((a, b) => d2(g.ch.position, a.group.position) - d2(g.ch.position, b.group.position));
  g.target = ts[0];
  const [ci, cj] = tileOf(g.ch.position), path = findPath(ci, cj, (i, j) => occ[idx(i, j)] === g.target.id, true);
  g.path = path ? path.slice(0, -1) : []; g.k = 0;
}
function spawnGoblin() {
  const [si, sj] = pick(EDGE), ch = makeChar('goblin');
  ch.position.set(si + 0.5 - HALF, 0.07, sj + 0.5 - HALF); scene.add(ch);
  const g = { ch, hp: 10, state: 'run', edge: [si, sj], speed: 3.6, t: 0, loot: null, hit: 0, path: null, k: 0, target: null };
  raid.goblins.push(g); raid.spawned++;
  burst(ch.position.x, 0.5, ch.position.z, 10, 0x9be36a, { speed: 1.6, size: 0.16, up: 1.5 });
  retarget(g);
}
function steal(g) {
  const b = g.target;
  if (!b || !byId.has(b.id)) return;
  const kind = b.def.store ?? b.def.make, amt = b.def.store ? Math.min(Math.floor(econ[kind]), Math.round(econ.cap[kind] * 0.06)) : Math.floor(b.stored);
  if (b.def.store) econ[kind] -= amt; else b.stored = 0;
  g.loot = { kind, amt };
  const k = new Kit(); k.sph(0.2, kind === 'gold' ? PAL.gold : PAL.elixir, [0, 0, 0], 0, [1, 1.1, 1], 8, 6);
  const sack = meshOf(k, 0.4); sack.position.set(0, 0.72, -0.3); g.ch.add(sack);
  burst(g.ch.position.x, 0.8, g.ch.position.z, 8, kind === 'gold' ? 0xffd23a : 0xff7ad9, { speed: 1.8, size: 0.13, up: 3 });
  refreshHUD();
}
function killGoblin(g) {
  raid.killed++;

  burst(g.ch.position.x, 0.6, g.ch.position.z, 16, 0xdfffc8, { speed: 2.6, size: 0.2, up: 3 });
  burst(g.ch.position.x, 0.9, g.ch.position.z, 8, 0xffd23a, { speed: 1.8, size: 0.12, up: 4 });
  scene.remove(g.ch); raid.goblins.splice(raid.goblins.indexOf(g), 1);
}
function damage(g, d) {
  if (g.hp <= 0) return;
  g.hp -= d; g.hit = 0.14;
  burst(g.ch.position.x, 0.6, g.ch.position.z, 4, 0xffffff, { speed: 1.2, size: 0.1, up: 1.2, life: 0.35 });
  if (g.hp <= 0) killGoblin(g);
}
function updateGoblin(g, dt) {
  g.hit = Math.max(0, g.hit - dt);
  g.ch.scale.y = 0.7 * (1 - 0.25 * g.hit / 0.14);
  if (g.state === 'run' || g.state === 'flee') {
    animChar(g.ch, simTime, 1, false);
    if (followPath(g, dt)) { if (g.state === 'run') { g.state = 'loot'; g.t = 0; } else g.state = 'gone'; }
  } else if (g.state === 'loot') {
    animChar(g.ch, simTime, 0, true); g.t += dt;
    if (g.target?.group) g.ch.rotation.y = Math.atan2(g.target.group.position.x - g.ch.position.x, g.target.group.position.z - g.ch.position.z);
    if (g.t > 1.1) {
      steal(g); g.state = 'flee'; g.speed = 3.0;
      const [ci, cj] = tileOf(g.ch.position);
      g.path = findPath(ci, cj, (i, j) => i === g.edge[0] && j === g.edge[1], true) ?? []; g.k = 0;
    }
  }
  if (g.state === 'gone') {
    raid.escaped++; if (g.loot) raid.lost[g.loot.kind] += g.loot.amt;
    scene.remove(g.ch); raid.goblins.splice(raid.goblins.indexOf(g), 1);
  }
}
function fire(b, tgt) {
  const isC = b.type === 'cannon', p = b.group.position, yaw = b.aim.yaw;
  const from = isC ? new THREE.Vector3(p.x + Math.sin(yaw) * 1.3, 1.4, p.z + Math.cos(yaw) * 1.3) : new THREE.Vector3(p.x, 3.3, p.z);
  const to = new THREE.Vector3(tgt.ch.position.x, 0.5, tgt.ch.position.z);
  if (isC) { b.aim.recoil = 1; burst(from.x, from.y, from.z, 7, 0xe8e8e8, { speed: 1.4, size: 0.2, up: 1.6, life: 0.6, g: 1 }); }
  const m = new THREE.Mesh(isC ? shotGeo : arrowGeo, isC ? shotMat : arrowMat); m.position.copy(from); scene.add(m);
  raid.shots.push({ m, from, to, t: 0, T: from.distanceTo(to) / (isC ? 11 : 20), isC, dmg: (isC ? 2.5 : 1.2) * b.lvl, tgt });
}
function updateDefenses(dt) {
  for (const b of byId.values()) {
    if ((b.type !== 'cannon' && b.type !== 'archertower') || b.build || !b.aim) continue;
    b.cd = (b.cd ?? 0) - dt;
    const isC = b.type === 'cannon', range = isC ? 9 : 11, p = b.group.position;
    let best = null, bd = range * range;

    if (!best) { b.aim.want = null; continue; }
    b.aim.want = Math.atan2(best.ch.position.x - p.x, best.ch.position.z - p.z);
    const diff = Math.abs(Math.atan2(Math.sin(b.aim.want - b.aim.yaw), Math.cos(b.aim.want - b.aim.yaw)));

function updateShots(dt) {
  for (let i = raid.shots.length - 1; i >= 0; i--) {
    const s = raid.shots[i]; s.t += dt;
    const u = Math.min(1, s.t / s.T);

}
function deployAlly(x, z) {
  if (army.count <= 0) return toast('No troops left in your camp');
  const ch = makeChar('barbarian'); ch.position.set(x, 0.07, z); scene.add(ch);
  army.count--; refreshCamps();
  raid.allies.push({ ch, hp: 12, speed: 2.7, path: null, k: 0, cd: 0, retarget: 0 });
  burst(x, 0.5, z, 10, 0xffffff, { speed: 1.4, size: 0.16, up: 1.5 });
}
function updateAlly(a, dt) {
  a.cd -= dt; a.retarget -= dt;
  let best = null, bd = Infinity;
  for (const g of raid.goblins) { const d = d2(g.ch.position, a.ch.position); if (d < bd) { bd = d; best = g; } }
  if (!best) { animChar(a.ch, simTime, 0, false); return; }
  if (bd < 0.85 * 0.85) {

    const [ci, cj] = tileOf(a.ch.position), [gi, gj] = tileOf(best.ch.position);

}
function raidTap(e) {
  const p = groundAt(e, new THREE.Vector3());

  const [i, j] = worldToTile(p.x, p.z);
  if (!inb(i, j) || isBorder(i, j) || pondM[idx(i, j)] || occ[idx(i, j)] >= 0) return toast("Can't deploy there");

}
function startRaid() {
  if (mode !== 'home') return;
  deselect(); mode = 'raid';
  Object.assign(raid, { active: true, spawned: 0, killed: 0, escaped: 0, timer: 0, lost: { gold: 0, elixir: 0 } });
  $('raidhud').classList.add('on'); document.body.classList.add('raid'); $('hint').classList.add('off');

}
function endRaid(retreat) {

  for (const g of raid.goblins) { scene.remove(g.ch); if (g.loot) raid.lost[g.loot.kind] += g.loot.amt; }
  for (const a of raid.allies) { scene.remove(a.ch); army.count++; }
  for (const s of raid.shots) scene.remove(s.m);
  raid.goblins.length = raid.allies.length = raid.shots.length = 0;
  for (const b of byId.values()) if (b.aim) b.aim.want = null;
  refreshCamps(); mode = 'home';

  econ.gems += gems; refreshHUD();
  toast(retreat ? 'You called off the defense' : `${raid.killed >= 6 ? 'Victory!' : 'Raid over.'} ${raid.killed}/${raid.total} goblins caught${lost ? ` · lost ${lost} loot` : ''}${gems ? ` · +${gems} gems` : ''}`);

function updateRaid(dt) {
  if (!raid.active) return;
  raid.timer += dt;
  if (raid.spawned < raid.total && raid.timer > 1 + raid.spawned * 1.4) spawnGoblin();
  updateDefenses(dt);
  for (const g of [...raid.goblins]) updateGoblin(g, dt);
  for (const a of raid.allies) updateAlly(a, dt);
  updateShots(dt);
  const left = raid.total - raid.killed - raid.escaped;
  $('raidtxt').textContent = `Goblin raid!  ${left} left  ·  Troops ${army.count}`;

$('raidBtn').onclick = startRaid;
$('retreat').onclick = () => endRaid(true);

// ==== FRAME UPDATE ===========================================================
let simTime = 0, subT = 0;
function updateBuildings(dt) {
  const list = ghost ? [...byId.values(), ghost] : byId.values();
  for (const b of list) {
    if (!b.group) continue;
    if (b.def.make && !b.build && byId.has(b.id)) { b.stored = Math.min(stCap(b), b.stored + prod(b) * dt); syncBubble(b); }
    if (b.dragTo) {
      const p = b.group.position, k = 1 - Math.exp(-dt * 22), ly = b.lift ?? 0;
      p.x += (b.dragTo.x - p.x) * k; p.z += (b.dragTo.z - p.z) * k; p.y += (ly - p.y) * (1 - Math.exp(-dt * 16));
      if (b !== ghost && !dragging && Math.abs(p.x - b.dragTo.x) + Math.abs(p.z - b.dragTo.z) + Math.abs(p.y - ly) < 0.01) {
        p.set(b.dragTo.x, 0, b.dragTo.z); b.dragTo = null;
        if (b.moved) { b.moved = false; refreshEmitters(); }
      }
    }
    if (b.visual) {
      if (b.pop >= 0) { b.pop += dt / 0.55; b.visual.scale.setScalar(Math.max(0.01, easeOutBack(clamp(b.pop, 0, 1)))); if (b.pop >= 1) { b.pop = -1; b.visual.scale.set(1, 1, 1); } }

        if (b.bounce > 0.8) { b.bounce = -1; b.visual.scale.set(1, 1, 1); }
      }
    }
    if (b.build) {
      const c = b.build; c.t += dt; b.scaffold.userData.anim?.(simTime);
      const left = Math.max(0, Math.ceil(c.dur - c.t));
      if (left !== c.shown) {
        c.shown = left;
        const el = overlays.get('t' + b.id)?.el; if (el) el.textContent = `⏱ 0:${String(left).padStart(2, '0')}`;
        if (selected === b) renderSel();
      }
      if (c.t >= c.dur) finishConstruction(b);
    }
  }
  subT += dt;
  if (subT > 0.3) { subT = 0; if (selected && !selected.build && mode === 'home') $('selsub').textContent = describe(selected); }
}
function update(dt) {
  simTime += dt; U.uTime.value = simTime;
  rig.dist = damp(rig.dist, rig.goal, PARAMS.test ? 100 : 3.2, dt);
  rig.yaw = damp(rig.yaw, rig.goalYaw, 8, dt);
  placeCamera();
  for (const c of clouds) { c.position.x += dt * 1.4; c.position.z -= dt * 0.7; if (c.position.x > 55) c.position.x = -55; if (c.position.z < -55) c.position.z = 55; }
  for (const b of buildings) b.anim?.(simTime, dt, b);

  updateBuildings(dt);
  updateWalkers(simTime, dt); updateCamps(simTime); updatePondLife(simTime); updateSmoke(simTime);
  updateUnits(dt); updateRaid(dt); updateFx(dt); updateOverlays();
}

// ==== DEBUG / TEST HOOKS =====================================================
const perf = { acc: 0, frames: 0, fps: 60, ms: 16.7 };
function updatePerf(dt) {
  perf.acc += dt; perf.frames++;
  if (perf.acc < 0.5) return;
  perf.fps = perf.frames / perf.acc; perf.ms = 1000 * perf.acc / perf.frames; perf.acc = 0; perf.frames = 0;
  if (PARAMS.debug) $('hud').textContent = `${perf.fps.toFixed(0)} fps (${perf.ms.toFixed(1)} ms)  calls ${renderer.info.render.calls}  tris ${renderer.info.render.triangles}`;
}
Object.assign(app, {
  frames(n, dt = 1 / 30) { for (let i = 0; i < n; i++) { update(dt); renderer.render(scene, camera); } },
  info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, programs: renderer.info.programs.length, textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries }),
  perf: () => ({ ...perf }),
  pose(x, z, dist, yawDeg = 45, pitchDeg = 50) { rig.x = x; rig.z = z; rig.dist = rig.goal = dist; rig.yaw = rig.goalYaw = THREE.MathUtils.degToRad(yawDeg); rig.pitch = THREE.MathUtils.degToRad(pitchDeg); placeCamera(); },
  buildings, rig, scene, camera, occ, road, pondM, obst,
  byId, thumbs, econ, army,
  select: (b) => select(b), deselect: () => deselect(), openShop: () => openShop(), beginPlace: (t) => beginPlace(t), confirmPlace: () => confirmPlace(),
  collect: (b) => collect(b), tryUpgrade: (b) => tryUpgrade(b), train: (b) => train(b),
  find: (type) => [...byId.values()].filter((b) => b.type === type),
  raid, startRaid: () => startRaid(), endRaid: (r) => endRaid(r), deployAlly: (x, z) => deployAlly(x, z),

Object.defineProperty(app, 'ghost', { get: () => ghost });

// ==== INIT ===================================================================
async function init() {
  if (!renderer.capabilities.isWebGL2 && !renderer.getContext().getParameter) throw new Error('WebGL2 is required.');
  await setLoading('Painting the meadow…', 0.1);
  buildMasks();
  buildGround();
  await setLoading('Filling the pond…', 0.3);
  buildPond();
  buildClouds();
  await setLoading('Raising the village…', 0.5);
  for (const [t, i, j] of LAYOUT) addBuilding(t, i, j);
  const [w0, w1] = WALL_RING;
  for (let k = w0; k <= w1; k++) for (const [i, j] of [[k, w0], [k, w1], [w0, k], [w1, k]]) if (occ[idx(i, j)] < 0 && canPlace(i, j, 1)) addBuilding('wall', i, j);
  rebuildWalls();
  await setLoading('Planting trees…', 0.7);
  scatterNature();
  buildPondLife();
  buildWalkers();
  recomputeCaps(); refreshCamps(); refreshEmitters(); refreshHUD();
  for (const b of byId.values()) syncBubble(b);
  onResize();
  placeCamera();
  await setLoading('Painting shop icons…', 0.85);
  for (const t of SHOP_TYPES) { try { thumbs[t] = renderThumb(t); } catch (e) { console.warn('thumb', t, e); } }
  await setLoading('Compiling shaders…', 0.9);
  try { await renderer.compileAsync(scene, camera); } catch (e) { console.warn('compileAsync', e); }
  app.ready = true;
  if (!PARAMS.test) {
    let last = performance.now();
    renderer.setAnimationLoop((now) => {
      const raw = (now - last) / 1000; last = now;
      const dt = Math.min(raw, 1 / 15);
      update(dt);
      renderer.render(scene, camera);
      updatePerf(raw);
    });
  } else app.frames(2);
  $('loading').classList.add('done');
}
init().catch((e) => showError((e && (e.stack || e.message)) || String(e)));
