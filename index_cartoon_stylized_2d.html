<!DOCTYPE html>
<!--
================================================================================
  CLASH VILLAGE 2D — cartoon-stylised isometric Canvas 2D scene (single file, no libraries, no build)
================================================================================
  The same Clash-of-Clans-style village as index_cartoon_stylized_3d.html (same roads, pond, plaza,
  walls and building layout), redrawn with plain Canvas 2D and the same colour pipeline: one sRGB
  palette, linear-light lighting (warm sun + cool-violet hemisphere), the 5-band toon ramp, per-primitive
  bottom-to-top gradients, 30%-tinted outlines, rim light, cut-off specular, cool shadows, haze, vignette.
  Everything is generated procedurally at startup; only the "Lilita One" web font comes from the
  network (it has a system fallback).

  TECHNIQUES (45 — the numbered tables in index_cartoon_stylized_2d.md give line refs;
  they follow the section banners "// ==== ... ====" below)
  - Colour: the sRGB palette of the 3D file; lighting done in linear light (warm Directional + violet-ground Hemisphere, the π cancelled) and a 5-band toon ramp
    [104, 152, 200, 236, 255] looked up per face normal, so a face has the same RGB as in the 3D scene; baked bottom-to-top gradients, warm rim light, cut-off
    specular on spheres, per-instance tint, cool cast shadows (the hemisphere-only share of the light), in-sprite cast shadows + foot AO, blob contact shadows, soft drifting cloud shadows, haze, CSS vignette.
  - Outline: the inverted-hull analogue — each primitive's silhouette is stroked first at twice the width and the fill goes over it, in 30% of the primitive's own
    colour and weighted by its size; sprites are re-baked when the zoom settles, so the line stays 1.7 px and sprites stay crisp.
  - Geometry: orthographic iso projection (yaw 45°, pitch 50°); "Kit" of box / cylinder / cone / sphere / gable / rod primitives painted back-to-front into one baked
    sprite per building; spheres shaded with nested elliptic caps (the terminators of each ramp band); surface patterns (brick, boards, scales, thatch, stripes, leaf
    dapples) drawn in face-local world units; 12 building types, auto-joining walls with towers and gates, pivot-rigged characters.
  - World: ground painted on a 2304² canvas (checker grass, tufts, cobbled plaza, Catmull-Rom dirt roads) and blitted through the iso affine; cast shadows baked into it;
    pond with banded depth, drifting stripes, foam ring, sun glints, lily pads, reeds, dock, rowing boat and ducks.
  - Motion: flags, cooking fire, floating elixir drop, chimney smoke, tree wind sway, butterflies, villagers walking the road splines, builders hammering.
  - Interaction: pointer-event pan, wheel / pinch zoom around the cursor. Not ported from the 3D file: economy, raid, shop, drag-and-drop placement, HUD.
  URL params: ?scale=0.75 · ?seed=<n> · ?debug (FPS, re-bake ms) · ?test (no loop; drive via window.__app)
================================================================================
-->
<html lang="en">

<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<script>
'use strict';
// ==== ERROR SURFACE ==========================================================
const $ = (id) => document.getElementById(id);
function showError(msg) { const e = $('err'); e.style.display = 'flex'; e.textContent = msg; }
addEventListener('error', (e) => showError((e.error && e.error.stack) || e.message));

// ==== PARAMETERS =============================================================
const QS = new URLSearchParams(location.search);
const PARAMS = {
  seed: +QS.get('seed') || 20240917,
  scale: QS.has('scale') ? +QS.get('scale') : 1,
  test: QS.has('test'),
  debug: QS.has('debug'),

const N = 40, HALF = N / 2, PAD = 12;      // playable tiles, half size, painted margin (tiles)

// ==== SMALL UTILITIES ========================================================
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

  return function () {

const rng = mulberry32(PARAMS.seed);
const rr = (a, b) => a + (b - a) * rng();
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const css = (hex, m = 1) => `rgb(${[16, 8, 0].map((s) => Math.min(255, Math.round(((hex >> s) & 255) * m))).join(',')})`;
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const unit = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };

// ==== PALETTE ================================================================
const PAL = {
  haze: 0xa6dcae,
  grassA: 0x9bd94a, grassB: 0x8fce40, border: 0x63a83b, curb: 0x4c8c2e,
  dirt: 0xe9c98c, dirtEdge: 0xcfa267, dirtDark: 0xbf9459, dirtLight: 0xf6e0b2,
  stone: 0xd8cfbb, stoneDark: 0xa39a86, stoneMid: 0xbdb5a3,
  sand: 0xf0dc9c, sandDark: 0xcfae6a,
  wood: 0x9a5b2e, woodDark: 0x6b3a1d, woodLight: 0xc78a4d,
  gold: 0xffc933, goldDark: 0xd99a10, elixir: 0xea4fb8, elixirDark: 0xb02a86,
  red: 0xd8432b, blue: 0x3f86d9, orange: 0xee8a26, cream: 0xf3e6c2,
};
const CL = { plaster: 0xf4e7c4, brick: 0xbdb2a0, stone: 0xd2cabb, stoneD: 0xa39c8b, roofR: 0xd8432b, roofB: 0x3f86d9, roofO: 0xee8a26, roofP: 0x8b5cc7, roofT: 0x2fa39a, iron: 0x5d6675, hay: 0xe3c46a, red: 0xb8392b };
const METAL = 0x707b8f;

// ==== ISO PROJECTION =========================================================
// Same rig as the 3D file at rest (yaw 45°, pitch 50°) but orthographic: +x runs screen right-down, +z screen left-down, +y up; 1 unit = 1 tile.
const PITCH = 50 * Math.PI / 180, CP = Math.cos(PITCH), SP = Math.sin(PITCH), R2 = Math.SQRT1_2;
const CAM = [R2 * CP, SP, R2 * CP];                                       // unit vector from the scene towards the camera
const proj = (x, y, z) => [(x - z) * R2, (x + z) * R2 * SP - y * CP];     // world → screen units
const GROUND_XF = [R2, R2 * SP, -R2, R2 * SP, 0, 0];                      // ctx.transform for drawing flat on y = 0 in world (x, z)
const SCR_R = [R2, 0, -R2], SCR_U = [-R2 * SP, CP, -R2 * SP];             // screen right / up axes in world space

// ==== COLOUR PIPELINE (linear light → 5-band toon ramp → sRGB) ================
// Same numbers as the 3D file: Directional(0xffecc8, π·0.52) + Hemisphere(0xd8efff / 0x8f9bd0, π·0.64), MeshToonMaterial gradientMap
// [104, 152, 200, 236, 255]; the π cancels against Lambert's 1/π. Colours are mixed in linear light and encoded to sRGB on output.
const toLin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
const toSrgb = (v) => { v = clamp(v, 0, 1); return Math.round(255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055)); };
const linMemo = new Map();
const lin = (hex) => { let l = linMemo.get(hex); if (!l) linMemo.set(hex, l = [hex >> 16 & 255, hex >> 8 & 255, hex & 255].map(toLin)); return l; };
const rgb = (c, a = 1) => `rgba(${toSrgb(c[0])},${toSrgb(c[1])},${toSrgb(c[2])},${a})`;
const rgba = (hex, a) => `rgba(${hex >> 16 & 255},${hex >> 8 & 255},${hex & 255},${a})`;
const SUN = unit([-24, 36, 15]);
const SUN_COL = lin(0xffecc8).map((v) => v * 0.52);
const SKY = lin(0xd8efff), GROUND = lin(0x8f9bd0), HEMI_K = 0.64;
const BANDS = [104, 152, 200, 236, 255].map((v) => v / 255);
const UP = [0, 1, 0], FZ = [0, 0, 1], FX = [1, 0, 0];
const bandOf = (n) => clamp(Math.floor(dot3(n, SUN) * 2.5 + 2.5), 0, 4);       // gradientMap lookup at dot(N, L) * 0.5 + 0.5, Nearest
const hemi = (ny) => SKY.map((s, i) => HEMI_K * (GROUND[i] + (s - GROUND[i]) * (0.5 * ny + 0.5)));
const light = (n, lit = true) => { const h = hemi(n[1]), s = lit ? BANDS[bandOf(n)] : 0; return h.map((v, i) => v + SUN_COL[i] * s); };
// final colour of a flat face: base × vertical gradient × per-instance tint × light, plus the warm rim term the 3D shader adds as emissive
function shade(hex, k, n, tint, lit = true) {
  const b = lin(hex), L = light(n, lit), r = 0.14 * Math.pow(1 - clamp(dot3(n, CAM), 0, 1), 2.4), t = tint || [1, 1, 1];
  return rgb([b[0] * k * t[0] * L[0] + r, b[1] * k * t[1] * L[1] + r * 0.85, b[2] * k * t[2] * L[2] + r * 0.68]);
}
// same lighting for a sphere band: sun ramp level b, hemisphere from the normal's y
const shadeBand = (hex, k, ny, b, tint) => { const l = lin(hex), h = hemi(ny), t = tint || [1, 1, 1]; return rgb(l.map((v, i) => v * k * t[i] * (h[i] + SUN_COL[i] * BANDS[b]))); };
const darker = (hex, m) => { const l = lin(hex); return (toSrgb(l[0] * m) << 16) | (toSrgb(l[1] * m) << 8) | toSrgb(l[2] * m); };
const LIT_UP = light(UP), SHADE_UP = light(UP, false);
const GROUND_TINT = rgb(LIT_UP);                                          // what lighting does to a flat ground texture
const SHADOW_RGB = rgb(SHADE_UP.map((v, i) => v / LIT_UP[i]));            // multiply colour of a cast shadow: the hemisphere-only share, so it leans cool blue
const WATER = [[0.29, 0.86, 0.84], [0.19, 0.665, 0.85], [0.09, 0.47, 0.86]].map((c) => rgb(c));   // the water shader's depth bands (linear values, as in GLSL)
// sun expressed in the screen basis, for the toon bands of spheres and the cut-off specular
const LR = dot3(SUN, SCR_R), LU = dot3(SUN, SCR_U), LC = dot3(SUN, CAM), LS = Math.hypot(LR, LU), THL = Math.atan2(-LU, LR);
const HV = unit([SUN[0] + CAM[0], SUN[1] + CAM[1], SUN[2] + CAM[2]]), HR = dot3(HV, SCR_R), HU = dot3(HV, SCR_U);
const SHD = [-SUN[0] / SUN[1], -SUN[2] / SUN[1]];                         // ground shadow offset per unit of height

// ==== GEOMETRY HELPERS =======================================================
function hull(pts) {   // monotone chain
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]), lo = [], up = [];
  for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
const dist3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const mid2 = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const sizeOf = (pts) => { let m = 0; for (let a = 0; a < 3; a++) { let lo = 1e9, hi = -1e9; for (const p of pts) { lo = Math.min(lo, p[a]); hi = Math.max(hi, p[a]); } m = Math.max(m, hi - lo); } return m; };

const ringPts = (n, r, a0 = 0) => Array.from({ length: n }, (_, i) => { const a = a0 + i / n * 2 * Math.PI; return [Math.cos(a) * r, Math.sin(a) * r, a]; }).sort((p, q) => (p[0] + p[1]) - (q[0] + q[1]));

// ==== SURFACE PATTERNS =======================================================
// Drawn as light / dark strokes in face-local world units (1 unit = 1 tile), so board, brick and scale density is the same on every primitive.
const PAT = { none: 0, planksV: 1, planksH: 2, brick: 3, tile: 4, thatch: 5, cobble: 6, leaf: 7, stripe: 8, bark: 9 };
function drawPat(g, id, wu, wv, seed) {
  const r = mulberry32(seed), D = (a) => `rgba(30,18,8,${a})`, W = (a) => `rgba(255,255,235,${a})`;
  if (id === PAT.planksV || id === PAT.planksH || id === PAT.bark) {
    const h = id === PAT.planksH, len = h ? wv : wu, wid = h ? wu : wv, step = id === PAT.bark ? 0.12 : 0.24;
    for (let p = 0; p < len; p += step) {
      const t = r() - 0.5;
      g.fillStyle = t > 0 ? W(t * 0.16) : D(-t * 0.2); g.fillRect(h ? 0 : p, h ? p : 0, h ? wid : step, h ? step : wid);
      g.fillStyle = D(0.3); g.fillRect(h ? 0 : p, h ? p : 0, h ? wid : 0.02, h ? 0.02 : wid);
    }
  } else if (id === PAT.brick || id === PAT.cobble) {
    const rh = id === PAT.brick ? 0.24 : 0.26, bw = id === PAT.brick ? 0.5 : 0.3;
    for (let row = 0, y = 0; y < wv; row++, y += rh) {
      for (let x = row & 1 ? -bw / 2 : 0; x < wu; x += bw) {
        const t = r() - 0.5;
        g.fillStyle = t > 0 ? W(t * 0.2) : D(-t * 0.24); g.fillRect(x, y, bw, rh);
        g.fillStyle = D(0.34); g.fillRect(x, y, 0.02, rh);

      g.fillStyle = D(0.34); g.fillRect(0, y, wu, 0.025);
    }
  } else if (id === PAT.tile) {
    const rh = 0.3, cw = 0.36; g.strokeStyle = D(0.4); g.lineWidth = 0.03;
    for (let row = 0, y = 0; y < wv + rh; row++, y += rh) for (let x = row & 1 ? -cw / 2 : 0; x < wu + cw; x += cw) { g.beginPath(); g.arc(x + cw / 2, y + rh, cw / 2, Math.PI, 2 * Math.PI); g.stroke(); }
  } else if (id === PAT.thatch) {
    for (let row = 0, y = 0; y < wv; row++, y += 0.28) {
      g.fillStyle = row & 1 ? W(0.07) : D(0.07); g.fillRect(0, y, wu, 0.28);
      g.fillStyle = D(0.28); g.fillRect(0, y, wu, 0.035);
      for (let x = r() * 0.1; x < wu; x += 0.1 + r() * 0.1) { g.fillStyle = D(0.16); g.fillRect(x, y, 0.012, 0.28); }
    }
  } else if (id === PAT.stripe) {
    g.fillStyle = D(0.2); for (let x = 0.45; x < wu; x += 0.9) g.fillRect(x, 0, 0.45, wv);

    for (let i = 0; i < wu * wv * 6; i++) { g.fillStyle = i & 1 ? 'rgba(255,255,170,.12)' : 'rgba(0,50,30,.13)'; g.beginPath(); g.arc(r() * wu, r() * wv, 0.05 + r() * 0.12, 0, 6.283); g.fill(); }

// mottled leaf / stone noise inside the unit circle (caller sets the transform)
function dapples(g, seed, n = 14) {
  const r = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const a = r() * 6.283, d = Math.sqrt(r()) * 0.9, s = 0.1 + r() * 0.2;
    g.fillStyle = i & 1 ? 'rgba(255,255,170,.12)' : 'rgba(0,50,30,.13)'; g.beginPath(); g.arc(d * Math.cos(a), d * Math.sin(a), s, 0, 6.283); g.fill();
  }

// ==== SPRITE KIT (primitives → one baked sprite) =============================
let DPR = 1, S0 = 36, BS = 64, OUTW = 1.7 / 36;   // device ratio, px per unit at default zoom, sprite px per unit, outline width in units
class Kit {

  constructor() { this.ops = []; this.p = 0; this.sh = 0; this.gr = [0.84, 1.06]; this.tint = null; }
  add(o) { o.p = this.p; o.sh = this.sh; o.gr = this.gr; o.tint = this.tint; o.seed = this.ops.length * 977 + 5; this.ops.push(o); return this; }
  box(w, h, d, col, pos) { return this.add({ t: 'box', w, h, d, col, pos }); }
  cyl(rt, rb, h, col, pos) { return this.add({ t: 'cyl', rt, rb, h, col, pos }); }
  cone(r, h, col, pos, seg, rot = 0) { return this.add({ t: 'cone', r, h, col, pos, seg, rot }); }
  sph(r, col, pos, scl = [1, 1, 1], half = false) { return this.add({ t: 'sph', r, col, pos, scl, half }); }
  roof(w, h, len, col, pos, end) { return this.add({ t: 'roof', w, h, len, col, pos, end }); }
  ring3(r, th, col, pos) { return this.add({ t: 'ring', r, th, col, pos }); }
  rod(a, b, r, col) { return this.add({ t: 'rod', a, b, r, col, pos: a }); }
  disc(r, col, pos) { return this.add({ t: 'disc', r, col, pos }); }
  // flat trim on a wall: f = 'L' (the +z wall, screen-left) or 'R' (the +x wall, screen-right); c = wall plane, u = position along it
  fb(f, c, u, y, w, h, col, d = 0.05, off = 0) { return f === 'L' ? this.box(w, h, d, col, [u, y, c + off + d / 2]) : this.box(d, h, w, col, [c + off + d / 2, y, u]); }
  bake() { const s = { kit: this, c: document.createElement('canvas') }; this.paint(s); sprites.push(s); return s; }
  paint(s) {   // (re)draws into s.c in place, so every closure holding the sprite picks up a re-bake at a new zoom
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const o of this.ops) for (const p of opPts(o)) { const q = proj(p[0], p[1], p[2]); x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
    const m = 0.12, c = s.c;

    const g = c.getContext('2d');
    g.setTransform(BS, 0, 0, BS, (m - x0) * BS, (m - y0) * BS); g.lineJoin = g.lineCap = 'round';
    for (const o of this.ops) { selfShadow(g, o); DRAW[o.t](g, o); }
    Object.assign(s, { ax: m - x0, ay: m - y0, w: c.width / BS, h: c.height / BS });   // anchor = projected kit origin, in screen units
  }

const sprites = [];
// Sprites are baked for the current zoom, so they stay crisp and the outline stays 1.7 px like the 3D hull; the factor tapers to cap memory.
const bakeScale = (z) => clamp(Math.round(DPR * S0 * z * lerp(1.6, 1.15, clamp((z - 1) / 2, 0, 1))), 32, 160);
let bakedZ = 1, rebakeTimer = 0, rebakeMs = 0;
function rebake(z) {
  const t0 = performance.now();
  bakedZ = z; BS = bakeScale(z); OUTW = 1.7 / (S0 * z);
  for (const s of sprites) s.kit.paint(s);

}
function scheduleRebake() {   // after the zoom settles, and only when the bake resolution is off by more than 25%
  clearTimeout(rebakeTimer);
  rebakeTimer = setTimeout(() => { if (Math.abs(Math.log(bakeScale(cam.z) / BS)) > Math.log(1.25) || Math.abs(Math.log(cam.z / bakedZ)) > Math.log(1.25)) rebake(cam.z); }, 200);

const blit = (g, s, x, y) => g.drawImage(s.c, x - s.ax, y - s.ay, s.w, s.h);
// 3D sample points of a primitive: sprite bounds, outline size weight and cast-shadow hulls all come from these
function opPts(o) {

  else if (o.t === 'cyl') { ring(o.rt, y + o.h / 2); ring(o.rb, y - o.h / 2); }
  else if (o.t === 'cone') { ring(o.r, y - o.h / 2); P.push([x, y + o.h / 2, z]); }

      k.rod([dx, 0, dz], [dx + tilt * h, h, dz], 0.03, 0x5aa83a); k.cyl(0.05, 0.05, 0.22, 0x7a4a26, [dx + tilt * h, h + 0.02, dz]);
    }
    const spr = k.bake(), o = proj(cx, 0, cz);
    addEnt(cx + cz, (g) => blit(g, spr, o[0], o[1]));
  }
  const dz0 = pz + 3.5, cx = px + 0.15, cz = dz0 - 1.4, wk = new Kit();   // dock and rowing boat, as in the 3D file (the reed gap leaves room on the +z shore)
  for (const z of [-1.2, 0.1, 1.4]) wk.cyl(0.07, 0.07, 0.7, PAL.woodDark, [-0.6, 0.1, z]);
  for (const sx of [-1, 1]) wk.box(0.1, 0.1, 3.3, PAL.woodDark, [sx * 0.45, 0.18, 0]);
  wk.p = PAT.planksH; for (let i = 8; i >= 0; i--) wk.box(1.15, 0.07, 0.32, PAL.woodLight, [0, 0.26, 1.4 - i * 0.36]); wk.p = 0;
  for (const z of [-1.2, 0.1, 1.4]) wk.cyl(0.07, 0.07, 0.7, PAL.woodDark, [0.6, 0.1, z]);
  const dockSpr = wk.bake(), dockO = proj(cx, 0, cz);
  shadowQ.push({ kit: wk, x: cx, z: cz, sc: 1, sy: 1, blob: 0 });
  addEnt(cx + cz, (g) => blit(g, dockSpr, dockO[0], dockO[1]));
  const bk = new Kit(), bx = px + 1.35, bz = dz0 - 1.5;
  bk.p = PAT.planksV; bk.box(0.6, 0.08, 1.5, PAL.woodDark, [0, 0.16, 0]);
  bk.box(0.07, 0.24, 1.5, PAL.wood, [-0.3, 0.27, 0]); bk.box(0.6, 0.24, 0.07, PAL.wood, [0, 0.27, -0.75]); bk.p = 0;
  bk.box(0.5, 0.05, 0.12, PAL.woodLight, [0, 0.32, 0]);
  bk.p = PAT.planksV; bk.box(0.07, 0.24, 1.5, PAL.wood, [0.3, 0.27, 0]); bk.box(0.6, 0.24, 0.07, PAL.wood, [0, 0.27, 0.75]); bk.p = 0;
  const boatSpr = bk.bake();
  addEnt(bx + bz, (g, t) => { const o = proj(bx, Math.sin(t * 1.1 + 1) * 0.02, bz); g.save(); g.translate(o[0], o[1]); g.rotate(Math.sin(t * 1.3) * 0.03); blit(g, boatSpr, 0, 0); g.restore(); });
  const dk = new Kit();
  dk.sph(0.2, 0xffffff, [0, 0.14, 0], [1.15, 0.8, 1]); dk.cone(0.09, 0.2, 0xffffff, [0, 0.2, -0.24]); dk.sph(0.12, 0xffffff, [0, 0.36, 0.14]);
  dk.box(0.1, 0.04, 0.12, 0xff9f1a, [0, 0.34, 0.27]); dk.sph(0.025, 0x1b1b1b, [0.06, 0.4, 0.22]); dk.sph(0.025, 0x1b1b1b, [-0.06, 0.4, 0.22]);
  const spr = dk.bake();
  for (let n = 0; n < 3; n++) {
    const d = { a: n * 2.1, rad: 1.2 + n * 0.45, sp: 0.32 + n * 0.07 }, e = addEnt(0, (g, t) => {
      const a = d.a + t * d.sp, x = px + Math.cos(a) * d.rad * 1.2, z = pz - 0.4 + Math.sin(a) * d.rad, o = proj(x, 0.1 + Math.sin(t * 3 + d.a) * 0.015, z);
      e.k = x + z; g.save(); g.translate(o[0], o[1]); g.scale(-Math.sin(a) > 0 ? 1 : -1, 1); blit(g, spr, 0, 0); g.restore();
    });
    ducks.push(e);
  }
}
function drawSparkles(g, t) {   // sun glints on the water: upright four-point stars that pop up at a new spot each cycle
  const px = POND.c[0] - HALF, pz = POND.c[1] - HALF;
  for (let k = 0; k < 9; k++) {
    const ph = t * 0.8 + k * 0.37, cyc = Math.floor(ph), u = ph - cyc, r = mulberry32(cyc * 131 + k * 7919), a = r() * 6.283, rad = pondR(a) * (0.15 + r() * 0.6);
    const o = proj(px + Math.cos(a) * rad, 0.12, pz + Math.sin(a) * rad), s = 0.13 * Math.pow(Math.sin(Math.PI * u), 4);
    if (s < 0.01) continue;
    g.fillStyle = 'rgba(255,255,255,.95)'; g.beginPath();
    g.moveTo(o[0], o[1] - s); g.lineTo(o[0] + s * 0.18, o[1] - s * 0.18); g.lineTo(o[0] + s, o[1]); g.lineTo(o[0] + s * 0.18, o[1] + s * 0.18);
    g.lineTo(o[0], o[1] + s); g.lineTo(o[0] - s * 0.18, o[1] + s * 0.18); g.lineTo(o[0] - s, o[1]); g.lineTo(o[0] - s * 0.18, o[1] - s * 0.18); g.closePath(); g.fill();
  }
}
function drawPads(g, t) {   // flat pads on the water plane, flowers stand up a little
  g.save(); g.transform(...GROUND_XF); g.translate(0, Math.sin(t * 1.3) * 0.01);
  for (const p of pads) {
    g.beginPath(); g.moveTo(p.x, p.z); g.arc(p.x, p.z, p.s, p.rot + 0.4, p.rot + 2 * Math.PI - 0.4); g.closePath();
    g.lineWidth = OUTW * 0.7; g.strokeStyle = rgb(lin(0x3fb04a).map((v) => v * 0.28)); g.lineJoin = 'round'; g.stroke(); g.fillStyle = shade(0x3fb04a, 1, UP); g.fill();
  }
  g.restore();
  for (const p of pads) if (p.flower) {
    const o = proj(p.x, 0.27, p.z);
    g.beginPath(); g.arc(o[0], o[1], 0.13, 0, 6.283); g.fillStyle = css(0xff8fc8); g.lineWidth = OUTW * 0.6; g.strokeStyle = rgb(lin(0xff8fc8).map((v) => v * 0.28)); g.stroke(); g.fill();
    g.beginPath(); g.arc(o[0], o[1] - 0.04, 0.055, 0, 6.283); g.fillStyle = css(0xffe45a); g.fill();
  }
}

// ==== BUTTERFLIES (flutter over the grass inside the village) =================
function buildButterflies() {
  const r = mulberry32(PARAMS.seed + 91), cols = [0xfff27a, 0xffffff, 0xffb3e6, 0xa9d4ff, 0xffb04a];
  for (let n = 0, made = 0; n < 400 && made < 7; n++) {
    const i = 3 + Math.floor(r() * (N - 6)), j = 3 + Math.floor(r() * (N - 6));
    if (!freeArea(i, j, 1)) continue;
    made++;
    const [ax, az] = tileToWorld(i, j), ph = r() * 6.28, col = cols[made % cols.length], line = rgb(lin(col).map((v) => v * 0.3)), fill = shade(col, 1, UP);
    const e = addEnt(0, (g, t) => {
      const x = ax + Math.sin(t * 0.55 + ph) * 1.3 + Math.sin(t * 1.7 + ph * 2) * 0.25, z = az + Math.cos(t * 0.43 + ph) * 1.1, y = 0.75 + Math.sin(t * 2.3 + ph) * 0.2;
      const o = proj(x, y, z), sh = proj(x, 0, z), flap = 0.25 + 0.75 * Math.abs(Math.cos(t * 17 + ph)), dir = Math.cos(t * 0.55 + ph) >= 0 ? 1 : -1;
      e.k = x + z;
      g.fillStyle = 'rgba(20,40,10,.16)'; g.beginPath(); g.ellipse(sh[0], sh[1], 0.12 * flap, 0.04, 0, 0, 6.283); g.fill();
      g.save(); g.translate(o[0], o[1]); g.scale(dir, 1); g.lineWidth = OUTW * 0.8; g.strokeStyle = line; g.fillStyle = fill;
      for (const s of [-1, 1]) {
        g.beginPath(); g.ellipse(s * 0.075 * flap, -0.03, 0.075 * flap, 0.06, s * 0.5, 0, 6.283); g.stroke(); g.fill();
        g.beginPath(); g.ellipse(s * 0.05 * flap, 0.04, 0.05 * flap, 0.04, -s * 0.4, 0, 6.283); g.stroke(); g.fill();
      }
      g.fillStyle = line; g.fillRect(-0.012, -0.07, 0.024, 0.13);
      g.restore();
    });
  }
}

// ==== SMOKE (puffs from cottage chimneys) ====================================
const SMOKE_COOL = lin(0xb9c9e4);
function drawSmoke(g, t) {
  for (const e of emitters) for (let k = 0; k < 3; k++) {
    const u = (t * 0.32 + e.ph + k / 3) % 1, s = Math.sin(Math.PI * u) * 0.2 + 0.03, o = proj(e.x + u * 0.55 + Math.sin(t + k) * 0.04, e.y + u * 1.5, e.z + u * 0.25);
    g.fillStyle = rgb([1, 1, 1].map((v, i) => lerp(v, SMOKE_COOL[i], u * 0.6))); g.beginPath(); g.arc(o[0], o[1], s * 1.15, 0, 6.283); g.fill();
  }
}

// ==== VILLAGE LIFE: walkers on the roads =====================================
const walkers = [];
function buildWalkers() {
  const kinds = [['villager', { cloth: 0xe0654b }], ['villager', { cloth: 0x7bbf4a }], ['builder'], ['villager', { cloth: 0x9b6bd6, hair: 0xffd53a }], ['villager', { cloth: 0xf2c14e }], ['builder', { cloth: 0xd8432b }], ['villager', { cloth: 0x4fb5c9 }]];
  kinds.forEach(([kind, tint], n) => {
    const path = roadPaths[[0, 1, 2, 3, 2, 1, 3][n]].map(([x, y]) => [x - HALF, y - HALF]), len = [0];
    for (let i = 1; i < path.length; i++) len.push(len[i - 1] + Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]));
    const w = { ch: makeChar(kind, tint), path, len, s: rr(0, len[len.length - 1]), dir: n % 2 ? 1 : -1, sp: rr(0.9, 1.4), x: 0, z: 0, flip: 1 };
    w.e = addEnt(0, (g, t) => { const o = proj(w.x, 0.07, w.z); drawChar(g, w.ch, o[0], o[1], t, true, false, w.flip); });
    walkers.push(w);
  });
}
function updateWalkers(dt) {
  for (const w of walkers) {
    const total = w.len[w.len.length - 1];
    w.s += w.dir * w.sp * dt;
    if (w.s > total || w.s < 0) { w.dir *= -1; w.s = clamp(w.s, 0, total); }
    let i = 1; while (i < w.len.length - 1 && w.len[i] < w.s) i++;
    const f = (w.s - w.len[i - 1]) / Math.max(1e-6, w.len[i] - w.len[i - 1]), [x0, z0] = w.path[i - 1], [x1, z1] = w.path[i];
    w.x = lerp(x0, x1, f); w.z = lerp(z0, z1, f); w.e.k = w.x + w.z;
    const sx = (x1 - x0 - (z1 - z0)) * w.dir; if (Math.abs(sx) > 1e-4) w.flip = sx > 0 ? 1 : -1;   // face the screen direction of travel
  }
}

// ==== CAMERA (pan / zoom, pointer events) ====================================
const canvas = $('c'), ctx = canvas.getContext('2d');
const cam = { x: 0, y: 0.6, z: 1 };           // view centre in screen units, zoom factor
const ppu = () => S0 * cam.z;                 // CSS px per screen unit
const OUTER = rgb(lin(PAL.border).map((v, i) => v * LIT_UP[i]));   // the outer plane of the 3D file: border green, lit like the ground
function resize() {
  DPR = clamp(window.devicePixelRatio || 1, 1.5, 2) * PARAMS.scale;
  canvas.width = Math.round(innerWidth * DPR); canvas.height = Math.round(innerHeight * DPR);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
}
const clampCam = () => { cam.x = clamp(cam.x, -45, 45); cam.y = clamp(cam.y, -32, 32); };
function zoomAt(cx, cy, f) {                  // keep the point under the cursor fixed
  const wx = cam.x + (cx - innerWidth / 2) / ppu(), wy = cam.y + (cy - innerHeight / 2) / ppu();
  cam.z = clamp(cam.z * f, 0.45, 3);
  cam.x = wx - (cx - innerWidth / 2) / ppu(); cam.y = wy - (cy - innerHeight / 2) / ppu();
  clampCam(); scheduleRebake();
}
const ptrs = new Map();
const pinch = () => { const [a, b] = [...ptrs.values()]; return [Math.hypot(a[0] - b[0], a[1] - b[1]), (a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); canvas.style.cursor = 'grabbing'; });
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const d0 = ptrs.size === 2 ? pinch()[0] : 0, dx = e.clientX - p[0], dy = e.clientY - p[1];
  p[0] = e.clientX; p[1] = e.clientY;
  if (ptrs.size === 1) { cam.x -= dx / ppu(); cam.y -= dy / ppu(); clampCam(); }
  else if (ptrs.size === 2 && d0 > 0) { const [d1, mx, my] = pinch(); zoomAt(mx, my, d1 / d0); }
});
const release = (e) => { ptrs.delete(e.pointerId); canvas.style.cursor = 'grab'; };
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
addEventListener('keydown', (e) => { if (e.key === '+' || e.key === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.15); else if (e.key === '-') zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.15); });

// ==== FRAME UPDATE ===========================================================
let T = 0, frames = 0, ground = null;
function update(dt) { T += dt; updateWalkers(dt); }
function render() {
  const W = canvas.width, H = canvas.height, k = DPR * ppu();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = OUTER; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(k, 0, 0, k, W / 2 - cam.x * k, H / 2 - cam.y * k);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const view = [cam.x - W / 2 / k, cam.y - H / 2 / k, cam.x + W / 2 / k, cam.y + H / 2 / k];
  ctx.save(); ctx.transform(R2 / P, R2 * SP / P, -R2 / P, R2 * SP / P, 0, -2 * R2 * SP * (PAD + HALF)); ctx.drawImage(ground.c, 0, 0); ctx.restore();   // painted ground through the iso affine
  drawWater(ctx, T); drawPads(ctx, T); drawSparkles(ctx, T); drawClouds(ctx, T);
  ents.sort((a, b) => a.k - b.k);
  for (const e of ents) e.draw(ctx, T, view);
  drawSmoke(ctx, T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const fg = ctx.createLinearGradient(0, 0, 0, H * 0.45); fg.addColorStop(0, rgba(PAL.haze, 0.2)); fg.addColorStop(1, rgba(PAL.haze, 0));   // far haze (the 3D Fog 72–160, barely visible at rest)
  ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H * 0.45);
  frames++;
}

// ==== DEBUG / TEST HOOKS =====================================================
const app = {
  ready: false,
  frames(n = 1) { for (let i = 0; i < n; i++) { update(1 / 60); render(); } return frames; },
  pose(x, y, z = 1) { cam.x = x; cam.y = y; cam.z = z; clampCam(); if (z !== bakedZ) rebake(z); render(); },
  info: () => ({ frames, ents: ents.length, buildings: buildings.length, walls: wallSet.size, emitters: emitters.length, walkers: walkers.length, BS, S0, DPR, sprites: sprites.length, rebakeMs: Math.round(rebakeMs), initMs: Math.round(initMs), canvas: [canvas.width, canvas.height] }),
};
window.__app = app;

// ==== INIT ===================================================================
let initMs = 0;
function init() {
  const t0 = performance.now();
  resize();
  S0 = clamp(Math.hypot(innerWidth, innerHeight) / 62, 14, 60);
  BS = bakeScale(1); OUTW = 1.7 / S0;    // re-baked by rebake() when the zoom settles; the 3D hull is 1.7 px
  buildMasks();
  ground = paintGround();
  buildClouds();
  for (const [t, i, j] of LAYOUT) addBuilding(t, i, j);
  addWalls();
  scatterNature();
  buildPondLife();
  buildButterflies();
  buildWalkers();
  bakeShadows(ground);
  updateWalkers(0);
  addEventListener('resize', () => { resize(); render(); });
  render();
  initMs = performance.now() - t0;
  app.ready = true;
  if (PARAMS.test) return;
  let last = performance.now(), fpsN = 0, fpsT = 0;
  const loop = (now) => {
    const raw = (now - last) / 1000; last = now;
    update(Math.min(raw, 1 / 15)); render();
    if (PARAMS.debug) { fpsN++; fpsT += raw; if (fpsT > 0.5) { const d = $('dbg'); d.style.display = 'block'; d.textContent = `${Math.round(fpsN / fpsT)} fps · ${ents.length} sprites · rebake ${Math.round(rebakeMs)} ms`; fpsT = fpsN = 0; } }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
try { init(); } catch (e) { showError((e && (e.stack || e.message)) || String(e)); }
</script>
