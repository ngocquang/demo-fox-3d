<!--
================================================================================
  FIRESIDE GRAVEYARD — stylised 3D "creepy-cute" diorama (three.js r186, single file, no build)
================================================================================
  A moonlit graveyard miniature: bonfire plaza of individually modelled cobbles, chibi ghost and
  skeleton, crimson trees, beveled stone gate and wall, iron fence, slate-roofed crypt, lanterns and
  candles. Everything is generated procedurally at startup; only three.js (jsDelivr) and the
  "Cormorant Garamond" web font come from the network (the font has a system fallback).
  Layout coordinates were measured from a reference screenshot (unprojected onto the ground plane
  through the default camera), so the first frame reproduces that composition.

  TECHNIQUES (the numbered tables in index_stylized_3d_diorama.md give line refs; they follow
  the section banners "// ==== ... ====" below)
  - Look: smooth-shaded clay-like props with beveled RoundedBox edges, broad fold-and-bend leaf
    cards, warm-neutral dark grade, restrained bloom, edge-only depth of field, CAS-style sharpen.
  - Geometry: chunked instanced leaf cards with shader wind (and matching shadow depth materials),
    recursive trees with leaves attached along the twigs, instanced 3D cobbles, beveled stone
    blocks, arch of wedge blocks, iron fence, extruded gravestones, planked crypt roof, lathe ghost.
  - World: 4096² canvas ground (mottled lawn, grass strokes, Catmull-Rom dirt paths with grain and
    pebbles, dark cobble underlays), contact-shadow decals in one instanced mesh.
  - Light and FX: shadow-casting moon + bonfire, flickering lanterns, billboard flame tongues,
    lit lumpy smoke column, embers, dust motes, ghost sparkles.
  - Camera: damped orbit with an azimuth-bounded idle drift, animated view presets.
  URL params: ?scale=0.75 (render scale) · ?seed=<n> · ?orbit=0 (no idle drift) · ?debug (FPS, draw calls)
================================================================================
-->

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const bootT0 = performance.now();
const showError = m => { const e = document.getElementById('err'); e.textContent = m; e.style.display = 'grid'; };
addEventListener('error', e => showError('Error: ' + e.message));
addEventListener('unhandledrejection', e => showError('Error: ' + (e.reason && e.reason.message || e.reason)));

// ==== SETUP: RNG, RENDERER, SCENE ====
const params = new URLSearchParams(location.search);
const SCALE = +params.get('scale') || 1;
let seed = +params.get('seed') || 11;
const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];
const TAU = Math.PI * 2;
const PR = Math.min(devicePixelRatio, 2) * SCALE;
const COARSE = matchMedia('(pointer: coarse)').matches;
const DENSITY = COARSE ? 0.6 : 1;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const FIRE = V3(5.3, 0, 3.8);
const uTime = { value: 0 };

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.info.autoReset = false;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090d);
scene.fog = new THREE.FogExp2(0x090b10, 0.011);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.5, 160);

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...o });
const add = (geo, m, x = 0, y = 0, z = 0, parent = scene) => {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  o.castShadow = o.receiveShadow = true;
  parent.add(o);
  return o;
};
const jitter = (g, amt) => {
  const p = g.attributes.position;
  const h = (x, y, z, k) => { const v = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + k) * 43758.5453; return v - Math.floor(v) - 0.5; };
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    p.setXYZ(i, x + h(x, y, z, 0) * amt, y + h(x, y, z, 1) * amt, z + h(x, y, z, 2) * amt);
  }
  g.computeVertexNormals();
  return g;
};
const smooth = g => { g.deleteAttribute('uv'); g.deleteAttribute('normal'); const m = mergeVertices(g, 1e-4); m.computeVertexNormals(); return m; };
const hsl = (h, s, l) => new THREE.Color().setHSL(h, s, l, THREE.SRGBColorSpace);
const boxCache = new Map();
const rbox = (w, h, d, r = 0.04) => {
  const k = [w, h, d, r].join();
  if (!boxCache.has(k)) boxCache.set(k, new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3)));
  return boxCache.get(k);
};
const aoList = [];
const ao = (x, z, r, a = 1) => aoList.push([x, z, r, a]);
const noiseTex = (() => {
  const S = 256, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d'), id = g.createImageData(S, S);
  const octaves = [[8, 0.5], [16, 0.3], [32, 0.2]].map(([n, w]) => ({ n, w, grid: Array.from({ length: n * n }, rand) }));
  const ease = t => t * t * (3 - 2 * t);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let v = 0;
    for (const { n, w, grid } of octaves) {
      const fx = x / S * n, fy = y / S * n, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = ease(fx - x0), ty = ease(fy - y0);
      const at = (i, j) => grid[(j % n) * n + (i % n)];
      v += w * ((at(x0, y0) * (1 - tx) + at(x0 + 1, y0) * tx) * (1 - ty) + (at(x0, y0 + 1) * (1 - tx) + at(x0 + 1, y0 + 1) * tx) * ty);
    }
    const i = (y * S + x) * 4;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v * 255;
    id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();
const bumpFine = noiseTex.clone();
bumpFine.repeat.set(3, 3);
bumpFine.needsUpdate = true;

// ==== POST CHAIN: BLOOM, EDGE DOF, GRADE, SHARPEN ====
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.setPixelRatio(PR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.4, 1.1);
composer.addPass(bloom);
const fsVert = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2() }, uDof: { value: 1 }, uPx: { value: 1 }, uTime: { value: 0 } },
  vertexShader: fsVert,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uDof; uniform float uPx; uniform float uTime; varying vec2 vUv;
    void main() {
      float rad = uDof * smoothstep(0.30, 0.64, abs(vUv.y - 0.5)) * 3.4 * uPx;
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      if (rad > 0.05) {
        for (int i = 0; i < 12; i++) {
          float fi = float(i);
          vec2 o = vec2(cos(fi * 2.39996), sin(fi * 2.39996)) * sqrt((fi + 0.5) / 12.0) * rad / uRes;
          col += texture2D(tDiffuse, vUv + o).rgb;
        }
        col /= 13.0;
      }
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(l), col, 0.97);
      col *= mix(vec3(0.98, 0.99, 1.03), vec3(1.03, 1.0, 0.96), smoothstep(0.0, 0.5, l));
      vec2 q = vUv - 0.5;
      col *= 1.0 - dot(q, q) * 0.9;
      col *= 1.0 + (fract(52.9829189 * fract(dot(gl_FragCoord.xy + fract(uTime) * 61.0, vec2(0.06711056, 0.00583715)))) - 0.5) * 0.012;
      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`,
});

composer.addPass(grade);
composer.addPass(new OutputPass());
const sharpen = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2() }, uAmt: { value: 1 } },
  vertexShader: fsVert,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uAmt; varying vec2 vUv;
    void main() {
      vec2 px = 1.0 / uRes;
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      vec3 n = texture2D(tDiffuse, vUv + vec2(0.0, px.y)).rgb;
      vec3 s = texture2D(tDiffuse, vUv - vec2(0.0, px.y)).rgb;
      vec3 e = texture2D(tDiffuse, vUv + vec2(px.x, 0.0)).rgb;
      vec3 w = texture2D(tDiffuse, vUv - vec2(px.x, 0.0)).rgb;
      vec3 mx = max(c, max(max(n, s), max(e, w)));
      vec3 mn = min(c, min(min(n, s), min(e, w)));
      vec3 amp = sqrt(clamp(min(mn, 1.0 - mx) / max(mx, 1e-3), 0.0, 1.0));
      vec3 k = amp * -0.16 * uAmt;
      gl_FragColor = vec4((c + (n + s + e + w) * k) / (1.0 + 4.0 * k), 1.0);
    }`,

const fitPost = () => {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1.2 ? 42 : 30;
  camera.updateProjectionMatrix();
  grade.uniforms.uRes.value.set(innerWidth * PR, innerHeight * PR);
  grade.uniforms.uPx.value = PR;
  sharpen.uniforms.uRes.value.set(innerWidth * PR, innerHeight * PR);
};
fitPost();
addEventListener('resize', fitPost);

// ==== LIGHTS ====
scene.add(new THREE.HemisphereLight(0x8a93a6, 0x4d3b2a, 1.75));
const moon = new THREE.DirectionalLight(0xb6c2e6, 1.5);
moon.position.set(-13, 22, -9);
moon.castShadow = true;
moon.shadow.mapSize.set(COARSE ? 2048 : 4096, COARSE ? 2048 : 4096);
Object.assign(moon.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 60 });
moon.shadow.bias = -0.0006;
moon.shadow.normalBias = 0.03;
moon.shadow.radius = 2;
scene.add(moon);
const fireLight = new THREE.PointLight(0xff8a3c, 42, 18, 2);
fireLight.position.set(FIRE.x, 1.0, FIRE.z);
fireLight.castShadow = true;
fireLight.shadow.mapSize.set(1024, 1024);
fireLight.shadow.camera.near = 0.3;
fireLight.shadow.camera.far = 18;
fireLight.shadow.bias = -0.003;
fireLight.shadow.normalBias = 0.02;
fireLight.shadow.radius = 3;
scene.add(fireLight);
const flickers = [];

// ==== LAYOUT: PATHS, PLAZAS, KEEP-OUT ZONES ====
const curve = pts => new THREE.CatmullRomCurve3(pts.map(([x, z]) => V3(x, 0, z)), false, 'centripetal');
const PATHS = [
  [[-11, 5.7], [-9.6, 4.9], [-8, 3.7], [-6.3, 2.5], [-5.2, 1.2]],
  [[-6.3, 0], [-6.1, -1.9], [-3.9, -2.5], [-1.5, -1.8], [-1, 0], [-1.5, 1.9], [-3.5, 2.3], [-5.6, 1.8], [-6.3, 0]],
  [[-4.8, -2.1], [-4.9, -3.5], [-4.7, -5.2], [-3.5, -7], [-2.3, -9], [-1.9, -12.5]],
  [[-5.2, 1.2], [-2.9, 2.6], [-0.7, 3.6], [1.3, 4.3]],
  [[-2.1, 0.8], [-0.5, 0.7], [1, 1.2], [2.8, 1.3], [5, 0.9]],
  [[5, 0.9], [5.9, -1.6], [6.4, -4.2], [6.1, -7], [5.9, -9.8], [6, -12.5]],
  [[6.5, -0.2], [8.6, -1.3], [10.1, -1.8], [12.1, -2.2], [13.6, -2.4]],
].map(curve);
const PATH_W = 3;
const pathPts = PATHS.flatMap(c => c.getSpacedPoints(160));
const distPath = (x, z) => { let m = 1e9; for (const p of pathPts) { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < m) m = d; } return Math.sqrt(m); };
const blob = (cx, cz, rx, rz, wob = 0.1) => (x, z) => {
  const u = (x - cx) / rx, v = (z - cz) / rz, a = Math.atan2(v, u);
  return Math.max(0, 1 - Math.hypot(u, v) / (1 + wob * (Math.sin(a * 5 + 1.3) + 0.6 * Math.sin(a * 9 + 0.4))));

  const u = (z - cz) / (l / 2);

  return Math.max(0, 1 - Math.abs(x - cx) / ((w / 2) * Math.sqrt(1 - u * u) * (0.62 + 0.38 * (u + 1) / 2)));
};
const ZONES = {
  fire: { f: blob(6.8, 3.7, 4, 2.9, 0.09), box: [2.5, 0.5, 11.5, 7], under: '#2b241f' },
  top: { f: blob(1.3, -8.8, 5.6, 3.4, 0.06), box: [-4.6, -12.5, 7.2, -5], under: '#1b1c26' },
  teardropA: { f: tear(-3.7, 0.1, 2.2, 2.9), box: [-5, -1.5, -2.3, 1.7], under: '#1c1a1f' },
  teardropB: { f: tear(-0.8, -0.4, 1.7, 2.3), box: [-1.8, -1.6, 0.2, 0.8], under: '#1c1a1f' },
  crypt: { f: blob(8.2, -3.3, 1.5, 1.1, 0.15), box: [6.5, -4.6, 9.9, -2], under: '#25211f' },
};
const inPlaza = (x, z) => ZONES.fire.f(x, z) > 0 || ZONES.top.f(x, z) > 0;
const WALL = [[-8.6, 0.5], [-6.8, 1.5], [-5.9, 3.1], [-4.7, 4.2], [-3.1, 5.3]];

    arm.scale.set(0.9, 2.1, 1.2);
    arm.rotation.z = -s * 0.5;

  }
  ghost.position.set(-1.4, 0.4, 2.8);
  ghost.scale.setScalar(1.15);
  scene.add(ghost);
}
const skeleton = new THREE.Group();
const arms = [], legs = [];

{

  for (const y of [0.6, 0.7, 0.8, 0.9, 1.0]) add(new THREE.TorusGeometry(0.14, 0.02, 8, 18).rotateX(Math.PI / 2), boneMat, 0, y, 0, skeleton).scale.set(1, 1, 0.8);

}
{
  const g = new THREE.Group(), wood = std(0x4a3222, { roughness: 0.88, bumpMap: bumpFine, bumpScale: 2 });
  g.position.set(8.1, 0, 4.4);
  g.rotation.y = -0.6;
  add(rbox(1.1, 0.34, 0.85, 0.04), wood, 0, 0.17, 0, g).rotation.y = 0.1;

// ==== FX: FLAMES, EMBERS, SMOKE, DUST, SPARKLES ====
const billboards = (n, frag, blending, order) => {
  const base = new THREE.PlaneGeometry(1, 1), geo = new THREE.InstancedBufferGeometry();
  geo.index = base.index;
  geo.setAttribute('position', base.attributes.position);
  geo.setAttribute('uv', base.attributes.uv);
  const pos = new Float32Array(n * 3), dat = new Float32Array(n * 4);
  const aPos = new THREE.InstancedBufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage), aDat = new THREE.InstancedBufferAttribute(dat, 4).setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aPos', aPos);
  geo.setAttribute('aDat', aDat);
  geo.instanceCount = n;
  const mesh = new THREE.Mesh(geo, new THREE.ShaderMaterial({
    uniforms: { uTime },
    vertexShader: `attribute vec3 aPos; attribute vec4 aDat; varying vec2 vUv; varying vec4 vDat;
      void main() { vUv = uv; vDat = aDat; vec4 mv = modelViewMatrix * vec4(aPos, 1.0); mv.xy += position.xy * aDat.yz; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: frag, transparent: true, depthWrite: false, blending,
  }));
  mesh.frustumCulled = false;
  mesh.renderOrder = order;
  scene.add(mesh);
  return { pos, dat, touch: () => { aPos.needsUpdate = aDat.needsUpdate = true; } };
};
const FRAG_HEAD = 'uniform float uTime; varying vec2 vUv; varying vec4 vDat;\n';
const NOISE = `float h21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
  float fbm(vec2 p) { return 0.5 * vnoise(p) + 0.25 * vnoise(p * 2.03) + 0.125 * vnoise(p * 4.1) + 0.0625 * vnoise(p * 8.3); }`;
const flameFx = billboards(20, FRAG_HEAD + `
  void main() {
    float y = vUv.y, x = (vUv.x - 0.5) * 2.0, seed = vDat.w, life = vDat.x;
    float wob = sin(y * 7.0 + seed * 20.0 + uTime * 8.0) * 0.12 * y;
    float hw = mix(0.78, 0.05, pow(y, 1.3)) * (0.75 + 0.25 * sin(y * 5.0 + seed * 9.0 + uTime * 6.0));
    float shape = smoothstep(1.0, 0.35, abs(x - wob) / max(hw, 0.02)) * smoothstep(0.0, 0.12, y) * (1.0 - smoothstep(0.75, 1.0, y));
    float streak = 0.5 + 0.5 * sin(x * 18.0 + seed * 40.0 + y * 3.0 - uTime * 3.0);
    vec3 c = mix(vec3(1.4, 0.76, 0.18), vec3(1.15, 0.38, 0.06), smoothstep(0.0, 0.45, y));
    c = mix(c, vec3(0.65, 0.09, 0.01), smoothstep(0.45, 1.0, y));
    gl_FragColor = vec4(c, shape * streak * smoothstep(0.0, 0.15, life) * (1.0 - smoothstep(0.7, 1.0, life)) * 0.6);
  }`, THREE.AdditiveBlending, 4);
const smokeFx = billboards(90, FRAG_HEAD + NOISE + `
  void main() {
    vec2 p = vUv * 2.0 - 1.0; float r = length(p), seed = vDat.w, life = vDat.x;
    float nz = fbm(p * 3.2 + seed * 10.0 + uTime * 0.05);
    float a = smoothstep(1.0, 0.1 + 0.3 * nz, r + (nz - 0.5) * 0.55);
    vec3 nrm = normalize(vec3(p, sqrt(max(0.0, 1.0 - r * r))));
    float fireLit = max(0.0, dot(nrm, normalize(vec3(0.0, -0.8, 0.5)))) * (1.0 - smoothstep(0.0, 0.5, life));
    float moonLit = max(0.0, dot(nrm, normalize(vec3(-0.5, 0.6, 0.6)))) * 0.05;
    vec3 col = vec3(0.009, 0.008, 0.008) + vec3(1.5, 0.55, 0.14) * fireLit * 0.6 + vec3(0.4, 0.5, 0.8) * moonLit * 0.6;
    gl_FragColor = vec4(col, a * smoothstep(0.0, 0.1, life) * (1.0 - smoothstep(0.55, 1.0, life)) * 1.0);
  }`, THREE.NormalBlending, 2);
const emberFx = billboards(40, FRAG_HEAD + `
  void main() {
    float d = length(vUv - 0.5) * 2.0, life = vDat.x;
    float a = smoothstep(1.0, 0.0, d); a *= a;
    vec3 c = mix(vec3(4.5, 1.8, 0.4), vec3(1.5, 0.2, 0.0), life);
    gl_FragColor = vec4(c, a * smoothstep(0.0, 0.08, life) * (1.0 - smoothstep(0.6, 1.0, life)) * (0.6 + 0.4 * sin(uTime * 20.0 + vDat.w * 50.0)));
  }`, THREE.AdditiveBlending, 5);
const dustFx = billboards(160, FRAG_HEAD + `
  void main() {
    float d = length(vUv - 0.5) * 2.0, a = smoothstep(1.0, 0.0, d);
    gl_FragColor = vec4(vec3(0.75, 0.85, 1.0) * 1.7, a * a * (0.55 + 0.45 * sin(uTime * 1.7 + vDat.w * 40.0)) * 0.55);
  }`, THREE.AdditiveBlending, 6);
const sparkFx = billboards(22, FRAG_HEAD + `
  void main() {
    float d = length(vUv - 0.5) * 2.0, life = vDat.x, a = smoothstep(1.0, 0.0, d);
    gl_FragColor = vec4(vec3(1.4, 1.5, 1.8), a * a * smoothstep(0.0, 0.1, life) * (1.0 - life) * 0.9);
  }`, THREE.AdditiveBlending, 6);
const flames = Array.from({ length: 20 }, () => ({ life: rand(), span: 0.5, ox: 0, oz: 0, w: 0.3, h: 1, seed: rand() }));
const newFlame = f => { const a = rand() * TAU, d = Math.sqrt(rand()) * 0.45; f.ox = Math.cos(a) * d; f.oz = Math.sin(a) * d; f.w = rr(0.8, 1.4); f.h = rr(0.75, 1.25); f.life = 0; f.span = rr(0.35, 0.7); };
flames.forEach(f => { newFlame(f); f.life = rand(); });
const smokes = Array.from({ length: 90 }, () => ({ life: rand(), span: 7, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s1: 3, seed: rand() }));
const newSmoke = s => { s.x = FIRE.x + rr(-0.2, 0.2); s.y = 0.9 + rr(0, 0.25); s.z = FIRE.z + rr(-0.2, 0.2); s.vx = rr(0.1, 0.3); s.vy = rr(0.5, 0.75); s.vz = rr(-0.4, -0.15); s.span = rr(4.5, 6.5); s.s1 = rr(1.6, 2.3); s.life = 0; };
smokes.forEach(s => { newSmoke(s); s.life = rand(); s.x += s.vx * s.life * s.span; s.y += s.vy * s.life * s.span; s.z += s.vz * s.life * s.span; });
const embers = Array.from({ length: 40 }, () => ({ life: rand(), span: 2, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, seed: rand() }));
const newEmber = e => { e.x = FIRE.x + rr(-0.25, 0.25); e.y = 0.6; e.z = FIRE.z + rr(-0.25, 0.25); e.vx = rr(-0.6, 0.6) + 0.35; e.vy = rr(1, 2.4); e.vz = rr(-0.6, 0.6); e.span = rr(1.4, 3); e.life = 0; };
embers.forEach(e => { newEmber(e); e.life = rand(); });
const dusts = Array.from({ length: 160 }, () => ({ x: rr(-16, 17), y: rr(0.2, 4.5), z: rr(-12, 10), seed: rand() }));
const sparks = Array.from({ length: 22 }, () => ({ life: 1 + rand(), span: 1.6, x: 0, y: 0, z: 0, vy: 0.2, seed: rand() }));

// ==== CAMERA AND UI ====
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enablePan: false, enableDamping: true, dampingFactor: 0.06, minDistance: 9, maxDistance: 42, minPolarAngle: 0.3, maxPolarAngle: 1.32, autoRotate: params.get('orbit') !== '0', autoRotateSpeed: 0.4 });
const views = [
  { p: [0, 21, 15.3], t: [0, 0, 0] },
  { p: [10.5, 6.5, 13], t: [5.3, 0.8, 3.8] },
  { p: [-13, 10, 9], t: [-4, 0, 0.5] },
  { p: [2, 34, 7], t: [2, 0, -1] },
];
camera.position.set(...views[0].p);
controls.target.set(...views[0].t);
const recenter = () => {
  const b = controls.getAzimuthalAngle();
  controls.minAzimuthAngle = b - 0.35;
  controls.maxAzimuthAngle = b + 0.35;
};
controls.update();
recenter();
controls.addEventListener('start', () => { controls.minAzimuthAngle = -Infinity; controls.maxAzimuthAngle = Infinity; });
controls.addEventListener('end', recenter);
let flight = null, view = 0;
const goTo = i => {
  flight = { t0: performance.now(), p0: camera.position.clone(), a0: controls.target.clone(), p1: V3(...views[i].p), a1: V3(...views[i].t) };
  controls.minAzimuthAngle = -Infinity; controls.maxAzimuthAngle = Infinity;
};
const $ = s => document.querySelector(s);
const setOrbit = on => { controls.autoRotate = on; $('#cb-orbit').checked = on; $('#b-lock').classList.toggle('on', on); };
setOrbit(controls.autoRotate);
$('#tools').onclick = () => $('#panel').classList.toggle('open');
$('#cb-bloom').onchange = e => { bloom.enabled = e.target.checked; };
$('#cb-dof').onchange = e => { grade.uniforms.uDof.value = e.target.checked ? 1 : 0; };
$('#cb-sharp').onchange = e => { sharpen.uniforms.uAmt.value = e.target.checked ? 1 : 0; };
$('#cb-orbit').onchange = e => setOrbit(e.target.checked);
$('#b-view').onclick = () => goTo(view = (view + 1) % views.length);
$('#b-lock').onclick = () => setOrbit(!controls.autoRotate);
$('#b-help').onclick = () => $('#hint').classList.toggle('show');

// ==== LOOP ====
const leafCount = flushLeaves();
{
  const m = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture((() => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 128;
    const g = cv.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.5, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return cv;
  })()), transparent: true, opacity: 0.42, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }), aoList.length);
  const o = new THREE.Object3D();
  aoList.forEach(([x, z, r, a], i) => { o.position.set(x, 0.02, z); o.scale.setScalar(r * 2 * a); o.updateMatrix(); m.setMatrixAt(i, o.matrix); });
  m.frustumCulled = false;
  scene.add(m);
}
const timer = new THREE.Timer();
timer.connect(document);
const dbg = params.has('debug') ? $('#dbg') : null;
const app = window.__app = { frames: 0, scene, camera, renderer, controls };
let fpsT = 0, fpsN = 0, sparkT = 0;
renderer.setAnimationLoop(() => {
  timer.update();
  const dt = Math.min(timer.getDelta(), 0.05), t = timer.getElapsed();
  uTime.value = t;
  if (flight) {
    const u = Math.min(1, (performance.now() - flight.t0) / 1400), e = 1 - (1 - u) ** 3;
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.a0, flight.a1, e);
    if (u === 1) { flight = null; controls.update(); recenter(); }
  } else if (controls.autoRotate) {
    const a = controls.getAzimuthalAngle();
    if (a <= controls.minAzimuthAngle + 0.02) controls.autoRotateSpeed = -Math.abs(controls.autoRotateSpeed);
    else if (a >= controls.maxAzimuthAngle - 0.02) controls.autoRotateSpeed = Math.abs(controls.autoRotateSpeed);
  }
  controls.update();

  fireLight.intensity = 42 * (0.85 + 0.15 * Math.sin(t * 13) * Math.sin(t * 7.3) + 0.1 * Math.sin(t * 31));
  flickers.forEach(f => { f.l.intensity = f.b * (0.88 + 0.12 * Math.sin(t * 9 + f.ph) * Math.sin(t * 5.1 + f.ph)); });

  const gt = t * 0.22, gx = -1.4 + Math.sin(gt) * 1.7, gz = 2.8 + Math.sin(gt * 1.7 + 1) * 0.55;
  ghost.position.set(gx, 0.4 + Math.sin(t * 1.7) * 0.08, gz);
  ghost.rotation.set(Math.sin(t * 1.3) * 0.04, Math.atan2(skeleton.position.x - gx, skeleton.position.z - gz), -Math.cos(gt) * 0.08);
  skeleton.position.y = 0.02 + Math.abs(Math.sin(t * 2.2)) * 0.015;
  skeleton.rotation.y = Math.atan2(gx - skeleton.position.x, gz + 4 - skeleton.position.z);
  skull.rotation.set(0.2 + Math.sin(t * 1.7) * 0.05, Math.sin(t * 0.9) * 0.18, Math.sin(t * 1.3) * 0.1);
  arms[0].rotation.z = -0.2 + Math.sin(t * 1.5) * 0.05;
  arms[1].rotation.z = 0.2 + Math.sin(t * 1.4 + 1) * 0.05;
  legs.forEach((l, i) => { l.rotation.x = Math.sin(t * 1.4 + i * Math.PI) * 0.03; });

  flames.forEach((f, i) => {
    f.life += dt / f.span;
    if (f.life >= 1) newFlame(f);
    const k = 1 + 0.14 * Math.sin(t * 11 + f.seed * 40), j = i * 3, q = i * 4;
    flameFx.pos[j] = FIRE.x + f.ox + 0.05 * Math.sin(t * 7 + f.seed * 30); flameFx.pos[j + 1] = 0.5 + f.h * k * 0.5; flameFx.pos[j + 2] = FIRE.z + f.oz;
    flameFx.dat[q] = f.life; flameFx.dat[q + 1] = f.w; flameFx.dat[q + 2] = f.h * k; flameFx.dat[q + 3] = f.seed;
  });
  smokes.forEach((s, i) => {
    s.life += dt / s.span;
    if (s.life >= 1) newSmoke(s);
    s.vx += Math.sin(t * 0.5 + s.seed * 20) * 0.1 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    const size = 0.65 + (s.s1 - 0.65) * (1 - (1 - s.life) ** 2), j = i * 3, q = i * 4;
    smokeFx.pos[j] = s.x; smokeFx.pos[j + 1] = s.y; smokeFx.pos[j + 2] = s.z;
    smokeFx.dat[q] = s.life; smokeFx.dat[q + 1] = size; smokeFx.dat[q + 2] = size; smokeFx.dat[q + 3] = s.seed;
  });
  embers.forEach((e, i) => {
    e.life += dt / e.span;
    if (e.life >= 1) newEmber(e);
    e.vx += Math.sin(t * 2 + e.seed * 30) * 0.8 * dt;
    e.x += e.vx * dt; e.y += e.vy * dt; e.z += e.vz * dt;
    const j = i * 3, q = i * 4, sz = 0.07 - 0.04 * e.life;
    emberFx.pos[j] = e.x; emberFx.pos[j + 1] = e.y; emberFx.pos[j + 2] = e.z;
    emberFx.dat[q] = e.life; emberFx.dat[q + 1] = sz; emberFx.dat[q + 2] = sz; emberFx.dat[q + 3] = e.seed;
  });
  dusts.forEach((d, i) => {
    d.x += Math.sin(t * 0.3 + d.seed * 20) * 0.12 * dt + 0.05 * dt;
    d.y += Math.sin(t * 0.5 + d.seed * 30) * 0.08 * dt;
    if (d.x > 17) d.x = -16;
    const j = i * 3, q = i * 4;
    dustFx.pos[j] = d.x; dustFx.pos[j + 1] = d.y; dustFx.pos[j + 2] = d.z;
    dustFx.dat[q] = 0.5; dustFx.dat[q + 1] = dustFx.dat[q + 2] = 0.05 + d.seed * 0.03; dustFx.dat[q + 3] = d.seed;
  });
  sparkT += dt;
  sparks.forEach((s, i) => {
    s.life += dt / s.span;
    if (s.life >= 1 && sparkT > 0.08) { sparkT = 0; s.x = ghost.position.x + rr(-0.5, 0.5); s.y = ghost.position.y + rr(0.2, 1.3); s.z = ghost.position.z + rr(-0.4, 0.4); s.life = 0; s.span = rr(1.2, 2.2); }
    s.y += s.vy * dt;
    const j = i * 3, q = i * 4, sz = s.life >= 1 ? 0 : 0.06;
    sparkFx.pos[j] = s.x; sparkFx.pos[j + 1] = s.y; sparkFx.pos[j + 2] = s.z;
    sparkFx.dat[q] = Math.min(s.life, 1); sparkFx.dat[q + 1] = sparkFx.dat[q + 2] = sz; sparkFx.dat[q + 3] = s.seed;
  });
  for (const fx of [flameFx, smokeFx, emberFx, dustFx, sparkFx]) fx.touch();

  renderer.info.reset();
  composer.render();
  if (!app.frames) { app.boot = Math.round(performance.now() - bootT0); document.getElementById('boot').classList.add('done'); }
  app.frames++;
  if (dbg) {
    fpsN++; fpsT += dt;
    if (fpsT > 0.5) { dbg.textContent = `${Math.round(fpsN / fpsT)} fps · ${renderer.info.render.calls} draws · ${leafCount} leaves`; fpsT = fpsN = 0; }
  }
});
</script>
