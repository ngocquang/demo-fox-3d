<!DOCTYPE html>
<!--
================================================================================
  FOREST POND — photoreal real-time three.js scene (r169, single file, no build)
================================================================================
  Mood reference: red fox in a dense deciduous forest — deep shade, hard dappled
  sunbeams through a heavy canopy, warm rim light, dark loam and roots in front,
  bright backlit leaves at the edges. Everything is generated procedurally at
  startup; only three.js (+ its Helvetiker font for the "ZPS" text) comes from
  the CDN, plus an optional HDRI. Every network asset has a local fallback.

  TECHNIQUES (search for the section banners "// ==== ... ====" below)
  - Renderer: HDR (half-float) scene target + float depth texture, ACES Filmic,
    sRGB out, PCFSoft 4096² sun shadow map fitted around the pond. SMAA instead
    of MSAA. Optional auto render-scale to hold 60 fps.
  - Lighting: warm low sun from behind-left (rim light), hemisphere fill, IBL
    from a PMREM env map (HDRI if reachable, else a procedural sky+canopy env).
    Dappled light is REAL canopy shadow: thousands of alpha-tested leaf-cluster
    cards cast into the shadow map (with the same wind sway as the visible ones).
  - Post (EffectComposer): depth-only GTAO (half res) → shadow-map ray-marched
    volumetric light (half res, works above & below water) + screen-space radial
    god rays through the canopy occlusion mask (quarter res) → bloom → gather
    bokeh DoF with autofocus → GPU auto-exposure + ACES → SMAA → colour grade
    (teal shadows / warm highlights, contrast, vignette, 2% grain, underwater
    wobble + chromatic aberration, lens droplets).
  - Water: 256² grid, 4 Gerstner waves + FBM in the vertex shader, ring ripples
    (fish gulps, bubbles, camera splashes), two scrolling normal maps, planar
    reflection (oblique-clipped mirror camera, half res), refraction from a copy
    of the opaque HDR frame + linear depth, Beer–Lambert absorption, Schlick
    Fresnel (IOR 1.33), GGX sun glint + sparkle, shoreline foam/scum, pollen
    film, floating leaves riding the same wave function. From below: total
    internal reflection + a refracted Snell's window.
  - Caustics: animated caustic function projected along the sun direction onto
    every surface below the water line, multiplied into the (already shadowed)
    sun term, so they only appear inside sunlit patches.
  - Materials: every standard material is patched via onBeforeCompile (world
    fog split into air/water segments, wet band above the waterline, wet look
    below it, caustics, underwater light absorption). Rocks use triplanar PBR +
    moss on up-facing normals + parallax occlusion on the largest ones.
    Foliage: wind sway (trunk + flutter), crown normals, back-lit translucency.
  - Fish: instanced procedural bodies, vertex-shader spine wave, fin flutter,
    MeshPhysicalMaterial (clearcoat, sheen, iridescence) with procedural koi /
    trout patterns + scale normal map; boids with obstacle avoidance, startle,
    idle hover and surface gulps.
  - Trees: 40 hero trees (beech / oak / alder) — recursive branching, root
    flares, bark displacement on the near LOD, 3 LOD levels — plus instanced
    impostor billboards and a hazy tree-line wall for the far forest.
  - Camera: 90 s Catmull-Rom cinematic (roots → surface glide → dive → fish →
    Snell's window → resurface → orbit), handheld noise, fish-tracking focus.
    F toggles free fly (WASD + mouse, Shift sprint, Space/C up/down).

  SWAPPING IN REAL ASSETS LATER (look for "ASSET HOOK")
  - HDRI: HDRI_CANDIDATES (or ?hdri=<url>) — any equirect .hdr (Poly Haven etc).
  - PBR textures: bakeAllTextures() returns {map, normalMap, ormMap} per surface;
    replace an entry with TextureLoader results (map = sRGB, others linear,
    ORM = AO/roughness/metal in R/G/B, height in the albedo alpha where used).
  - Leaf / litter / fern / grass atlases: makeCanvasAtlases().
  - Fish / fox: buildFishGeometry() / buildFox() — load a GLTF instead and keep
    patchWorldMaterial() (+ the fish spine patch) on its materials.
  URL params: ?t=<sec> start time · ?free · ?tex=1024 · ?shadow=2048 ·
              ?scale=0.75 · ?nohdri · ?hdri=<url> · ?seed=<n> ·
              ?test (no animation loop; drive frames via window.__app for capture)
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">

<script type="importmap">

<script type="module">
// ==== IMPORTS ================================================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

// ==== ERROR SURFACE ==========================================================
const errBox = document.getElementById('err');
function showError(msg) {
  errBox.style.display = 'block';
  errBox.textContent = 'Something went wrong while building the scene:\n\n' + msg;
  console.error(msg);
}
window.addEventListener('error', (e) => showError(e.message || String(e)));
window.addEventListener('unhandledrejection', (e) => showError((e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)));

// ==== PARAMETERS =============================================================
const QS = new URLSearchParams(location.search);
const PARAMS = {
  texSize: +QS.get('tex') || 2048,          // procedural PBR map resolution
  shadowSize: +QS.get('shadow') || 4096,    // sun shadow map
  startTime: QS.has('t') ? +QS.get('t') : 0,
  free: QS.has('free'),
  hdri: QS.get('hdri'),
  noHdri: QS.has('nohdri'),
  scale: QS.has('scale') ? +QS.get('scale') : null,
  seed: +QS.get('seed') || 20240917,
  test: QS.has('test'),                      // deterministic stepping for automated screenshots
};
const WATER_LEVEL = 0.0;
const LOOP_DURATION = 90;

// ==== SMALL UTILITIES ========================================================
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(seed);
  return {
    next: r,
    range: (a, b) => a + (b - a) * r(),
    int: (a, b) => Math.floor(a + (b - a + 1) * r()),
    pick: (arr) => arr[Math.floor(r() * arr.length)],
    sign: () => (r() < 0.5 ? -1 : 1),
    gauss: () => { let u = 0, v = 0; while (u === 0) u = r(); while (v === 0) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v); },
  };
}
const rng = makeRng(PARAMS.seed);

// Improved Perlin noise (CPU side: terrain, placement, camera shake)
const Noise = (() => {
  const p = new Uint8Array(512);
  const r = mulberry32(PARAMS.seed ^ 0x9e3779b9);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const g2 = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  function n2(x, y) {
    let X = Math.floor(x), Y = Math.floor(y); x -= X; y -= Y; X &= 255; Y &= 255;
    const u = fade(x), v = fade(y), a = p[X] + Y, b = p[X + 1] + Y;
    return lerp(lerp(g2(p[a], x, y), g2(p[b], x - 1, y), u), lerp(g2(p[a + 1], x, y - 1), g2(p[b + 1], x - 1, y - 1), u), v);
  }
  const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
  function n3(x, y, z) {
    let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;
    const u = fade(x), v = fade(y), w = fade(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return lerp(
      lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
      lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
  }
  function fbm2(x, y, oct = 5) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * n2(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; } return s / n; }
  function fbm3(x, y, z, oct = 5) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f + i * 7.7); n += a; a *= 0.5; f *= 2.07; } return s / n; }
  return { n2, n3, fbm2, fbm3 };
})();

// ==== LOADING UI =============================================================
const loadMsg = document.getElementById('loadmsg');
const loadBar = document.getElementById('loadbar');
async function setLoading(msg, frac) {
  loadMsg.textContent = msg;
  loadBar.style.width = Math.round(frac * 100) + '%';
  await nextFrame();
}

// ==== RENDERER / SCENE / CAMERA ==============================================
const renderer = new THREE.WebGLRenderer({ antialias: false, stencil: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Physically based light units are the default since r155 (useLegacyLights removed in r165).
// Tone mapping is applied by ToneMapPass, which reads these two settings every frame.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;             // updated once per frame, right before the main pass
renderer.domElement.tabIndex = 0;
document.body.appendChild(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();          // lit world (opaque pass + reflections)
const overlayScene = new THREE.Scene();   // water surface + particles, drawn over the opaque HDR frame
const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.05, 420);
camera.position.set(2, 0.5, 14);
scene.add(camera);

// Render layers: 0 = main camera sees everything. The planar-reflection camera only
// sees objects that opted into LAYER_REFLECT_ABOVE (world above the water) or
// LAYER_REFLECT_BELOW (pond bed, fish, rocks: total internal reflection from below).
const LAYER_REFLECT_ABOVE = 1;
const LAYER_REFLECT_BELOW = 2;
function reflectLayers(obj, above = true, below = false) {
  obj.traverse((o) => { if (above) o.layers.enable(LAYER_REFLECT_ABOVE); if (below) o.layers.enable(LAYER_REFLECT_BELOW); });
  return obj;
}

// ==== SHARED UNIFORMS ========================================================
// Every patched material / custom shader references these same {value} objects.
const U = {
  uTime: { value: 0 },
  uWaterLevel: { value: WATER_LEVEL },
  uSunDir: { value: new THREE.Vector3(-0.45, 0.57, -0.68).normalize() },   // direction TO the sun
  uSunColor: { value: new THREE.Color(1, 0.88, 0.69) },                    // linear, pre-multiplied by intensity
  uSunTint: { value: new THREE.Color(1, 0.88, 0.69) },                     // unit-ish sun colour for sky shading
  uSkyZenith: { value: new THREE.Color(0.24, 0.42, 0.78) },
  uSkyHorizon: { value: new THREE.Color(0.78, 0.84, 0.88) },
  uSkyGround: { value: new THREE.Color(0.02, 0.022, 0.016) },
  uAmbient: { value: new THREE.Color(0.03, 0.04, 0.035) },                 // approx. ambient irradiance at the pond
  uWind: { value: new THREE.Vector4(0.8, 0.6, 1.0, 0.0) },                  // dir.xy, strength, gust
  uCausticStrength: { value: 1.0 },
  uFogMode: { value: 0 },            // 0 camera above water, 1 camera underwater, 2 underwater mirror pass
  uAirFogColor: { value: new THREE.Color(0.018, 0.026, 0.022) },
  uAirFogDensity: { value: 0.016 },
  uWaterFogColor: { value: new THREE.Color(0.030, 0.050, 0.032) },
  uWaterFogDensity: { value: 0.19 },
  uWaterAbsorbLight: { value: new THREE.Vector3(0.55, 0.16, 0.32) },      // light extinction per metre (r,g,b)
  uWaterAbsorb: { value: new THREE.Vector3(1.25, 0.42, 0.78) },           // view-path absorption per metre
  uMurk: { value: 0.55 },
  uWaveStrength: { value: 1.0 },
  uRipples: { value: Array.from({ length: 16 }, () => new THREE.Vector4(0, 0, -100, 0)) },
  uShadowMap: { value: null },
  uShadowMatrix: { value: new THREE.Matrix4() },
  uShadowOutside: { value: 0.12 },   // assumed canopy transmittance outside the shadow frustum
};
const SUN_OUTSIDE_VIS = '0.12';

// ==== GLSL LIBRARY ===========================================================
const GLSL_NOISE = /* glsl */`
float hash11(float p) { p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3) { p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
vec3 hash32(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
vec3 hash33(vec3 p3) { p3 = fract(p3 * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y);
}
float gnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 ga = hash22(i) * 2.0 - 1.0, gb = hash22(i + vec2(1.0, 0.0)) * 2.0 - 1.0;
  vec2 gc = hash22(i + vec2(0.0, 1.0)) * 2.0 - 1.0, gd = hash22(i + vec2(1.0, 1.0)) * 2.0 - 1.0;
  float va = dot(ga, f), vb = dot(gb, f - vec2(1.0, 0.0)), vc = dot(gc, f - vec2(0.0, 1.0)), vd = dot(gd, f - vec2(1.0, 1.0));
  return (va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * (va - vb - vc + vd)) * 1.4;
}
float vnoise3(vec3 p) {
  vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i + vec3(1, 0, 0)), u.x), mix(hash13(i + vec3(0, 1, 0)), hash13(i + vec3(1, 1, 0)), u.x), u.y),
             mix(mix(hash13(i + vec3(0, 0, 1)), hash13(i + vec3(1, 0, 1)), u.x), mix(hash13(i + vec3(0, 1, 1)), hash13(i + vec3(1, 1, 1)), u.x), u.y), u.z);
}
float fbm2(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; }
  return s / 0.96875;
}
float fbm3(vec3 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 4; i++) { s += a * vnoise3(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; }
  return s / 0.9375;
}
float IGN(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
// 4x4 ordered dither: its period fits inside the ±3 px bilateral blur, so it averages out
float bayer4(vec2 p) {
  const float m[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
  ivec2 i = ivec2(mod(p, 4.0));
  return (m[i.x + i.y * 4] + 0.5) / 16.0;
}
`;

// Tileable (periodic) noise for texture baking: P = lattice period in cells.
const GLSL_PERIODIC = /* glsl */`
float vnoiseP(vec2 p, vec2 P) {
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(mod(i, P)), hash12(mod(i + vec2(1.0, 0.0), P)), u.x),
             mix(hash12(mod(i + vec2(0.0, 1.0), P)), hash12(mod(i + vec2(1.0, 1.0), P)), u.x), u.y);
}
float gnoiseP(vec2 p, vec2 P) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 ga = hash22(mod(i, P)) * 2.0 - 1.0, gb = hash22(mod(i + vec2(1.0, 0.0), P)) * 2.0 - 1.0;
  vec2 gc = hash22(mod(i + vec2(0.0, 1.0), P)) * 2.0 - 1.0, gd = hash22(mod(i + vec2(1.0, 1.0), P)) * 2.0 - 1.0;
  float va = dot(ga, f), vb = dot(gb, f - vec2(1.0, 0.0)), vc = dot(gc, f - vec2(0.0, 1.0)), vd = dot(gd, f - vec2(1.0, 1.0));
  return (va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * (va - vb - vc + vd)) * 1.4;
}
float fbmP(vec2 uv, vec2 P, int oct) {
  float a = 0.5, s = 0.0, n = 0.0; vec2 p = uv * P;
  for (int i = 0; i < 8; i++) { if (i >= oct) break; s += a * vnoiseP(p, P); n += a; p *= 2.0; P *= 2.0; a *= 0.5; }
  return s / n;
}
float gfbmP(vec2 uv, vec2 P, int oct) {
  float a = 0.5, s = 0.0, n = 0.0; vec2 p = uv * P;
  for (int i = 0; i < 8; i++) { if (i >= oct) break; s += a * gnoiseP(p, P); n += a; p *= 2.0; P *= 2.0; a *= 0.5; }
  return s / n;
}
// periodic Worley noise: x = F1, y = F2, z = cell id hash, w unused
vec4 voronoiP(vec2 uv, vec2 P, float jitter) {
  vec2 p = uv * P; vec2 i = floor(p), f = fract(p);
  float F1 = 8.0, F2 = 8.0, id = 0.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(float(x), float(y));
    vec2 c = mod(i + g, P);
    vec2 o = 0.5 + (hash22(c) - 0.5) * jitter;
    vec2 r = g + o - f; float d = dot(r, r);
    if (d < F1) { F2 = F1; F1 = d; id = hash12(c + 17.17); } else if (d < F2) { F2 = d; }
  }
  return vec4(sqrt(F1), sqrt(F2), id, 0.0);
}
`;

// Procedural sky (visible through canopy gaps) + "sky & canopy" environment fallback.
const GLSL_SKY = /* glsl */`
uniform vec3 uSkyZenith; uniform vec3 uSkyHorizon; uniform vec3 uSkyGround; uniform vec3 uSunTint;
vec3 skyColor(vec3 d, vec3 sunDir) {
  float y = d.y;
  vec3 col = mix(uSkyHorizon, uSkyZenith, pow(clamp(y, 0.0, 1.0), 0.5));
  float mu = max(dot(d, sunDir), 0.0);
  col += uSunTint * (0.28 * pow(mu, 5.0) + 0.9 * pow(mu, 48.0) + 5.0 * pow(mu, 700.0));
  col += uSunTint * 80.0 * smoothstep(0.99986, 0.99994, mu);
  col = mix(col, uSkyGround, smoothstep(0.01, -0.12, y));
  return col;
}
vec3 envCanopy(vec3 d, vec3 sunDir) {
  vec3 sky = skyColor(d, sunDir);
  float y = d.y;
  vec2 uv = vec2(atan(d.z, d.x), asin(clamp(y, -1.0, 1.0)));
  float n = fbm2(uv * vec2(2.2, 4.0) + 3.0) * 0.7 + vnoise(uv * vec2(11.0, 16.0)) * 0.3;
  float cover = smoothstep(0.03, 0.30, y);
  float gaps = smoothstep(0.60, 0.74, n) * smoothstep(0.20, 0.85, y);
  float canopy = cover * (1.0 - gaps * 0.9);
  float back = pow(max(dot(d, sunDir), 0.0), 3.0);
  vec3 leaves = vec3(0.016, 0.030, 0.008) + uSunTint * vec3(0.06, 0.10, 0.015) * back;
  vec3 col = mix(sky, leaves, canopy);
  col = mix(col, vec3(0.010, 0.014, 0.009), smoothstep(0.30, 0.0, y) * smoothstep(-0.06, 0.02, y) * 0.9);
  col = mix(col, vec3(0.016, 0.012, 0.008), smoothstep(0.0, -0.12, y));
  return col;
}
`;

// Sun visibility from the (RGBA-packed) directional shadow map, for custom shaders.
const GLSL_SUNVIS = /* glsl */`
uniform sampler2D uShadowMap;
uniform mat4 uShadowMatrix;
uniform float uShadowOutside;
float sunVisibility(vec3 wp) {
  vec4 sc = uShadowMatrix * vec4(wp, 1.0);
  sc.xyz /= sc.w;
  vec2 e = abs(sc.xy * 2.0 - 1.0);
  float edge = smoothstep(0.86, 0.985, max(e.x, e.y));
  float v = 1.0;
  if (sc.x > 0.0 && sc.x < 1.0 && sc.y > 0.0 && sc.y < 1.0 && sc.z < 1.0) {
    v = step(sc.z - 0.0012, unpackRGBAToDepth(texture2D(uShadowMap, sc.xy)));
  }
  return mix(v, uShadowOutside, edge);
}
float sunVisibilitySoft(vec3 wp) {
  vec4 sc = uShadowMatrix * vec4(wp, 1.0);
  sc.xyz /= sc.w;
  vec2 e = abs(sc.xy * 2.0 - 1.0);
  float edge = smoothstep(0.86, 0.985, max(e.x, e.y));
  float v = 1.0;
  if (sc.x > 0.0 && sc.x < 1.0 && sc.y > 0.0 && sc.y < 1.0 && sc.z < 1.0) {
    // 4 bilinearly-filtered comparisons (16 taps): smooth penumbrae instead of texel blocks
    vec2 size = vec2(textureSize(uShadowMap, 0)), ts = 1.0 / size;
    float z = sc.z - 0.0012;
    v = 0.0;
    for (int k = 0; k < 4; k++) {
      vec2 o = vec2(k == 0 || k == 2 ? -0.9 : 0.9, k < 2 ? -0.9 : 0.9);
      vec2 st = (sc.xy + o * ts) * size - 0.5;
      vec2 b = (floor(st) + 0.5) * ts, f = fract(st);
      float s00 = step(z, unpackRGBAToDepth(texture2D(uShadowMap, b)));
      float s10 = step(z, unpackRGBAToDepth(texture2D(uShadowMap, b + vec2(ts.x, 0.0))));
      float s01 = step(z, unpackRGBAToDepth(texture2D(uShadowMap, b + vec2(0.0, ts.y))));
      float s11 = step(z, unpackRGBAToDepth(texture2D(uShadowMap, b + ts)));
      v += mix(mix(s00, s10, f.x), mix(s01, s11, f.x), f.y);
    }
    v *= 0.25;
  }
  return mix(v, uShadowOutside, edge);
}
`;

// Animated caustics (iterative "water turbulence" pattern, two incommensurate layers
// to hide tiling, per-channel offsets for dispersion).
const GLSL_CAUSTICS = /* glsl */`
float causticLayer(vec2 uv, float t) {
  vec2 p = mod(uv * 6.2831853, 6.2831853) - 250.0;
  vec2 i = p;
  float c = 1.0;
  const float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0;
  c = 1.17 - pow(c, 1.4);
  return clamp(pow(abs(c), 8.0), 0.0, 4.0);
}
vec3 causticsRGB(vec2 xz, float t) {
  vec2 uv = xz * 0.62;
  float tt = t * 0.42;
  vec3 c = vec3(causticLayer(uv + vec2(0.006, 0.0), tt), causticLayer(uv, tt), causticLayer(uv - vec2(0.006, 0.0), tt));
  float c2 = causticLayer(mat2(0.8, -0.6, 0.6, 0.8) * xz * 0.41 + 3.7, tt * 0.83 + 11.0);
  return c * (0.45 + 1.1 * c2);
}
float causticsCheap(vec2 xz, float t) {
  return causticLayer(xz * 0.62, t * 0.42);
}
`;

// Water surface displacement: 4 Gerstner waves + FBM + 16 expanding ring ripples.
const GLSL_WAVES = /* glsl */`
uniform float uWaveStrength;
uniform vec4 uRipples[16];
const vec4 GW[4] = vec4[4](
  vec4(0.94, 0.34, 2.30, 0.0030),
  vec4(-0.42, 0.91, 1.35, 0.0019),
  vec4(0.71, -0.70, 0.74, 0.0011),
  vec4(-0.86, -0.51, 0.39, 0.0005)
);
vec3 gerstner(vec2 p, float t, inout vec2 grad) {
  vec3 d = vec3(0.0);
  for (int i = 0; i < 4; i++) {
    vec2 D = normalize(GW[i].xy);
    float k = 6.2831853 / GW[i].z;
    float A = GW[i].w * uWaveStrength;
    float w = sqrt(9.81 * k);
    float f = k * dot(D, p) - w * t;
    float c = cos(f), s = sin(f);
    d.xz += 0.8 * A * D * c;
    d.y += A * s;
    grad += A * k * D * c;
  }
  return d;
}
float microWaves(vec2 p, float t, inout vec2 grad) {
  float e = 0.05;
  float a = 0.0011 * uWaveStrength;
  vec2 o1 = vec2(t * 0.21, t * 0.13), o2 = vec2(-t * 0.17, t * 0.23);
  float h  = gnoise(p * 1.7 + o1) * 0.6 + gnoise(p * 3.9 + o2) * 0.4;
  float hx = gnoise((p + vec2(e, 0.0)) * 1.7 + o1) * 0.6 + gnoise((p + vec2(e, 0.0)) * 3.9 + o2) * 0.4;
  float hz = gnoise((p + vec2(0.0, e)) * 1.7 + o1) * 0.6 + gnoise((p + vec2(0.0, e)) * 3.9 + o2) * 0.4;
  grad += a * vec2(hx - h, hz - h) / e;
  return h * a;
}
float ringRipple(vec2 p, vec4 R, float t, inout vec2 grad) {
  float age = t - R.z;
  if (R.w <= 0.0 || age <= 0.0 || age > 7.0) return 0.0;
  vec2 d = p - R.xy;
  float r = length(d) + 1e-4;
  float x = r - age * 0.32;
  float wdt = 0.010 + 0.030 * age;
  float k = 42.0 / (1.0 + age * 0.55);
  float fall = 1.0 / (1.0 + r * 4.0);
  float env = R.w * exp(-x * x / wdt) * exp(-age * 0.75) * fall;
  if (env < 1e-6) return 0.0;
  float c = cos(k * x), s = sin(k * x);
  float denv = env * (-2.0 * x / wdt - 4.0 * fall);
  grad += (d / r) * (denv * c - env * k * s);
  return env * c;
}
float ripplesAt(vec2 p, float t, inout vec2 grad) {
  float h = 0.0;
  for (int i = 0; i < 16; i++) h += ringRipple(p, uRipples[i], t, grad);
  return h;
}
// full surface height (used by floating debris); grad accumulates dh/dx, dh/dz
float waterHeight(vec2 p, float t, inout vec2 grad) {
  vec3 g = gerstner(p, t, grad);
  return g.y + microWaves(p, t, grad) + ripplesAt(p, t, grad);
}
`;

// Wind sway shared by foliage, grass, ferns, branches and their shadow casters.
const GLSL_WIND = /* glsl */`
uniform vec4 uWind;
vec3 windSway(vec3 wp, vec3 anchor, float flex, float flutter, float phase) {
  float t = uTime;
  float s = uWind.z;
  float slow = sin(t * 0.63 + phase + anchor.x * 0.13) * 0.6 + sin(t * 1.07 + phase * 1.7 + anchor.z * 0.11) * 0.4;
  vec3 off = vec3(uWind.x, 0.0, uWind.y) * (slow * 0.45 + uWind.w) * s * flex * flex;
  off.y -= abs(slow) * 0.04 * s * flex * flex;
  float ph = dot(wp, vec3(2.1, 1.7, 2.9)) + phase;
  off += vec3(sin(t * 6.3 + ph), sin(t * 8.1 + ph * 1.3) * 0.7, sin(t * 7.2 + ph * 0.7)) * flutter * s * (0.45 + uWind.w);
  return off;
}
`;

// Fog that knows about the water surface: the air part and the water part of each view
// ray are fogged separately (FogExp2 law for both media).
const GLSL_FOG = /* glsl */`
uniform vec3 uAirFogColor; uniform float uAirFogDensity;
uniform vec3 uWaterFogColor; uniform float uWaterFogDensity;
uniform float uFogMode;
vec3 waterFogTint(vec3 dir) {
  float up = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
  return uWaterFogColor * (0.30 + 1.25 * up * up);
}
vec3 applyWorldFog(vec3 col, vec3 wp) {
  vec3 rd = wp - cameraPosition;
  float L = length(rd);
  vec3 dir = rd / max(L, 1e-4);
  float airL = L, waterL = 0.0;
  if (uFogMode > 1.5) { airL = 0.0; waterL = L; }
  else if (uFogMode > 0.5) {
    if (wp.y <= uWaterLevel) { airL = 0.0; waterL = L; }
    else { float ts = clamp((uWaterLevel - cameraPosition.y) / max(rd.y, 1e-4), 0.0, 1.0); airL = L * (1.0 - ts); }
  } else if (wp.y < uWaterLevel - 0.01) { airL = 0.0; }
  float fa = 1.0 - exp(-uAirFogDensity * uAirFogDensity * airL * airL);
  vec3 airCol = uAirFogColor + uSunColor * 0.010 * pow(max(dot(dir, uSunDir), 0.0), 5.0);
  col = mix(col, airCol, fa);
  float fw = 1.0 - exp(-uWaterFogDensity * uWaterFogDensity * waterL * waterL);
  return mix(col, waterFogTint(dir), fw);
}
`;

// Fullscreen-triangle vertex shader used by bakes and post passes.
const FSQ_VERT = /* glsl */`
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

// Patch three's shadow lookup: fade to an "average canopy" value at the frustum border
// instead of snapping to full sun outside it (distant forest stays in shade).
THREE.ShaderChunk.shadowmap_pars_fragment = THREE.ShaderChunk.shadowmap_pars_fragment.replace(
  'return mix( 1.0, shadow, shadowIntensity );',
  `{ vec2 eF = abs( shadowCoord.xy * 2.0 - 1.0 ); float edgeF = smoothstep( 0.86, 0.985, max( eF.x, eF.y ) );
     shadow = mix( shadow, ${SUN_OUTSIDE_VIS}, edgeF ); }
   return mix( 1.0, shadow, shadowIntensity );`
);

// ==== MATERIAL PATCHING (onBeforeCompile) ====================================
// One patch for every lit material in the world: world-position varying, split air /
// water fog, caustics + underwater absorption on the sun term, wet band at the
// waterline, optional wind sway, foliage translucency, crown normals, atlas UVs.
const WORLD_UNIFORMS = ['uTime', 'uWaterLevel', 'uSunDir', 'uSunColor', 'uCausticStrength', 'uFogMode',
  'uAirFogColor', 'uAirFogDensity', 'uWaterFogColor', 'uWaterFogDensity', 'uWaterAbsorbLight', 'uWind',
  'uWaveStrength', 'uRipples'];
const f3 = (x) => (Math.round(x * 1000) / 1000).toFixed(3);

// insert code right before the RE_Direct() call of the directional-light loop
// (i.e. after the shadow has been applied to directLight.color)
function lightsBeginWithSunHook(hook) {
  const src = THREE.ShaderChunk.lights_fragment_begin;
  const a = src.indexOf('getDirectionalLightInfo( directionalLight, directLight );');
  const b = src.indexOf('RE_Direct( directLight', a);
  if (a < 0 || b < 0) { console.warn('lights_fragment_begin layout changed; sun hook skipped'); return src; }
  return src.slice(0, b) + hook + '\n\t\t' + src.slice(b);
}

const SUN_HOOK = /* glsl */`
{
  float dBw = uWaterLevel - vWorldPos.y;
  if ( dBw > 0.0 ) {
    float sy = max( uSunDir.y, 0.15 );
    vec3 spw = vWorldPos + uSunDir * ( dBw / sy );
    vec3 cau = causticsRGB( spw.xz, uTime );
    float fin = smoothstep( 0.02, 0.35, dBw ) * uCausticStrength;
    // focused light: dark floor + bright webbing, ~energy conserving on average
    directLight.color *= mix( vec3( 1.0 ), vec3( 0.3 ) + min( cau * 9.0, vec3( 8.0 ) ), fin );
    directLight.color *= exp( -uWaterAbsorbLight * dBw / sy );
  }
  #ifdef WORLD_TRANSLUCENT
  {
    float tBack = pow( saturate( dot( geometryViewDir, -directLight.direction ) ), 3.0 );
    float tWrap = saturate( dot( -geometryNormal, directLight.direction ) * 0.5 + 0.5 );
    reflectedLight.directDiffuse += directLight.color * diffuseColor.rgb * TRANSLUCENCY_TINT *
      ( tBack * TRANSLUCENCY_BACK + tWrap * TRANSLUCENCY_WRAP );
  }
  #endif
}
`;

const UNDERWATER_AMBIENT = /* glsl */`
{
  float dBa = uWaterLevel - vWorldPos.y;
  if ( dBa > 0.0 ) {
    vec3 attA = exp( -uWaterAbsorbLight * ( dBa * 1.1 + 0.15 ) );
    reflectedLight.indirectDiffuse *= attA;
    reflectedLight.indirectSpecular *= attA * 0.6;
  }
}
`;

const ATLAS_VS = /* glsl */`
#ifdef USE_MAP
  vMapUv = vMapUv * ATLAS_SCALE + aAtlas;
#endif
#ifdef USE_ALPHAMAP
  vAlphaMapUv = vAlphaMapUv * ATLAS_SCALE + aAtlas;
#endif
`;

// Alpha-tested cards thin out in lower mips: boost alpha with the mip level.
const ALPHA_BOOST_FS = /* glsl */`
#ifdef USE_ALPHATEST
  #if defined( USE_MAP )
  {
    vec2 dUvA = fwidth( vMapUv ) * vec2( textureSize( map, 0 ) );
    float mipA = max( 0.0, log2( max( max( dUvA.x, dUvA.y ), 1e-5 ) ) );
    diffuseColor.a *= 1.0 + mipA * 0.3;
  }
  #endif
  if ( diffuseColor.a < alphaTest ) discard;
#endif
`;

const CROWN_FS = /* glsl */`
  normal = normalize( mix( normal, normalize( vCrownN ), CROWN_BLEND ) );
`;

function wetCode(w) {
  return /* glsl */`
{
  float yRel = vWorldPos.y - uWaterLevel;
  float wnz = vnoise( vWorldPos.xz * 2.7 + vWorldPos.y * 1.3 );
  float band = ${f3(w.band ?? 0.1)} * ( 0.55 + 0.9 * wnz );
  float wet = 1.0 - smoothstep( 0.0, band, yRel );
  float under = 1.0 - smoothstep( -0.03, 0.0, yRel );
  diffuseColor.rgb *= mix( 1.0, ${f3(w.darken ?? 0.55)}, wet );
  roughnessFactor = mix( roughnessFactor, ${f3(w.rough ?? 0.2)}, wet );
  roughnessFactor = mix( roughnessFactor, ${f3(w.roughUnder ?? w.rough ?? 0.2)}, under );
}
`;
}

function windCode(o) {
  switch (o.wind) {
    case 'tree': return /* glsl */`
      { float flexW = clamp( ( wPos.y - aTree.y ) / aTree.w, 0.0, 1.0 );
        wPos.xyz += windSway( wPos.xyz, aTree.xyz, 0.20 * flexW * flexW, 0.0, dot( aTree.xz, vec2( 0.37, 0.53 ) ) ); }`;
    case 'leaf': return /* glsl */`
      { float flexW = clamp( ( wPos.y - aTree.y ) / aTree.w, 0.0, 1.0 );
        wPos.xyz += windSway( wPos.xyz, aTree.xyz, 0.20 * flexW * flexW, 0.028 * ( 0.25 + uv.y ), dot( aTree.xz, vec2( 0.37, 0.53 ) ) ); }`;
    case 'plant': return /* glsl */`
      { vec3 ancW = ( modelMatrix * vec4( instanceMatrix[ 3 ].xyz, 1.0 ) ).xyz;
        float flexW = clamp( position.y / PLANT_HEIGHT, 0.0, 1.0 );
        wPos.xyz += windSway( wPos.xyz, ancW, PLANT_SWAY * flexW * flexW, 0.012 * flexW, ancW.x * 1.3 + ancW.z ); }`;
    default: return '';
  }
}

const FLOAT_VS = /* glsl */`
  { vec3 ancF = ( modelMatrix * vec4( instanceMatrix[ 3 ].xyz, 1.0 ) ).xyz;
    vec2 gF = vec2( 0.0 );
    float hF = waterHeight( ancF.xz, uTime, gF );
    wPos.y += hF + dot( wPos.xz - ancF.xz, gF ); }
`;

function vertHead(o, withVaryings) {
  return [
    withVaryings ? 'varying vec3 vWorldPos;' : '',
    'uniform float uTime;',
    'uniform float uWaterLevel;',
    o.wind ? GLSL_WIND : '',
    (o.wind === 'tree' || o.wind === 'leaf') ? 'attribute vec4 aTree;' : '',
    o.atlas ? 'attribute vec2 aAtlas;' : '',
    o.foliage ? 'attribute vec3 aCrownN;\nvarying vec3 vCrownN;' : '',
    o.floating ? GLSL_NOISE + GLSL_WAVES : '',
    o.vertHead || '',
  ].join('\n');
}

function fragHead(o) {
  return [
    'varying vec3 vWorldPos;',
    'uniform float uTime; uniform float uWaterLevel; uniform vec3 uSunDir; uniform vec3 uSunColor;',
    'uniform float uCausticStrength; uniform vec3 uWaterAbsorbLight;',
    o.foliage ? 'varying vec3 vCrownN;' : '',
    GLSL_NOISE, GLSL_CAUSTICS, GLSL_FOG,
    o.fragHead || '',
  ].join('\n');
}

function projectCode(o, withVaryings) {
  return /* glsl */`
    vec4 wPos = vec4( transformed, 1.0 );
    #ifdef USE_INSTANCING
      wPos = instanceMatrix * wPos;
    #endif
    wPos = modelMatrix * wPos;
    ${windCode(o)}
    ${o.floating ? FLOAT_VS : ''}
    ${withVaryings ? 'vWorldPos = wPos.xyz;' : ''}
    ${withVaryings && o.foliage ? 'vCrownN = normalize( ( viewMatrix * vec4( aCrownN, 0.0 ) ).xyz );' : ''}
    vec4 mvPosition = viewMatrix * wPos;
    gl_Position = projectionMatrix * mvPosition;
  `;
}

function replaceOrWarn(src, anchor, code, name) {
  if (!src.includes(anchor)) { console.warn(`[patch ${name}] anchor not found: ${anchor}`); return src; }
  return src.replace(anchor, code);
}

/**
 * Patch a MeshStandard/MeshPhysical material.
 * o.key (unique per shader variant!), o.wind ('tree'|'leaf'|'plant'), o.translucent, o.foliage,
 * o.atlas, o.alphaBoost, o.wet {band,darken,rough,roughUnder}, o.floating,
 * o.vertHead/o.vertBegin/o.vertNormal/o.vertEnd, o.fragHead/o.fragMap/o.fragRough/o.fragMetal/o.fragNormal/o.fragAO,
 * o.uniforms, o.defines
 */
function patchWorldMaterial(mat, o = {}) {
  const key = o.key || 'world';
  const defines = Object.assign({}, o.defines || {});
  if (o.translucent) {
    defines.WORLD_TRANSLUCENT = '';
    defines.TRANSLUCENCY_TINT = defines.TRANSLUCENCY_TINT || 'vec3( 0.78, 1.10, 0.30 )';
    defines.TRANSLUCENCY_BACK = defines.TRANSLUCENCY_BACK || '0.8';
    defines.TRANSLUCENCY_WRAP = defines.TRANSLUCENCY_WRAP || '0.22';
  }
  if (o.atlas) defines.ATLAS_SCALE = f3(o.atlas);
  if (o.foliage) defines.CROWN_BLEND = defines.CROWN_BLEND || '0.62';
  mat.defines = Object.assign(mat.defines || {}, defines);
  mat.customProgramCacheKey = () => 'world|' + key;
  mat.onBeforeCompile = (shader) => {
    for (const n of WORLD_UNIFORMS) shader.uniforms[n] = U[n];
    if (o.uniforms) Object.assign(shader.uniforms, o.uniforms);
    let vs = shader.vertexShader, fs = shader.fragmentShader;
    vs = replaceOrWarn(vs, '#include <common>', '#include <common>\n' + vertHead(o, true), key);
    if (o.atlas) vs = replaceOrWarn(vs, '#include <uv_vertex>', '#include <uv_vertex>\n' + ATLAS_VS, key);
    if (o.vertNormal) vs = replaceOrWarn(vs, '#include <beginnormal_vertex>', '#include <beginnormal_vertex>\n' + o.vertNormal, key);
    if (o.vertBegin) vs = replaceOrWarn(vs, '#include <begin_vertex>', '#include <begin_vertex>\n' + o.vertBegin, key);
    vs = replaceOrWarn(vs, '#include <project_vertex>', projectCode(o, true), key);
    vs = replaceOrWarn(vs, '#include <worldpos_vertex>', 'vec4 worldPosition = wPos;', key);
    if (o.vertEnd) vs = replaceOrWarn(vs, '#include <fog_vertex>', '#include <fog_vertex>\n' + o.vertEnd, key);

    fs = replaceOrWarn(fs, '#include <common>', '#include <common>\n' + fragHead(o), key);
    if (o.fragMap) fs = replaceOrWarn(fs, '#include <map_fragment>', o.fragMap, key);
    if (o.alphaBoost) fs = replaceOrWarn(fs, '#include <alphatest_fragment>', ALPHA_BOOST_FS, key);
    if (o.fragRough) fs = replaceOrWarn(fs, '#include <roughnessmap_fragment>', o.fragRough, key);
    if (o.wet) fs = replaceOrWarn(fs, '#include <metalnessmap_fragment>', wetCode(o.wet) + '\n#include <metalnessmap_fragment>', key);
    if (o.fragMetal) fs = replaceOrWarn(fs, '#include <metalnessmap_fragment>', o.fragMetal, key);
    if (o.fragNormal) fs = replaceOrWarn(fs, '#include <normal_fragment_maps>', o.fragNormal, key);
    if (o.foliage) fs = replaceOrWarn(fs, '#include <normal_fragment_maps>', '#include <normal_fragment_maps>\n' + CROWN_FS, key);
    if (o.fragAO) fs = replaceOrWarn(fs, '#include <aomap_fragment>', o.fragAO, key);
    fs = replaceOrWarn(fs, '#include <lights_fragment_begin>', lightsBeginWithSunHook(SUN_HOOK), key);
    fs = replaceOrWarn(fs, '#include <lights_fragment_end>', '#include <lights_fragment_end>\n' + UNDERWATER_AMBIENT + (o.fragPostLights || ''), key);
    fs = replaceOrWarn(fs, '#include <fog_fragment>', 'gl_FragColor.rgb = applyWorldFog( gl_FragColor.rgb, vWorldPos );', key);
    shader.vertexShader = vs;
    shader.fragmentShader = fs;
    if (o.onShader) o.onShader(shader);
  };
  return mat;
}

// Matching depth material for the sun shadow map (same wind / atlas / vertex animation).
function makeShadowDepthMaterial(o, base) {
  const dm = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  dm.map = base.map || null;
  dm.alphaMap = base.alphaMap || null;
  dm.alphaTest = base.alphaTest || 0;
  const defines = Object.assign({}, o.defines || {});
  if (o.atlas) defines.ATLAS_SCALE = f3(o.atlas);
  dm.defines = Object.assign(dm.defines || {}, defines);
  dm.customProgramCacheKey = () => 'depth|' + (o.key || 'world');
  dm.onBeforeCompile = (shader) => {
    for (const n of ['uTime', 'uWaterLevel', 'uWind', 'uWaveStrength', 'uRipples']) shader.uniforms[n] = U[n];
    if (o.uniforms) Object.assign(shader.uniforms, o.uniforms);
    let vs = shader.vertexShader;
    vs = replaceOrWarn(vs, '#include <common>', '#include <common>\n' + vertHead(o, false), 'depth:' + o.key);
    if (o.atlas) vs = replaceOrWarn(vs, '#include <uv_vertex>', '#include <uv_vertex>\n' + ATLAS_VS, 'depth:' + o.key);
    if (o.vertBegin) vs = replaceOrWarn(vs, '#include <begin_vertex>', '#include <begin_vertex>\n' + o.vertBegin, 'depth:' + o.key);
    vs = replaceOrWarn(vs, '#include <project_vertex>', projectCode(o, false), 'depth:' + o.key);
    shader.vertexShader = vs;
    if (o.alphaBoost) shader.fragmentShader = replaceOrWarn(shader.fragmentShader, '#include <alphatest_fragment>', ALPHA_BOOST_FS, 'depth:' + o.key);
  };
  return dm;
}

// ==== PROCEDURAL TEXTURES (GPU bakes) ========================================
// ASSET HOOK: every surface below returns { map, normalMap, ormMap } (albedo sRGB with
// height in alpha, tangent-space normal, AO/roughness/metal). Replace any entry with
// TextureLoader output to use scanned PBR sets instead.
const bakeQuad = new FullScreenQuad(null);
const bakeTargets = [];
function bake({ w, h = w, frag, uniforms = {}, srgb = false, mips = true, wrap = THREE.RepeatWrapping, type = THREE.UnsignedByteType, defines = {} }) {
  const rt = new THREE.WebGLRenderTarget(w, h, {
    type, depthBuffer: false, generateMipmaps: mips,
    minFilter: mips ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter,
    magFilter: THREE.LinearFilter, wrapS: wrap, wrapT: wrap,
    colorSpace: srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace,
    anisotropy: MAX_ANISO,
  });
  const mat = new THREE.ShaderMaterial({
    defines,
    uniforms: Object.assign({ uRes: { value: new THREE.Vector2(w, h) } }, uniforms),
    vertexShader: FSQ_VERT,
    fragmentShader: 'uniform vec2 uRes;\nvarying vec2 vUv;\n' + GLSL_NOISE + GLSL_PERIODIC + frag,
    depthTest: false, depthWrite: false,
  });
  bakeQuad.material = mat;
  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(rt);
  bakeQuad.render(renderer);
  renderer.setRenderTarget(prev);
  mat.dispose();
  bakeTargets.push(rt);
  return rt.texture;
}

// Generic 3-pass PBR bake around a `surface()` function (periodic in uv).
const PBR_MAIN = /* glsl */`
uniform float uNormalStrength;
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float h; vec3 alb; float rough; float ao;
#if PASS == 0
  surface(uv, h, alb, rough, ao);
  gl_FragColor = vec4(clamp(alb, 0.0, 1.0), clamp(h, 0.0, 1.0));
#elif PASS == 1
  vec2 e = 1.0 / uRes;
  float hl, hr, hd, hu; vec3 a_; float r_, o_;
  surface(fract(uv - vec2(e.x, 0.0)), hl, a_, r_, o_);
  surface(fract(uv + vec2(e.x, 0.0)), hr, a_, r_, o_);
  surface(fract(uv - vec2(0.0, e.y)), hd, a_, r_, o_);
  surface(fract(uv + vec2(0.0, e.y)), hu, a_, r_, o_);
  vec3 n = normalize(vec3((hl - hr) * uNormalStrength, (hd - hu) * uNormalStrength, 1.0));
  gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
#else
  surface(uv, h, alb, rough, ao);
  gl_FragColor = vec4(clamp(ao, 0.0, 1.0), clamp(rough, 0.0, 1.0), 0.0, 1.0);
#endif
}
`;

function bakePBR(name, surfaceGLSL, { size, tileMeters, heightMeters, w, h }) {
  const W = w || size, H = h || size;
  const strength = heightMeters * Math.max(W, H) / (2 * tileMeters);
  const common = { w: W, h: H, frag: surfaceGLSL + PBR_MAIN, uniforms: { uNormalStrength: { value: strength } } };
  const map = bake({ ...common, srgb: true, defines: { PASS: 0 } });
  const normalMap = bake({ ...common, defines: { PASS: 1 } });
  const ormMap = bake({ ...common, defines: { PASS: 2 } });
  map.name = name + '.albedo'; normalMap.name = name + '.normal'; ormMap.name = name + '.orm';
  return { map, normalMap, ormMap };
}

const SURF_TWIGS = /* glsl */`
float twigLines(vec2 uv, vec2 P, float width, float density) {
  vec2 p = uv * P; vec2 i = floor(p), f = fract(p); float m = 0.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(float(x), float(y)); vec2 c = mod(i + g, P);
    vec3 rnd = hash32(c + 3.1);
    if (rnd.z > density) continue;
    vec2 center = g + hash22(c + 7.7);
    float ang = rnd.x * 6.2831853; vec2 dir = vec2(cos(ang), sin(ang));
    float len = 0.35 + rnd.y * 0.9;
    vec2 d = f - center; float t = clamp(dot(d, dir), -len, len);
    float dist = length(d - dir * t);
    float wdt = width * (0.6 + 0.8 * hash12(c + 1.3)) * (1.0 - abs(t) / len * 0.5);
    m = max(m, smoothstep(wdt, wdt * 0.35, dist));
  }
  return m;
}
`;

const SURF_LOAM = SURF_TWIGS + /* glsl */`
void surface(vec2 uv, out float h, out vec3 alb, out float rough, out float ao) {
  float n1 = fbmP(uv, vec2(6.0), 6);
  float n2 = fbmP(uv + 0.31, vec2(24.0), 4);
  float n3 = fbmP(fract(uv + 0.77), vec2(48.0), 3);
  vec4 vc = voronoiP(uv, vec2(22.0), 1.0);
  float crumb = smoothstep(0.3, 0.1, vc.x) * step(0.86, vc.z);
  vec2 warp = vec2(fbmP(uv + 0.5, vec2(5.0), 3), fbmP(uv + 0.9, vec2(5.0), 3)) - 0.5;
  vec4 lv = voronoiP(fract(uv + warp * 0.12), vec2(12.0), 1.0);
  float leafM = step(0.84, lv.z) * smoothstep(0.03, 0.09, lv.y - lv.x) * smoothstep(0.5, 0.3, lv.x);
  float tw = twigLines(uv, vec2(7.0), 0.03, 0.4);
  float fib = twigLines(fract(uv + 0.5), vec2(19.0), 0.025, 0.35) * 0.6;
  h = n1 * 0.55 + n2 * 0.2 + n3 * 0.1 + crumb * 0.3 + leafM * 0.1 + tw * 0.4 + fib * 0.15;
  vec3 soil = mix(vec3(0.022, 0.016, 0.011), vec3(0.060, 0.043, 0.029), smoothstep(0.2, 0.8, n1));
  soil *= 0.72 + 0.4 * n2 + 0.2 * n3;
  float lh = hash12(vec2(lv.z * 91.7, 3.3));
  vec3 leafC = mix(vec3(0.07, 0.035, 0.015), vec3(0.17, 0.09, 0.035), lh);
  alb = mix(soil, leafC, leafM * 0.8);
  alb = mix(alb, vec3(0.10, 0.085, 0.07), crumb * 0.7);
  alb = mix(alb, vec3(0.12, 0.085, 0.055), tw * 0.9);
  alb = mix(alb, vec3(0.085, 0.065, 0.045), fib);
  rough = clamp(0.9 + 0.06 * n2 - leafM * 0.1 - crumb * 0.15, 0.0, 1.0);
  ao = mix(0.4, 1.0, smoothstep(0.15, 0.75, h));
}
`;

const SURF_SILT = /* glsl */`
void surface(vec2 uv, out float h, out vec3 alb, out float rough, out float ao) {
  float n = fbmP(uv, vec2(5.0), 6);
  float n2 = fbmP(uv + 0.7, vec2(20.0), 4);
  vec4 v = voronoiP(uv, vec2(19.0), 0.85);
  float r0 = 0.28 + 0.14 * hash12(vec2(v.z * 37.0, 1.0));
  float peb = step(0.55, v.z);
  float pebH = sqrt(max(0.0, 1.0 - (v.x / r0) * (v.x / r0))) * peb;
  vec4 g = voronoiP(fract(uv + 0.13), vec2(52.0), 0.9);
  float grav = sqrt(max(0.0, 1.0 - (g.x / 0.33) * (g.x / 0.33))) * step(0.55, g.z);
  float rip = sin((uv.x + uv.y * 0.3 + n * 0.25) * 6.2831853 * 9.0) * 0.5 + 0.5;
  h = n * 0.35 + rip * 0.06 + pebH * 0.75 + grav * 0.25 * (1.0 - peb);
  vec3 silt = mix(vec3(0.060, 0.050, 0.034), vec3(0.115, 0.098, 0.066), smoothstep(0.2, 0.8, n)) * (0.85 + 0.3 * n2);
  vec3 pc = hash32(vec2(v.z * 71.0, 5.0));
  vec3 pebC = mix(vec3(0.10, 0.095, 0.085), vec3(0.33, 0.30, 0.26), pc.x) * mix(vec3(1.0), vec3(1.12, 1.0, 0.82), pc.y);
  vec3 gc = hash32(vec2(g.z * 53.0, 2.0));
  vec3 gravC = mix(vec3(0.08, 0.07, 0.06), vec3(0.22, 0.20, 0.17), gc.x);
  alb = silt;
  alb = mix(alb, gravC, smoothstep(0.0, 0.25, grav) * (1.0 - peb));
  alb = mix(alb, pebC, smoothstep(0.0, 0.2, pebH));
  rough = mix(0.9, 0.5, smoothstep(0.0, 0.2, pebH));
  ao = mix(0.45, 1.0, smoothstep(0.05, 0.6, h));
}
`;

const SURF_ROCK = /* glsl */`
// weathered granite/sandstone: ridged erosion, warped partial fractures, speckle, lichen
void surface(vec2 uv, out float h, out vec3 alb, out float rough, out float ao) {
  float n = fbmP(uv, vec2(4.0), 7);
  float nr = 1.0 - abs(gfbmP(fract(uv + 0.37), vec2(3.0), 6));
  float nr2 = 1.0 - abs(gfbmP(fract(uv + 0.71), vec2(8.0), 5));
  vec2 warp = vec2(gfbmP(fract(uv + 0.2), vec2(3.0), 4), gfbmP(fract(uv + 0.6), vec2(3.0), 4));
  vec4 cr = voronoiP(fract(uv + warp * 0.14), vec2(4.0), 1.0);
  float crack = (1.0 - smoothstep(0.0, 0.02, cr.y - cr.x)) * smoothstep(0.48, 0.66, fbmP(fract(uv + 0.33), vec2(5.0), 4));
  vec4 cr2 = voronoiP(fract(uv + 0.5 + warp * 0.08), vec2(12.0), 1.0);
  float crack2 = (1.0 - smoothstep(0.0, 0.016, cr2.y - cr2.x)) * smoothstep(0.58, 0.8, fbmP(fract(uv + 0.9), vec2(7.0), 3));
  float grain = fbmP(fract(uv + 0.2), vec2(64.0), 3);
  float speck = step(0.8, hash12(floor(uv * 700.0))) - step(0.9, hash12(floor(uv * 700.0) + 3.1)) * 0.6;
  h = n * 0.42 + nr * 0.24 + nr2 * 0.14 + grain * 0.1 - crack * 0.3 - crack2 * 0.12 + 0.2;
  vec3 base = mix(vec3(0.085, 0.082, 0.075), vec3(0.2, 0.19, 0.168), smoothstep(0.2, 0.8, n * 0.7 + nr2 * 0.3));
  base *= 0.85 + 0.3 * grain + speck * 0.12;
  base *= mix(vec3(1.0), vec3(1.1, 1.0, 0.86), smoothstep(0.4, 0.7, fbmP(fract(uv + 0.4), vec2(2.0), 3)));
  base *= mix(0.75, 1.0, smoothstep(0.2, 0.6, nr));
  float lich = smoothstep(0.62, 0.70, fbmP(fract(uv + 0.8), vec2(6.0), 5));
  float lich2 = smoothstep(0.70, 0.76, fbmP(fract(uv + 0.13), vec2(9.0), 4));
  alb = base;
  alb = mix(alb, vec3(0.26, 0.28, 0.2), lich * 0.75);
  alb = mix(alb, vec3(0.38, 0.23, 0.08), lich2 * 0.5);
  alb *= 1.0 - crack * 0.55 - crack2 * 0.3;
  rough = clamp(0.8 + grain * 0.15 + crack * 0.1 - lich * 0.05, 0.0, 1.0);
  ao = clamp(mix(0.35, 1.0, smoothstep(0.1, 0.8, h)) * (1.0 - crack * 0.45), 0.0, 1.0);
}
`;

const SURF_MOSS = /* glsl */`
void surface(vec2 uv, out float h, out vec3 alb, out float rough, out float ao) {
  float n = fbmP(uv, vec2(6.0), 6);
  float f = fbmP(fract(uv + 0.5), vec2(48.0), 4);
  vec4 v = voronoiP(uv, vec2(40.0), 1.0);
  float tuft = smoothstep(0.5, 0.0, v.x);
  h = n * 0.4 + f * 0.3 + tuft * 0.3;
  alb = mix(vec3(0.026, 0.046, 0.009), vec3(0.11, 0.16, 0.026), smoothstep(0.2, 0.8, n * 0.6 + tuft * 0.4));
  alb *= 0.75 + 0.5 * f;
  alb = mix(alb, vec3(0.15, 0.16, 0.045), smoothstep(0.75, 0.9, f) * 0.5);
  rough = 0.93;
  ao = mix(0.45, 1.0, h);
}
`;

// Bark: SPECIES 0 = beech (smooth grey, lenticels, lichen), 1 = oak (deep furrows),
// 2 = alder (dark, small plates). u runs around the trunk, v along it.
const SURF_BARK = /* glsl */`
void surface(vec2 uv, out float h, out vec3 alb, out float rough, out float ao) {
#if SPECIES == 0
  float n = fbmP(uv, vec2(3.0, 6.0), 6);
  float fine = fbmP(fract(uv + 0.3), vec2(32.0, 64.0), 3);
  vec4 len = voronoiP(uv, vec2(10.0, 40.0), 0.9);
  float lent = smoothstep(0.24, 0.1, len.x) * step(0.7, len.z);
  float lich = smoothstep(0.58, 0.68, fbmP(fract(uv + 0.7), vec2(4.0, 8.0), 5));
  float dark = smoothstep(0.55, 0.72, fbmP(fract(uv + 0.3), vec2(2.0, 4.0), 4));
  float ring = smoothstep(0.93, 1.0, sin(uv.y * 6.2831853 * 3.0 + n * 2.0) * 0.5 + 0.5) * 0.5;
  h = n * 0.45 + fine * 0.2 - lent * 0.12 + lich * 0.15 - ring * 0.1 + 0.2;
  alb = mix(vec3(0.19, 0.19, 0.175), vec3(0.33, 0.32, 0.30), n) * (0.9 + 0.2 * fine);
  alb = mix(alb, vec3(0.085, 0.085, 0.075), dark * 0.6);
  alb = mix(alb, vec3(0.25, 0.29, 0.19), lich * 0.7);
  alb *= 1.0 - lent * 0.45 - ring * 0.25;
  rough = 0.72 + 0.15 * fine;
  ao = mix(0.55, 1.0, clamp(h, 0.0, 1.0));
#elif SPECIES == 1
  // oak: a raised network of narrow ridges (cell borders) around deep dark furrows
  vec2 w = vec2(fbmP(uv, vec2(3.0, 2.0), 4), fbmP(fract(uv + 0.5), vec2(3.0, 2.0), 4)) - 0.5;
  vec4 v = voronoiP(fract(uv + w * 0.1), vec2(9.0, 2.0), 1.0);
  float ridge = 1.0 - smoothstep(0.03, 0.2, v.y - v.x);
  float n = fbmP(uv, vec2(4.0, 8.0), 6);
  float fine = fbmP(fract(uv + 0.3), vec2(40.0, 60.0), 3);
  float moss = smoothstep(0.6, 0.72, fbmP(fract(uv + 0.25), vec2(3.0, 5.0), 5));
  h = ridge * 0.75 + n * 0.15 + fine * 0.1;
  vec3 plate = mix(vec3(0.07, 0.062, 0.052), vec3(0.14, 0.126, 0.104), n);
  alb = mix(vec3(0.016, 0.013, 0.011), plate, ridge) * (0.85 + 0.3 * fine);
  alb = mix(alb, vec3(0.04, 0.07, 0.016), moss * (1.0 - ridge) * 0.8);
  rough = mix(0.96, 0.84, ridge);
  ao = mix(0.25, 1.0, ridge * 0.85 + n * 0.15);
#else
  vec2 w = vec2(fbmP(uv, vec2(4.0, 3.0), 4), fbmP(fract(uv + 0.5), vec2(4.0, 3.0), 4)) - 0.5;
  vec4 v = voronoiP(fract(uv + w * 0.1), vec2(11.0, 7.0), 1.0);
  float plate = smoothstep(0.0, 0.16, v.y - v.x);
  float n = fbmP(uv, vec2(4.0, 6.0), 6);
  float fine = fbmP(fract(uv + 0.3), vec2(40.0, 50.0), 3);
  h = plate * 0.6 + n * 0.3 + fine * 0.1;
  vec3 pc = mix(vec3(0.055, 0.05, 0.042), vec3(0.13, 0.115, 0.095), n);
  alb = mix(vec3(0.09, 0.045, 0.022), pc, plate) * (0.85 + 0.3 * fine);
  rough = mix(0.95, 0.85, plate);
  ao = mix(0.3, 1.0, plate * 0.7 + n * 0.3);
#endif
}
`;

const BAKE_WATER_NORMAL = /* glsl */`
uniform float uNormalStrength;
float hgt(vec2 uv) {
  return gfbmP(uv, vec2(8.0), 5) * 0.65 + gfbmP(fract(uv + 0.37), vec2(3.0, 5.0), 4) * 0.35;
}
void main() {
  vec2 uv = gl_FragCoord.xy / uRes; vec2 e = 1.0 / uRes;
  float hl = hgt(fract(uv - vec2(e.x, 0.0))), hr = hgt(fract(uv + vec2(e.x, 0.0)));
  float hd = hgt(fract(uv - vec2(0.0, e.y))), hu = hgt(fract(uv + vec2(0.0, e.y)));
  vec3 n = normalize(vec3((hl - hr) * uNormalStrength, (hd - hu) * uNormalStrength, 1.0));
  gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
}
`;

// r: shoreline foam / scum, g: pollen film, b: bubbles
const BAKE_FOAM = /* glsl */`
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float n = fbmP(uv, vec2(8.0), 6);
  float n2 = fbmP(fract(uv + 0.37), vec2(3.0), 5);
  vec4 v = voronoiP(uv, vec2(26.0), 1.0);
  float bub = smoothstep(0.06, 0.0, abs(v.x - 0.28)) * step(0.35, v.z);
  vec4 v2 = voronoiP(fract(uv + 0.5), vec2(60.0), 1.0);
  float bub2 = smoothstep(0.08, 0.0, abs(v2.x - 0.25)) * step(0.5, v2.z);
  float foam = smoothstep(0.42, 0.72, n) * (0.6 + 0.4 * n2);
  gl_FragColor = vec4(foam, smoothstep(0.35, 0.75, n2 * 0.7 + n * 0.3), max(bub, bub2 * 0.7), 1.0);
}
`;

const BAKE_SCALES = /* glsl */`
uniform float uNormalStrength;
float scaleH(vec2 uv) {
  vec2 P = vec2(18.0, 12.0);
  vec2 p = uv * P;
  float best = 0.0; float bestKey = -1e9;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 c = floor(p) + vec2(float(i), float(j));
    float ox = mod(c.y, 2.0) * 0.5;
    vec2 ctr = c + vec2(0.5 + ox, 0.5);
    vec2 d = (p - ctr) * vec2(1.0, 1.3);
    float r = length(d);
    if (r < 0.78 && ctr.x > bestKey) { bestKey = ctr.x; best = (1.0 - r / 0.78) * 0.55 + clamp(-d.x, -0.78, 0.78) * 0.3 + 0.25; }
  }
  return best;
}
void main() {
  vec2 uv = gl_FragCoord.xy / uRes; vec2 e = 1.0 / uRes;
  float hl = scaleH(fract(uv - vec2(e.x, 0.0))), hr = scaleH(fract(uv + vec2(e.x, 0.0)));
  float hd = scaleH(fract(uv - vec2(0.0, e.y))), hu = scaleH(fract(uv + vec2(0.0, e.y)));
  vec3 n = normalize(vec3((hl - hr) * uNormalStrength, (hd - hu) * uNormalStrength, 1.0));
  gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
}
`;

let TEX = null;
async function bakeAllTextures() {
  const S = PARAMS.texSize, S2 = Math.max(256, S >> 1);
  const T = {};
  T.loam = bakePBR('loam', SURF_LOAM, { size: S, tileMeters: 2.6, heightMeters: 0.025 });
  await setLoading('Baking pond silt & pebbles…', 0.08);
  T.silt = bakePBR('silt', SURF_SILT, { size: S, tileMeters: 2.2, heightMeters: 0.03 });
  await setLoading('Baking rock & moss…', 0.12);
  T.rock = bakePBR('rock', SURF_ROCK, { size: S, tileMeters: 1.6, heightMeters: 0.05 });
  T.moss = bakePBR('moss', SURF_MOSS, { size: S2, tileMeters: 0.9, heightMeters: 0.015 });
  await setLoading('Baking bark…', 0.16);
  T.bark = [0, 1, 2].map((sp) => bakePBR('bark' + sp, SURF_BARK.replace('#if SPECIES == 0', `#define SPECIES ${sp}\n#if SPECIES == 0`),
    { size: S2, tileMeters: 1.2, heightMeters: sp === 1 ? 0.06 : 0.02 }));
  const W = Math.min(1024, S);
  T.waterNormal = bake({ w: W, frag: BAKE_WATER_NORMAL, uniforms: { uNormalStrength: { value: 0.012 * W / (2 * 1.0) } } });
  T.foam = bake({ w: 512, frag: BAKE_FOAM });
  T.scales = bake({ w: 512, frag: BAKE_SCALES, uniforms: { uNormalStrength: { value: 0.004 * 512 / (2 * 0.06) } } });
  return T;
}

// ==== CANVAS ATLASES (leaves, litter, fern, grass) ===========================
// ASSET HOOK: replace with photographed atlases (RGBA, alpha = coverage).
function makeAtlasTexture(w, h, bg, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const m = document.createElement('canvas'); m.width = w; m.height = h;
  const g = c.getContext('2d'), mg = m.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  mg.fillStyle = '#000'; mg.fillRect(0, 0, w, h);
  draw(g, mg);
  const cd = g.getImageData(0, 0, w, h).data, md = mg.getImageData(0, 0, w, h).data;
  const out = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) {
    const src = (h - 1 - y) * w * 4, dst = y * w * 4;   // flip rows: canvas top = v 1
    for (let x = 0; x < w * 4; x += 4) {
      out[dst + x] = cd[src + x]; out[dst + x + 1] = cd[src + x + 1]; out[dst + x + 2] = cd[src + x + 2];
      out[dst + x + 3] = md[src + x];
    }
  }
  const tex = new THREE.DataTexture(out, w, h, THREE.RGBAFormat);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = MAX_ANISO;
  tex.needsUpdate = true;
  return tex;
}
const hsl = (h, s, l, a = 1) => `hsla(${h.toFixed(1)},${clamp(s, 0, 100).toFixed(1)}%,${clamp(l, 0, 100).toFixed(1)}%,${a})`;

function leafPath(len, wid, kind) {
  const p = new Path2D();
  if (kind === 'oak') {
    const N = 26, lobes = 4.5, top = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const env = Math.sin(Math.PI * Math.pow(t, 0.75)) * (1 - 0.25 * t);
      const lobe = 0.62 + 0.38 * Math.cos(t * lobes * Math.PI * 2 + 0.6);
      top.push([len * t, -wid * env * lobe]);
    }
    p.moveTo(0, 0);
    for (const q of top) p.lineTo(q[0], q[1]);
    for (let i = top.length - 1; i >= 0; i--) p.lineTo(top[i][0], -top[i][1] * 0.95);
    p.closePath();
  } else {
    const serr = kind === 'alder' ? 0.0 : 0.04;
    p.moveTo(0, 0);
    p.bezierCurveTo(len * 0.18, -wid * (1.05 + serr), len * 0.72, -wid * 0.98, len, 0);
    p.bezierCurveTo(len * 0.72, wid * 0.98, len * 0.18, wid * (1.05 + serr), 0, 0);
  }
  return p;
}

function drawLeaf(g, mg, x, y, ang, len, wid, col, kind, r) {
  const path = leafPath(len, wid, kind);
  g.save(); g.translate(x, y); g.rotate(ang);
  const grd = g.createLinearGradient(0, -wid, 0, wid);
  grd.addColorStop(0, hsl(col.h, col.s, col.l * 0.82));
  grd.addColorStop(0.5, hsl(col.h + 5, col.s + 6, col.l * 1.12));
  grd.addColorStop(1, hsl(col.h - 2, col.s, col.l * 0.88));
  g.fillStyle = grd; g.fill(path);
  // subtle blotches
  for (let k = 0; k < 3; k++) {
    g.fillStyle = hsl(col.h + r.range(-15, 10), col.s, col.l * r.range(0.7, 1.25), 0.25);
    g.beginPath(); g.ellipse(len * r.range(0.2, 0.8), r.range(-wid, wid) * 0.5, len * 0.12, wid * 0.3, 0, 0, Math.PI * 2); g.fill();
  }
  g.save(); g.clip(path);
  g.strokeStyle = hsl(col.h + 10, col.s - 12, col.l * 1.45, 0.8);
  g.lineWidth = Math.max(1, len * 0.022);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(len * 0.97, 0); g.stroke();
  g.lineWidth = Math.max(0.6, len * 0.009);
  const nv = kind === 'oak' ? 5 : 7;
  for (let k = 1; k <= nv; k++) {
    const t = k / (nv + 1);
    g.beginPath();
    g.moveTo(len * t, 0); g.quadraticCurveTo(len * (t + 0.06), -wid * 0.45, len * (t + 0.13), -wid * 0.95);
    g.moveTo(len * t, 0); g.quadraticCurveTo(len * (t + 0.06), wid * 0.45, len * (t + 0.13), wid * 0.95);
    g.stroke();
  }
  g.restore();
  // petiole
  g.strokeStyle = hsl(col.h - 30, 30, col.l * 0.9); g.lineWidth = Math.max(1, len * 0.03);
  g.beginPath(); g.moveTo(-len * 0.08, 0); g.lineTo(0, 0); g.stroke();
  g.restore();
  mg.save(); mg.translate(x, y); mg.rotate(ang); mg.fillStyle = '#fff'; mg.fill(path);
  mg.strokeStyle = '#fff'; mg.lineWidth = Math.max(1, len * 0.03); mg.beginPath(); mg.moveTo(-len * 0.08, 0); mg.lineTo(0, 0); mg.stroke();
  mg.restore();
}

// Leaf clusters: 2x2 atlas of twigs with 11-18 leaves; the twig base sits at the bottom
// centre of each cell (= card attachment point, uv.y = 0).
function makeFoliageAtlas(size, kind, seed) {
  const r = makeRng(seed);
  const cell = size / 2;
  return makeAtlasTexture(size, size, kind === 'oak' ? 'rgb(50,64,30)' : 'rgb(58,74,34)', (g, mg) => {
    for (let cy = 0; cy < 2; cy++) for (let cx = 0; cx < 2; cx++) {
      const ox = cx * cell, oy = cy * cell, S = cell;
      for (const ctx of [g, mg]) { ctx.save(); ctx.beginPath(); ctx.rect(ox + 1, oy + 1, S - 2, S - 2); ctx.clip(); }
      const x0 = ox + S * 0.5, y0 = oy + S * 0.985;
      const x1 = ox + S * (0.5 + r.range(-0.14, 0.14)), y1 = oy + S * 0.1;
      const qx = ox + S * (0.5 + r.range(-0.22, 0.22)), qy = oy + S * 0.55;
      const qb = (a, b, c, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
      for (const [ctx, col] of [[g, '#3a2a1d'], [mg, '#fff']]) {
        ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = S * 0.011;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(qx, qy, x1, y1); ctx.stroke();
      }
      // side twigs
      const twigs = [[x0, y0, qx, qy, x1, y1]];
      for (let k = 0; k < 3; k++) {
        const t = r.range(0.25, 0.7);
        const sx = qb(x0, qx, x1, t), sy = qb(y0, qy, y1, t);
        const dir = (k % 2 ? 1 : -1) * r.range(0.5, 1.0) - Math.PI / 2;
        const L = S * r.range(0.25, 0.4);
        const ex = sx + Math.cos(dir) * L, ey = sy + Math.sin(dir) * L;
        const mx = (sx + ex) / 2 + r.range(-0.05, 0.05) * S, my = (sy + ey) / 2 + r.range(-0.05, 0.05) * S;
        for (const [ctx, col] of [[g, '#3a2a1d'], [mg, '#fff']]) {
          ctx.strokeStyle = col; ctx.lineWidth = S * 0.007;
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
        }
        twigs.push([sx, sy, mx, my, ex, ey]);
      }
      const n = kind === 'alder' ? r.int(18, 24) : r.int(24, 32);
      for (let i = 0; i < n; i++) {
        const tw = twigs[i % twigs.length];
        const t = 0.12 + 0.88 * r.next();
        const px = qb(tw[0], tw[2], tw[4], t), py = qb(tw[1], tw[3], tw[5], t);
        const tx = 2 * (1 - t) * (tw[2] - tw[0]) + 2 * t * (tw[4] - tw[2]), ty = 2 * (1 - t) * (tw[3] - tw[1]) + 2 * t * (tw[5] - tw[3]);
        const base = Math.atan2(ty, tx);
        const side = i % 2 ? 1 : -1;
        const ang = base + side * r.range(0.5, 1.3) + r.range(-0.2, 0.2);
        const len = S * r.range(0.11, 0.17) * (kind === 'oak' ? 1.1 : kind === 'alder' ? 1.0 : 1);
        const wid = len * (kind === 'alder' ? r.range(0.42, 0.52) : kind === 'oak' ? r.range(0.3, 0.36) : r.range(0.3, 0.38));
        const yellow = r.next() < 0.15;
        const col = yellow ? { h: r.range(56, 70), s: r.range(34, 48), l: r.range(26, 36) }
                           : { h: r.range(78, 100), s: r.range(26, 46), l: r.range(16, 30) };
        drawLeaf(g, mg, px, py, ang, len, wid, col, kind, r);
      }
      // tip leaf
      drawLeaf(g, mg, x1, y1, Math.atan2(y1 - qy, x1 - qx), S * 0.16, S * 0.055, { h: 86, s: 42, l: 28 }, kind, r);
      g.restore(); mg.restore();
    }
  });
}

// Forest-floor litter: 4x4 atlas — single fallen leaves and small clumps, browns/ochres,
// some with holes (drawn only into the coverage mask).
function makeLitterAtlas(size, seed) {
  const r = makeRng(seed);
  const cell = size / 4;
  return makeAtlasTexture(size, size, 'rgb(58,38,22)', (g, mg) => {
    for (let cy = 0; cy < 4; cy++) for (let cx = 0; cx < 4; cx++) {
      const ox = cx * cell, oy = cy * cell, S = cell;
      for (const ctx of [g, mg]) { ctx.save(); ctx.beginPath(); ctx.rect(ox + 1, oy + 1, S - 2, S - 2); ctx.clip(); }
      const clump = (cx + cy) % 3 !== 0;
      const n = clump ? r.int(4, 7) : 1;
      for (let i = 0; i < n; i++) {
        const kind = r.pick(['oak', 'beech', 'beech', 'alder']);
        const len = clump ? S * r.range(0.32, 0.46) : S * 0.8;
        const wid = len * (kind === 'oak' ? 0.34 : 0.4);
        const cxp = ox + S * (clump ? r.range(0.25, 0.75) : 0.5), cyp = oy + S * (clump ? r.range(0.25, 0.75) : 0.5);
        const ang = r.range(0, Math.PI * 2);
        const px = cxp - Math.cos(ang) * len * 0.5, py = cyp - Math.sin(ang) * len * 0.5;
        const t = r.next();
        const col = t < 0.4 ? { h: r.range(20, 32), s: r.range(45, 70), l: r.range(18, 30) }
                  : t < 0.75 ? { h: r.range(28, 42), s: r.range(35, 55), l: r.range(22, 36) }
                  : t < 0.92 ? { h: r.range(15, 28), s: r.range(20, 40), l: r.range(9, 16) }
                  : { h: r.range(45, 60), s: r.range(35, 55), l: r.range(28, 40) };
        drawLeaf(g, mg, px, py, ang, len, wid, col, kind, r);
        // decay holes
        if (r.next() < 0.45) {
          mg.fillStyle = '#000';
          for (let k = 0, nh = r.int(1, 4); k < nh; k++) {
            mg.beginPath();
            mg.arc(px + Math.cos(ang) * len * r.range(0.2, 0.9) + r.range(-wid, wid) * 0.4, py + Math.sin(ang) * len * r.range(0.2, 0.9) + r.range(-wid, wid) * 0.4, r.range(1.5, len * 0.07), 0, Math.PI * 2);
            mg.fill();
          }
        }
      }
      g.restore(); mg.restore();
    }
  });
}

// Fern frond: rachis with alternating serrated pinnae, base at the bottom (v = 0).
function makeFernAtlas(w, h, seed) {
  const r = makeRng(seed);
  return makeAtlasTexture(w, h, 'rgb(46,74,22)', (g, mg) => {
    const cx = w * 0.5;
    const rach = (ctx, col) => { ctx.strokeStyle = col; ctx.lineWidth = w * 0.022; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, h); ctx.lineTo(cx, h * 0.02); ctx.stroke(); };
    rach(g, '#3b5a1a'); rach(mg, '#fff');
    const N = 26;
    for (let i = 0; i < N; i++) {
      const t = 0.08 + 0.9 * i / N;
      const y = h * (1 - t);
      const len = w * 0.48 * Math.sin(Math.PI * Math.pow(t, 0.7)) * (1 - 0.35 * t) + w * 0.03;
      for (const side of [-1, 1]) {
        const ang = side < 0 ? Math.PI + 0.35 : -0.35;
        const yy = y + side * h * 0.006;
        const col = { h: r.range(88, 100), s: r.range(45, 60), l: r.range(22, 32) };
        g.save(); g.translate(cx, yy); g.rotate(ang);
        const p = new Path2D();
        const lw = h * 0.016 * (1 - 0.4 * t);
        p.moveTo(0, 0);
        const segs = 8;
        for (let k = 0; k <= segs; k++) { const u = k / segs; p.lineTo(len * u, -lw * (1 - u * 0.85) * (k % 2 ? 1.25 : 0.85)); }
        for (let k = segs; k >= 0; k--) { const u = k / segs; p.lineTo(len * u, lw * (1 - u * 0.85) * (k % 2 ? 1.25 : 0.85)); }
        p.closePath();
        g.fillStyle = hsl(col.h, col.s, col.l); g.fill(p);
        g.strokeStyle = hsl(col.h + 8, col.s - 10, col.l * 1.4, 0.7); g.lineWidth = 1; g.beginPath(); g.moveTo(0, 0); g.lineTo(len * 0.95, 0); g.stroke();
        g.restore();
        mg.save(); mg.translate(cx, yy); mg.rotate(ang); mg.fillStyle = '#fff'; mg.fill(p); mg.restore();
      }
    }
  });
}

// Grass: a tuft of tapered blades rooted at the bottom edge.
function makeGrassAtlas(size, seed) {
  const r = makeRng(seed);
  return makeAtlasTexture(size, size, 'rgb(56,78,26)', (g, mg) => {
    for (let i = 0; i < 34; i++) {
      const x0 = size * r.range(0.15, 0.85), hgt = size * r.range(0.45, 0.97), bend = size * r.range(-0.25, 0.25);
      const wdt = size * r.range(0.012, 0.024);
      const col = r.next() < 0.2 ? { h: r.range(45, 60), s: 40, l: r.range(30, 42) } : { h: r.range(78, 100), s: r.range(35, 55), l: r.range(18, 34) };
      const p = new Path2D();
      p.moveTo(x0 - wdt, size);
      p.quadraticCurveTo(x0 - wdt * 0.5 + bend * 0.3, size - hgt * 0.55, x0 + bend, size - hgt);
      p.quadraticCurveTo(x0 + wdt * 0.5 + bend * 0.3, size - hgt * 0.55, x0 + wdt, size);
      p.closePath();
      const grd = g.createLinearGradient(0, size, 0, size - hgt);
      grd.addColorStop(0, hsl(col.h - 10, col.s, col.l * 0.5)); grd.addColorStop(1, hsl(col.h, col.s, col.l * 1.1));
      g.fillStyle = grd; g.fill(p);
      mg.fillStyle = '#fff'; mg.fill(p);
    }
  });
}

let ATLAS = null;
function makeCanvasAtlases() {
  return {
    beech: makeFoliageAtlas(1024, 'beech', 11),
    oak: makeFoliageAtlas(1024, 'oak', 12),
    alder: makeFoliageAtlas(1024, 'alder', 13),
    litter: makeLitterAtlas(1024, 21),
    fern: makeFernAtlas(256, 1024, 31),
    grass: makeGrassAtlas(512, 41),
  };
}

// ==== SKY, ENVIRONMENT & LIGHTS ==============================================
// Sun: warm, low (~35°), from behind-left of the main view axis (camera looks toward -Z,
// the fox stands on the far bank) so subjects get a rim of light like the reference.
const SUN = { elevation: 35, azimuth: -38, intensity: 5.0 };
const sun = new THREE.DirectionalLight(0xffe0b0, SUN.intensity);
sun.castShadow = true;
sun.shadow.mapSize.set(PARAMS.shadowSize, PARAMS.shadowSize);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
{
  const c = sun.shadow.camera;
  c.left = -27; c.right = 27; c.top = 27; c.bottom = -27; c.near = 20; c.far = 135;   // fitted around the pond
  c.updateProjectionMatrix();
}
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0x7ea0c0, 0x2b3a1e, 0.32);
scene.add(hemi);
U.uShadowMatrix.value = sun.shadow.matrix;   // same Matrix4 instance, updated by the shadow pass

const SUN_TARGET = new THREE.Vector3(0, 0, -1.5);
const sunColorLow = new THREE.Color(1.0, 0.62, 0.36), sunColorMid = new THREE.Color(0xffe0b0), sunColorHigh = new THREE.Color(1.0, 0.95, 0.88);
let envDirty = true;

function sunDirFromAngles(elevDeg, azDeg, out = new THREE.Vector3()) {
  const el = THREE.MathUtils.degToRad(elevDeg), az = THREE.MathUtils.degToRad(azDeg);
  return out.set(Math.cos(el) * Math.sin(az), Math.sin(el), -Math.cos(el) * Math.cos(az)).normalize();
}

function updateSun() {
  const dir = sunDirFromAngles(SUN.elevation, SUN.azimuth, U.uSunDir.value);
  const e = SUN.elevation;
  const col = new THREE.Color();
  if (e < 35) col.copy(sunColorLow).lerp(sunColorMid, smoothstep(4, 35, e));
  else col.copy(sunColorMid).lerp(sunColorHigh, smoothstep(35, 70, e));
  const k = SUN.intensity * smoothstep(0.5, 12, e);
  // sun.color is the sRGB-authored #ffe0b0 at the reference angle; stored in linear here
  sun.color.copy(col);
  sun.intensity = k;
  U.uSunTint.value.copy(col);
  U.uSunColor.value.copy(col).multiplyScalar(k);
  sun.position.copy(SUN_TARGET).addScaledVector(dir, 80);
  sun.target.position.copy(SUN_TARGET);
  sun.target.updateMatrixWorld();
  sun.updateMatrixWorld();
  // sky tints: deeper blue high up, paler + warmer haze when the sun is low
  const low = 1 - smoothstep(10, 45, e);
  U.uSkyZenith.value.setRGB(0.42 + 0.08 * low, 0.56 + 0.05 * low, 0.80 - 0.08 * low).multiplyScalar(1.7);
  U.uSkyHorizon.value.setRGB(0.80 + 0.12 * low, 0.84 + 0.02 * low, 0.88 - 0.1 * low).multiplyScalar(2.1);
  // ambient estimate (hemisphere + dim canopy-filtered env) used by the water shader
  U.uAmbient.value.setRGB(0.020, 0.028, 0.024).multiplyScalar(0.6 + 0.6 * smoothstep(5, 40, e));
  envDirty = true;
}

// Sky dome rendered into a cube map → scene.background (visible through canopy gaps).
const skyCubeRT = new THREE.WebGLCubeRenderTarget(512, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
const skyCubeCam = new THREE.CubeCamera(1, 1000, skyCubeRT);
const skyScene = new THREE.Scene();
const envScene = new THREE.Scene();
const SKY_VERT = /* glsl */`
varying vec3 vDir;
void main() { vDir = normalize( position ); gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }
`;
function makeSkyMaterial(env) {
  return new THREE.ShaderMaterial({
    uniforms: { uSunDir: U.uSunDir, uSkyZenith: U.uSkyZenith, uSkyHorizon: U.uSkyHorizon, uSkyGround: U.uSkyGround, uSunTint: U.uSunTint },
    vertexShader: SKY_VERT,
    fragmentShader: 'uniform vec3 uSunDir;\nvarying vec3 vDir;\n' + GLSL_NOISE + GLSL_SKY + `
      void main() { vec3 d = normalize( vDir ); gl_FragColor = vec4( ${env ? 'envCanopy( d, uSunDir )' : 'skyColor( d, uSunDir )'}, 1.0 ); }`,
    side: THREE.BackSide, depthWrite: false, depthTest: false,
  });
}
skyScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 64, 32), makeSkyMaterial(false)));
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 64, 32), makeSkyMaterial(true)));
const pmrem = new THREE.PMREMGenerator(renderer);
let proceduralEnvRT = null;
let hdriEnvTexture = null;
const ENV_INTENSITY = { procedural: 1.0, hdri: 0.32 };

function refreshSkyAndEnv() {
  skyCubeCam.update(renderer, skyScene);
  scene.background = skyCubeRT.texture;
  if (!hdriEnvTexture) {
    if (proceduralEnvRT) proceduralEnvRT.dispose();
    proceduralEnvRT = pmrem.fromScene(envScene, 0.02, 0.1, 500);
    scene.environment = proceduralEnvRT.texture;
    scene.environmentIntensity = ENV_INTENSITY.procedural;
  }
  envDirty = false;
}

// ASSET HOOK: forest HDRIs tried in order (?hdri=<url> overrides). Any equirect .hdr works;
// on failure / no network the procedural sky+canopy environment stays in use.
const HDRI_CANDIDATES = [
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/forest_slope_1k.hdr',
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/phalzer_forest_01_1k.hdr',
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/hochsal_forest_1k.hdr',
];
let envSourceLabel = 'procedural sky + canopy';
async function tryLoadHDRI() {
  if (PARAMS.noHdri) return;
  const list = PARAMS.hdri ? [PARAMS.hdri] : HDRI_CANDIDATES;
  const loader = new RGBELoader();
  for (const url of list) {
    try {
      const tex = await Promise.race([
        loader.loadAsync(url),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 9000)),
      ]);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      hdriEnvTexture = pmrem.fromEquirectangular(tex).texture;
      tex.dispose();
      scene.environment = hdriEnvTexture;
      scene.environmentIntensity = ENV_INTENSITY.hdri;
      scene.environmentRotation.set(0, THREE.MathUtils.degToRad(SUN.azimuth), 0);
      envSourceLabel = 'HDRI ' + url.split('/').pop();
      return;
    } catch (e) {
      console.info('HDRI unavailable, keeping procedural environment:', url, e && e.message);
    }
  }
}

// ==== POND SHAPE & TERRAIN HEIGHT ============================================
const POND = { R0: 7.4, depth: 2.25 };
function pondRadius(theta) {
  return POND.R0 * (1 + 0.15 * Math.sin(2 * theta + 0.8) + 0.08 * Math.sin(3 * theta + 2.1)
    + 0.05 * Math.sin(5 * theta + 0.4) + 0.02 * Math.sin(9 * theta + 1.3));
}
function pondS(x, z) { return Math.hypot(x, z) / pondRadius(Math.atan2(z, x)); }
const mounds = [];   // {x, z, r, h} added by tree placement (root flares sit on small mounds)
function baseHeight(x, z) {
  const d = Math.hypot(x, z);
  const s = d / pondRadius(Math.atan2(z, x)) + Noise.fbm2(x * 0.22 + 11, z * 0.22 - 7, 3) * 0.06;
  const inner = -POND.depth * Math.pow(Math.max(0, 1 - s * s), 1.35) - 0.3 * (1 - s);
  const outer = 0.55 * (1 - Math.exp(-(s - 1) * 2.4));
  let h = lerp(inner, outer, smoothstep(0.94, 1.08, s));

function makeRockGeometry(seed, detail, { sx = 1, sy = 0.7, sz = 1, lump = 0.3, flat = 0.4, cuts = 4 } = {}) {
  let g = new THREE.IcosahedronGeometry(1, detail);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const r = makeRng(seed);
  const o = [r.range(0, 100), r.range(0, 100), r.range(0, 100)];
  const planes = [];
  for (let i = 0; i < cuts; i++) {
    const n = new THREE.Vector3(r.gauss(), r.gauss() * 0.6 + 0.2, r.gauss()).normalize();
    planes.push({ n, d: r.range(0.62, 0.86) });
  }
  const p = new THREE.Vector3();
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i).normalize();
    let d = 1 + Noise.fbm3(p.x * 1.2 + o[0], p.y * 1.2 + o[1], p.z * 1.2 + o[2], 4) * lump
      + (1 - Math.abs(Noise.n3(p.x * 3.3 + o[1], p.y * 3.3 + o[2], p.z * 3.3 + o[0]))) * 0.06

    p.multiplyScalar(d);
