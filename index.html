  camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  const w = Math.max(2, Math.floor(window.innerWidth * pr * settings.renderScale));
  const h = Math.max(2, Math.floor(window.innerHeight * pr * settings.renderScale));
  internalSize = [w, h];
  if (composer) composer.setSize(w, h);
  particleUniforms.uPxScale.value = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
window.addEventListener('resize', () => resize());

// ==== FRAME UPDATE ===========================================================
let simTime = PARAMS.startTime;
let lastEnvRefresh = -1;
function update(dt) {
  const sdt = guiState.paused ? 0 : dt;
  simTime += sdt;
  U.uTime.value = simTime;
  const w = settings.wind;
  U.uWind.value.z = w;
  U.uWind.value.w = clamp(Noise.n2(simTime * 0.07, 3.3) * 0.6 + 0.15, -0.2, 0.7);
  let focus;
  if (camState.mode === 'cinematic') focus = updateCinematic(sdt);
  else { const cpuHit = updateFree(dt); focus = autoFocus.value !== null ? autoFocus.value : cpuHit; }
  camera.updateMatrixWorld();
  updateMedium(dt);
  camera.getWorldDirection(_fwd);
  if (camState.under) { const fd = nearestFish(camera.position, _fwd, 5, 0.93); if (fd) focus = fd; }
  camState.focus = lerp(camState.focus, clamp(focus, 0.25, 80), 1 - Math.exp(-dt * 2.5));
  dofPass.focus.value = camState.focus;
  dofPass.aperture.value = settings.aperture * 1.3;
  updateFish(sdt, camera.position, camState.under);
  updateFloatingLeaves(sdt);
  updateBubbles(sdt);
  updateSplash(sdt);
  particleUniforms.uBoxCenter.value.copy(camera.position);
  gradePass.mat.uniforms.uUnder.value = camState.underBlend;
  gradePass.mat.uniforms.uDrops.value = camState.drops;
  gradePass.mat.uniforms.uDropSlide.value = camState.dropSlide;
  toneMapPass.mat.uniforms.uMediumExp.value = lerp(1, 0.85, camState.underBlend);
  waterMat.uniforms.uVolRefl.value = settings.volumetric ? settings.volStrength * 0.9 : 0;
  lightingPass.volMat.uniforms.uWaterDensity.value = 0.3 * (0.5 + settings.murk);
  exposurePass.dt = dt;
  if (envDirty && performance.now() - lastEnvRefresh > 200) { refreshSkyAndEnv(); lastEnvRefresh = performance.now(); }
  updateAudio(dt);
}

// ==== DEBUG / TEST HOOKS =====================================================
function measureSunCoverage(radius = 18, res = 160) {
  const cam = new THREE.OrthographicCamera(-radius, radius, radius, -radius, 1, 300);
  cam.position.set(0, 150, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0); cam.updateMatrixWorld();
  const mat = new THREE.ShaderMaterial({
    uniforms: { uShadowMap: U.uShadowMap, uShadowMatrix: U.uShadowMatrix, uShadowOutside: U.uShadowOutside },
    vertexShader: 'varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: '#include <packing>\n' + GLSL_SUNVIS + '\nvarying vec3 vW; void main() { gl_FragColor = vec4(sunVisibility(vW + vec3(0.0, 0.04, 0.0)), vW.y > 0.02 ? 1.0 : 0.0, 1.0, 1.0); }',
  });
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(terrainMesh.geometry, mat));
  const rt = new THREE.WebGLRenderTarget(res, res);
  renderer.setRenderTarget(rt); renderer.render(s, cam);
  const px = new Uint8Array(res * res * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, res, res, px);
  renderer.setRenderTarget(null);
  let land = 0, landLit = 0, water = 0, waterLit = 0;
  for (let i = 0; i < res * res; i++) {
    const x = (i % res) / res * 2 - 1, y = Math.floor(i / res) / res * 2 - 1;
    if (x * x + y * y > 1) continue;
    const v = px[i * 4] / 255;
    if (px[i * 4 + 1] > 127) { land++; landLit += v; } else { water++; waterLit += v; }
  }
  rt.dispose(); mat.dispose();
  return { land: landLit / Math.max(land, 1), water: waterLit / Math.max(water, 1), all: (landLit + waterLit) / Math.max(land + water, 1) };
}
window.__app = {
  ready: false,
  setTime(t) { camState.t = t; simTime = t; },
  frames(n, dt = 1 / 30) { for (let i = 0; i < n; i++) { update(dt); composer.render(dt); } },
  measureSunCoverage,
  info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, programs: renderer.info.programs.length, textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries }),
  settings, camState, SUN, updateSun,
  counts: () => ({ trees: trees.length, leaves: SPECIES_KEYS.map((k) => leafCards[k].length), fish: fishes.length }),
  set(k, v) {
    if (k === 'debug') { lightingPass.compMat.uniforms.uDebug.value = v; return; }
    if (k === 'nowater') { waterMesh.visible = !v; return; }
    if (k === 'nofoliage') { for (const m of foliageMeshes) m.visible = !v; return; }
    if (k === 'caustics') { U.uCausticStrength.value = v; return; }
    if (k === 'noshadowsample') { U.uShadowOutside.value = v ? 1 : 0.12; return; } settings[k] = v; if (k === 'bloom') bloomPass.enabled = v; if (k === 'dof') dofPass.enabled = v; if (k === 'smaa') smaaPass.enabled = v; },
  exposure() {
    const px = new Float32Array(4);
    const rt = exposurePass.adapt[exposurePass.i];
    const tmp = new THREE.WebGLRenderTarget(1, 1, { type: THREE.FloatType });
    const q = new FullScreenQuad(fsMat('uniform sampler2D t; varying vec2 vUv; void main(){ gl_FragColor = texture2D(t, vec2(0.5)); }', { t: { value: rt.texture } }));
    renderer.setRenderTarget(tmp); q.render(renderer); renderer.readRenderTargetPixels(tmp, 0, 0, 1, 1, px); renderer.setRenderTarget(null);
    const avg = Math.pow(2, px[0]); const k = toneMapPass.mat.uniforms.uKey.value;
    return { avgLum: avg, autoE: Math.min(1.6, Math.max(0.6, Math.pow(k / avg, 0.45))) };
  },
  hud: () => hud.textContent,
  perf: () => ({ ...perf, scale: settings.renderScale, auto: settings.autoScale }),
  env: () => envSourceLabel,
  pose(px, py, pz, lx, ly, lz) {
    camState.mode = 'free';
    camera.position.set(px, py, pz); camera.lookAt(lx, ly, lz); camera.updateMatrixWorld();
    _e.setFromQuaternion(camera.quaternion, 'YXZ'); camState.yaw = _e.y; camState.pitch = _e.x;
    camState.focus = Math.hypot(lx - px, ly - py, lz - pz);
  },
  debugRoots() {
    const m = scene.getObjectByName('roots');
    if (!m) return 'no roots mesh';
    m.geometry.computeBoundingBox();
    const forced = trees.filter((t) => t.forced).map((t) => [t.sp, t.x, t.z, t.R0]);
    return { verts: m.geometry.attributes.position.count, box: m.geometry.boundingBox, forced, fox: foxGroup && foxGroup.position };
  },
  settle() { camState.drops = 0; camState.underBlend = camState.under ? 1 : 0; exposurePass.instant = 2; },
  frameInfo() { renderer.info.autoReset = false; renderer.info.reset(); update(1 / 30); composer.render(1 / 30); const i = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; renderer.info.autoReset = true; return i; },
};

// ==== INIT ===================================================================
async function init() {
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 is required.');
  await setLoading('Baking procedural PBR textures…', 0.03);
  TEX = await bakeAllTextures();
  await setLoading('Painting leaves…', 0.2);
  ATLAS = makeCanvasAtlases();
  await setLoading('Sky & sun…', 0.25);
  updateSun();
  refreshSkyAndEnv();
  buildCameraPath();
  await setLoading('Shaping the pond…', 0.3);
  placeTrees();
  buildTerrain();
  buildRocks();
  buildDeadwood();
  await setLoading('Growing trees…', 0.38);
  const grown = buildTrees();
  carveSunShafts();
  addBushes();
  buildFoliage();
  await setLoading('Far forest…', 0.52);
  buildImpostors(grown);
  await setLoading('Roots, ferns & leaf litter…', 0.6);
  buildRoots();
  buildFerns();
  buildGrass();
  buildLitter();
  await setLoading('Water…', 0.68);
  buildWater();
  buildFloatingLeaves();
  await setLoading('Fish…', 0.72);
  buildFish();
  buildParticles();
  await setLoading('A visitor at the water’s edge…', 0.76);
  await buildFox();
  await setLoading('Post-processing…', 0.8);
  buildPost();
  if (PARAMS.scale !== null) settings.renderScale = clamp(PARAMS.scale, 0.3, 1);
  else {
    const pr = renderer.getPixelRatio(), px = window.innerWidth * window.innerHeight * pr * pr;
    if (px > 4.2e6) settings.renderScale = Math.max(0.6, Math.round(Math.sqrt(4.2e6 / px) * 20) / 20);
  }
  resize();
  buildGUI();
  if (camState.mode === 'cinematic') updateCinematic(0);
  else { cinematicPose(camState.t, camera.position, _cl); camera.lookAt(_cl); enterFree(); }
  camera.updateMatrixWorld();
  await setLoading('Compiling shaders…', 0.86);
  try {
    await renderer.compileAsync(scene, camera);
    await renderer.compileAsync(overlayScene, camera, scene);
  } catch (e) { console.warn('compileAsync', e); }
  await setLoading('Almost there…', 0.96);
  tryLoadHDRI();
  window.__app.ready = true;
  const clock = new THREE.Clock();
  if (!PARAMS.test) {
    renderer.setAnimationLoop(() => {
      const raw = clock.getDelta();            // real frame time drives the FPS meter / auto scale
      const dt = Math.min(raw, 1 / 15);        // simulation step is clamped (tab switches, hitches)
      update(dt);
      composer.render(dt);
      updatePerf(raw);
      updateHUD(raw);
    });
  } else {
    window.__app.frames(2);
  }
  document.getElementById('loading').classList.add('done');
}
init().catch((e) => showError(e && (e.stack || e.message) || String(e)));
</script>
