    const sx = Math.cos(th) * R, sz = Math.sin(th) * R;
    if (isNearCameraPath(sx, sz, 1.2, 1.5)) continue;
    place(sx, sz, r.range(0.25, 0.6), { sx: r.range(1, 1.5), sy: 0.6, sz: r.range(0.8, 1.3) }, 14, 0.55);
  }
  reflectLayers(group, true, true);
  scene.add(group);
}

// ==== BARK MATERIALS (trunks, branches, roots, fallen wood) ==================
const BARK = {};
function makeBarkMaterial(sp, variant) {
  const t = TEX.bark[sp];
  const mat = new THREE.MeshStandardMaterial({
    map: t.map, normalMap: t.normalMap, roughnessMap: t.ormMap, aoMap: t.ormMap, aoMapIntensity: 0.9,
    roughness: 1, metalness: 0, color: variant === 'root' ? 0xa39a8c : 0xffffff,
    normalScale: new THREE.Vector2(1.2, 1.2),
  });
  if (variant === 'near') { mat.displacementMap = t.ormMap; mat.displacementScale = 0.035; mat.displacementBias = -0.028; }
  const o = { key: `bark${sp}-${variant}`, wet: { band: 0.1, darken: 0.5, rough: 0.2, roughUnder: 0.25 } };
  if (variant === 'near' || variant === 'far') o.wind = 'tree';
  patchWorldMaterial(mat, o);
  mat.userData.patch = o;
  return mat;
}

// ==== TUBE BUILDER (trunks, branches, roots) =================================
// radiusFn(s, theta) → radius; s ∈ [0,1] along the curve. Normals from the actual surface.
function buildTube(curve, radiusFn, radialSegs, lengthSegs, uRepeat, vScale, extraAttr = null) {
  const frames = curve.computeFrenetFrames(lengthSegs, false);
  const len = curve.getLength();
  const cols = radialSegs + 1, rows = lengthSegs + 1;
  const pos = new Float32Array(cols * rows * 3), uv = new Float32Array(cols * rows * 2);
  const P = new THREE.Vector3(), dir = new THREE.Vector3();
  for (let i = 0; i < rows; i++) {
    const s = i / lengthSegs;
    curve.getPointAt(s, P);
    const N = frames.normals[i], B = frames.binormals[i];
    for (let j = 0; j < cols; j++) {
      const th = (j / radialSegs) * Math.PI * 2;
      const r = radiusFn(s, th);
      dir.copy(N).multiplyScalar(Math.cos(th)).addScaledVector(B, Math.sin(th));
      const k = (i * cols + j);
      pos[k * 3] = P.x + dir.x * r; pos[k * 3 + 1] = P.y + dir.y * r; pos[k * 3 + 2] = P.z + dir.z * r;
      uv[k * 2] = (j / radialSegs) * uRepeat; uv[k * 2 + 1] = s * len * vScale;
    }
  }
  const nrm = new Float32Array(cols * rows * 3);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const get = (i, j, v) => { const k = (i * cols + j) * 3; return v.set(pos[k], pos[k + 1], pos[k + 2]); };
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const jl = j === 0 ? radialSegs - 1 : j - 1, jr = j === radialSegs ? 1 : j + 1;
    const il = Math.max(0, i - 1), ir = Math.min(rows - 1, i + 1);
    get(i, jr, a).sub(get(i, jl, c));           // around
    get(ir, j, b).sub(get(il, j, c));           // along
    const n = a.clone().cross(b).normalize();
    // make sure it points outward
    curve.getPointAt(i / lengthSegs, P);
    get(i, j, c).sub(P);
    if (n.dot(c) < 0) n.negate();
    const k = (i * cols + j) * 3; nrm[k] = n.x; nrm[k + 1] = n.y; nrm[k + 2] = n.z;
  }
  const idx = [];
  for (let i = 0; i < lengthSegs; i++) for (let j = 0; j < radialSegs; j++) {
    const p0 = i * cols + j, p1 = p0 + 1, p2 = p0 + cols, p3 = p2 + 1;
    idx.push(p0, p1, p2, p1, p3, p2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  if (extraAttr) {
    const arr = new Float32Array(cols * rows * extraAttr.size);
    for (let i = 0; i < cols * rows; i++) arr.set(extraAttr.value, i * extraAttr.size);
    g.setAttribute(extraAttr.name, new THREE.BufferAttribute(arr, extraAttr.size));
  }
  g.setIndex(idx);
  return g;
}

// ==== FALLEN BRANCH & SUBMERGED TWIGS ========================================
function buildDeadwood() {
  const group = new THREE.Group(); group.name = 'deadwood';
  const mat = makeBarkMaterial(2, 'dead');
  const r = makeRng(4242);
  // fallen branch from the west bank into the water
  const th = 2.72, R = pondRadius(th);
  const bank = new THREE.Vector3(Math.cos(th) * R * 1.32, 0, Math.sin(th) * R * 1.32);
  bank.y = terrainHeight(bank.x, bank.z) + 0.06;
  const tip = new THREE.Vector3(Math.cos(th) * R * 0.62, 0, Math.sin(th) * R * 0.62 + 0.8);
  tip.y = terrainHeight(tip.x, tip.z) + 0.08;
  const mid1 = bank.clone().lerp(tip, 0.33); mid1.y = Math.max(terrainHeight(mid1.x, mid1.z) + 0.1, 0.12);
  const mid2 = bank.clone().lerp(tip, 0.66); mid2.y = Math.max(terrainHeight(mid2.x, mid2.z) + 0.1, -0.25);
  mid1.z += 0.25; mid2.z -= 0.2;
  const curve = new THREE.CatmullRomCurve3([bank, mid1, mid2, tip]);
  const main = buildTube(curve, (s, a) => lerp(0.14, 0.05, s) * (1 + 0.06 * Math.sin(a * 3 + s * 20)), 14, 40, 2, 0.8);
  const parts = [main];
  for (let i = 0; i < 4; i++) {
    const s = r.range(0.2, 0.85);
    const p0 = curve.getPointAt(s), t = curve.getTangentAt(s);
    const side = new THREE.Vector3(-t.z, r.range(0.2, 0.9), t.x).normalize().multiplyScalar(r.sign());
    const p1 = p0.clone().addScaledVector(side, r.range(0.4, 1.1)).addScaledVector(t, 0.3);
    const c2 = new THREE.CatmullRomCurve3([p0, p0.clone().lerp(p1, 0.5).add(new THREE.Vector3(0, 0.05, 0)), p1]);
    parts.push(buildTube(c2, (q) => lerp(0.035, 0.008, q), 7, 8, 1, 0.8));
  }
  // twigs on the pond bed
  for (let i = 0; i < 16; i++) {
    const a = r.range(0, Math.PI * 2), k = r.range(0.15, 0.85), Rr = pondRadius(a) * k;
    const x = Math.cos(a) * Rr, z = Math.sin(a) * Rr;
    const ang = r.range(0, Math.PI * 2), L = r.range(0.25, 0.8);
    const p0 = new THREE.Vector3(x, 0, z), p1 = new THREE.Vector3(x + Math.cos(ang) * L, 0, z + Math.sin(ang) * L);
    const pm = p0.clone().lerp(p1, 0.5).add(new THREE.Vector3(r.range(-0.08, 0.08), 0, r.range(-0.08, 0.08)));
    for (const p of [p0, pm, p1]) p.y = terrainHeight(p.x, p.z) + 0.012;
    const rad = r.range(0.008, 0.02);
    parts.push(buildTube(new THREE.CatmullRomCurve3([p0, pm, p1]), (q) => rad * (1 - q * 0.5), 5, 6, 1, 0.8));
  }
  const geo = mergeGeometries(parts);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  group.add(mesh);
  // fish avoid the submerged part of the branch
  for (let s = 0.35; s <= 1.0; s += 0.13) { const p = curve.getPointAt(s); rockObstacles.push({ x: p.x, y: p.y, z: p.z, r: 0.35 }); }
  reflectLayers(group, true, true);
  scene.add(group);
}

// ==== TREES & CANOPY =========================================================
const SPECIES = {
  // 40 hero trees (spec: 25–40 around the pond) with big, dense crowns so the canopy
  // closes to ~15 % direct sun on the ground; the far forest is impostors
  beech: { bark: 0, atlas: 'beech', height: [20, 26], radius: [0.3, 0.46], branchStart: [0.32, 0.42], branches: [14, 18],
    angle: [0.62, 1.12], lenF: [0.62, 0.92], crown: [7.0, 9.2], upCurve: 0.2, droop: 0.06, leaves: [1250, 1500],
    leafSize: [1.5, 2.1], flare: 0.45, lobes: 5, crooked: 0.08 },
  oak: { bark: 1, atlas: 'oak', height: [17, 23], radius: [0.4, 0.58], branchStart: [0.25, 0.36], branches: [11, 14],
    angle: [0.9, 1.35], lenF: [0.68, 0.98], crown: [7.8, 10.0], upCurve: 0.1, droop: 0.1, leaves: [1300, 1600],
    leafSize: [1.55, 2.15], flare: 0.6, lobes: 6, crooked: 0.22 },
  alder: { bark: 2, atlas: 'alder', height: [14, 18], radius: [0.2, 0.3], branchStart: [0.28, 0.4], branches: [12, 15],
    angle: [0.6, 0.95], lenF: [0.55, 0.82], crown: [5.4, 7.0], upCurve: 0.28, droop: 0.05, leaves: [820, 1000],
    leafSize: [1.25, 1.7], flare: 0.3, lobes: 4, crooked: 0.1 },
};
const SPECIES_KEYS = ['beech', 'oak', 'alder'];
const FOLIAGE_DENSITY = 1.0;
const trees = [];          // placed hero trees
const leafCards = { beech: [], oak: [], alder: [] };   // all foliage instances per atlas

function placeTrees() {
  const r = makeRng(99);
  const add = (sp, x, z, forced = false) => {
    const nearWater = pondS(x, z) < 1.75;
    trees.push({ sp, x, z, seed: r.int(1, 1e7), nearWater, forced });
  };
  // hand-placed: trees whose roots snake through the opening shot, and one leaning over the water
  add('oak', 4.9, 16.4, true);
  add('beech', -1.9, 17.4, true);
  add('alder', -8.9, 5.2, true);
  // sun-side sector: these crowns throw their shade across the pond, so the forest is
  // densest there (the canopy target is ~15 % direct sun on the ground)
  const sh = new THREE.Vector2(U.uSunDir.value.x, U.uSunDir.value.z).normalize();
  let tries = 0;
  // shore ring: trees leaning out over the water
  while (trees.filter((t) => t.nearWater).length < 13 && tries++ < 4000) {
    const th = r.range(0, Math.PI * 2);
    const d = pondRadius(th) * r.range(1.2, 1.55) + 0.9;
    const x = Math.cos(th) * d, z = Math.sin(th) * d;
    if (trees.some((t) => Math.hypot(t.x - x, t.z - z) < 4.2)) continue;
    if (isNearCameraPath(x, z, 2.3)) continue;
    add(r.next() < 0.55 ? 'alder' : 'beech', x, z);
  }
  tries = 0;
  while (trees.length < 40 && tries++ < 30000) {
    const th = r.range(0, Math.PI * 2);
    const minD = pondRadius(th) * 1.22 + 1.3;
    const d = minD + Math.pow(r.next(), 0.9) * (48 - minD);
    const x = Math.cos(th) * d, z = Math.sin(th) * d;
    const sunSide = (Math.cos(th) * sh.x + Math.sin(th) * sh.y) > 0.15;
    if (!sunSide && r.next() < 0.45) continue;
    if (trees.some((t) => Math.hypot(t.x - x, t.z - z) < (sunSide ? 5.2 : 6.4))) continue;
    if (isNearCameraPath(x, z, 2.4)) continue;
    const sp = (pondS(x, z) < 1.7 && r.next() < 0.5) ? 'alder' : (r.next() < 0.6 ? 'beech' : 'oak');
    add(sp, x, z);
  }
  for (const t of trees) mounds.push({ x: t.x, z: t.z, r: 1.3, h: 0.14 });
}

const _v = new THREE.Vector3();
function randVec(r, s) { return new THREE.Vector3(r.range(-1, 1), r.range(-1, 1), r.range(-1, 1)).multiplyScalar(s); }

function makeLeafCard(pos, tangent, r, sizeRange, treeBase, treeH, pondDir) {
  const up = new THREE.Vector3(0, 1, 0);
  const Y = tangent.clone().multiplyScalar(0.55).add(randVec(r, 0.75)).addScaledVector(up, 0.35);
  if (pondDir) Y.addScaledVector(pondDir, 0.15);
  Y.normalize();
  let Zc = randVec(r, 1).addScaledVector(up, 0.6).normalize();
  const X = new THREE.Vector3().crossVectors(Y, Zc).normalize();
  if (X.lengthSq() < 1e-4) X.set(1, 0, 0);
  const Z = new THREE.Vector3().crossVectors(X, Y).normalize();
  const s = r.range(sizeRange[0], sizeRange[1]);
  const m = new THREE.Matrix4().makeBasis(X.multiplyScalar(s * 0.9), Y.multiplyScalar(s), Z.multiplyScalar(s));
  m.setPosition(pos.x - Y.x * 0.08, pos.y - Y.y * 0.08, pos.z - Y.z * 0.08);
  return { m, base: treeBase, h: treeH, atlas: r.int(0, 3), tint: r.next(), crown: null };
}

function growTree(t) {
  const S = SPECIES[t.sp];
  const r = makeRng(t.seed);
  const H = r.range(S.height[0], S.height[1]) * (t.forced ? 1.05 : 1);
  const R0 = r.range(S.radius[0], S.radius[1]) * (t.forced ? 1.15 : 1);
  t.R0 = R0;
  const gy = terrainHeight(t.x, t.z);
  const base = new THREE.Vector3(t.x, gy, t.z);
  const toPond = new THREE.Vector3(-t.x, 0, -t.z).normalize();
  const leanAmt = t.nearWater ? r.range(0.04, 0.11) : r.range(0.0, 0.035);
  const leanDir = t.nearWater ? toPond.clone() : new THREE.Vector3(r.gauss(), 0, r.gauss()).normalize();
  const pts = [];
  const nT = 8;
  for (let i = 0; i <= nT; i++) {
    const f = i / nT, y = -0.6 + f * (H + 0.6);
    const wob = S.crooked * 0.35 * Math.min(1, f * 3);
    pts.push(new THREE.Vector3(
      base.x + leanDir.x * leanAmt * Math.max(0, y) + Noise.n2(t.seed * 0.01 + f * 2.1, 1.3) * wob,
      base.y + y,
      base.z + leanDir.z * leanAmt * Math.max(0, y) + Noise.n2(t.seed * 0.01 + f * 2.1, 7.7) * wob));
  }
  const trunk = new THREE.CatmullRomCurve3(pts);
  const trunkLen = trunk.getLength();
  const flarePhase = r.range(0, 6.28);
  const trunkRadius = (s, th) => {
    const hA = Math.max(0, s * trunkLen - 0.6);
    const taper = lerp(R0, R0 * 0.16, Math.pow(s, 0.8));
    const lobes = 0.55 + 0.45 * Math.cos(S.lobes * th + flarePhase + Noise.n2(th * 2, t.seed * 0.001) * 0.8);
    const flare = 1 + S.flare * Math.exp(-hA / 0.42) * lobes * 1.4 + 0.3 * Math.exp(-hA / 1.3);
    return taper * flare * (1 + 0.025 * Math.sin(th * 7 + s * 40));
  };
  const branches = [];
  const leaves = [];
  const treeBase = base.clone();
  const nB = r.int(S.branches[0], S.branches[1]);
  const bs = r.range(S.branchStart[0], S.branchStart[1]);
  const crownR = r.range(S.crown[0], S.crown[1]);
  const lvl2 = [];
  for (let i = 0; i < nB; i++) {
    const f = bs + (0.94 - bs) * (i + r.range(0, 0.8)) / nB;
    const az = i * 2.39996 + r.range(-0.35, 0.35) + t.seed;
    const dirH = new THREE.Vector3(Math.cos(az), 0, Math.sin(az));
    const bias = (t.nearWater ? 0.6 : 0.18) * Math.max(0, dirH.dot(toPond) + 0.35);
    dirH.lerp(toPond, bias).normalize();
    const relH = (f - bs) / (1 - bs);
    const el = lerp(S.angle[1], S.angle[0], relH) * r.range(0.85, 1.1);
    const dir = dirH.clone().multiplyScalar(Math.sin(el)).add(new THREE.Vector3(0, Math.cos(el), 0));
    let L = crownR * r.range(S.lenF[0], S.lenF[1]) * (1.08 - 0.6 * relH * relH);
    if (t.nearWater) L *= 1 + 0.5 * Math.max(0, dirH.dot(toPond));
    const p0 = trunk.getPointAt(f);
    const rad0 = trunkRadius(f, 0) * r.range(0.42, 0.6);
    const p1 = p0.clone().addScaledVector(dir, L * 0.45).add(randVec(r, L * 0.06)); p1.y += L * (S.upCurve * 0.1 - S.droop * 0.25);
    const p2 = p0.clone().addScaledVector(dir, L).add(randVec(r, L * 0.1)); p2.y += L * (S.upCurve - S.droop);
    const curve = new THREE.CatmullRomCurve3([p0, p1, p2]);
    branches.push({ curve, r0: rad0, r1: Math.max(0.012, rad0 * 0.18), level: 1 });
    const n2 = r.int(3, 6);
    for (let k = 0; k < n2; k++) {
      const s = r.range(0.28, 0.92);
      const q0 = curve.getPointAt(s), tan = curve.getTangentAt(s);
      const side = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0, 1, 0));
      if (side.lengthSq() < 1e-4) side.set(1, 0, 0);
      side.normalize().multiplyScalar(r.sign());
      const d2 = tan.clone().multiplyScalar(0.55).addScaledVector(side, r.range(0.5, 0.95)).add(new THREE.Vector3(0, r.range(0.1, 0.55), 0)).normalize();
      const L2 = L * r.range(0.34, 0.55) * (1 - s * 0.35);
      const q1 = q0.clone().addScaledVector(d2, L2 * 0.5).add(randVec(r, L2 * 0.08));
      const q2 = q0.clone().addScaledVector(d2, L2).add(randVec(r, L2 * 0.12)); q2.y += L2 * 0.08;
      const c2 = new THREE.CatmullRomCurve3([q0, q1, q2]);
      const rr = lerp(rad0, rad0 * 0.2, s) * 0.55;
      branches.push({ curve: c2, r0: Math.max(0.01, rr), r1: Math.max(0.006, rr * 0.22), level: 2 });
      lvl2.push(c2);
      const nl = Math.max(2, Math.round(L2 / 0.3));
      for (let m = 0; m < nl; m++) {
        const u = 0.22 + 0.78 * (m + r.next()) / nl;
        leaves.push(makeLeafCard(c2.getPointAt(u), c2.getTangentAt(u), r, S.leafSize, treeBase, H, t.nearWater ? toPond : null));
      }
    }
    for (let m = 0; m < 4; m++) { const u = r.range(0.55, 1); leaves.push(makeLeafCard(curve.getPointAt(u), curve.getTangentAt(u), r, S.leafSize, treeBase, H, t.nearWater ? toPond : null)); }
  }
  // crown top
  const top = trunk.getPointAt(1);
  for (let m = 0; m < 14; m++) leaves.push(makeLeafCard(top.clone().add(randVec(r, 1.2)), new THREE.Vector3(0, 1, 0), r, S.leafSize, treeBase, H, null));
  // fill the crown volume around the secondary branches up to the species' card budget
  const target = Math.round(r.int(S.leaves[0], S.leaves[1]) * FOLIAGE_DENSITY * (t.forced ? 1.1 : 1));
  let guard = 0;
  while (leaves.length < target && guard++ < 5000 && lvl2.length) {
    const c = lvl2[r.int(0, lvl2.length - 1)];
    const u = r.range(0.2, 1.0);
    const p = c.getPointAt(u).add(randVec(r, 1.4));
    leaves.push(makeLeafCard(p, c.getTangentAt(u), r, S.leafSize, treeBase, H, t.nearWater ? toPond : null));
  }
  // crown normals (spherical-ish normals give the canopy volume)
  const cc = new THREE.Vector3();
  for (const l of leaves) cc.add(_v.setFromMatrixPosition(l.m));
  cc.divideScalar(leaves.length);
  cc.y -= crownR * 0.35;
  for (const l of leaves) l.crown = _v.setFromMatrixPosition(l.m).sub(cc).normalize().toArray();
  return { t, S, H, R0, base, trunk, trunkRadius, branches, leaves, crownR, crownCenter: cc };
}

function treeWoodGeometry(tree, lod) {
  const parts = [];
  const attr = { name: 'aTree', size: 4, value: [tree.base.x, tree.base.y, tree.base.z, tree.H] };
  const circ = 2 * Math.PI * tree.R0;
  const uRep = Math.max(1, Math.round(circ / 0.9));
  const tr = lod === 0 ? [22, 48] : lod === 1 ? [10, 12] : [6, 5];
  parts.push(buildTube(tree.trunk, tree.trunkRadius, tr[0], tr[1], uRep, 1 / 1.2, attr));
  for (const b of tree.branches) {
    if (lod === 2 && b.level === 2) continue;
    const seg = b.level === 1 ? (lod === 0 ? [8, 10] : lod === 1 ? [5, 5] : [3, 3]) : (lod === 0 ? [5, 6] : [3, 3]);
    const r0 = b.r0, r1 = b.r1;
    const rep = Math.max(1, Math.round(2 * Math.PI * r0 / 0.9));
    parts.push(buildTube(b.curve, (s) => lerp(r0, r1, Math.pow(s, 0.9)), seg[0], seg[1], rep, 1 / 1.2, attr));
  }
  const g = mergeGeometries(parts);
  g.computeBoundingSphere();
  return g;
}

function leafCardGeometry() {
  const g = new THREE.PlaneGeometry(1, 1, 1, 2);
  g.translate(0, 0.5, 0);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, y * y * 0.16 - Math.abs(x) * 0.08 * Math.sin(Math.PI * y));
  }
  g.computeVertexNormals();
  return g;
}

const treeObjects = [];
const foliageMeshes = [];
function buildTrees() {
  for (const sp of [0, 1, 2]) {
    BARK[sp] = { near: makeBarkMaterial(sp, 'near'), far: makeBarkMaterial(sp, 'far') };
  }
  const barkDepth = {};
  for (const sp of [0, 1, 2]) {
    barkDepth[sp] = {
      near: makeShadowDepthMaterial({ key: `bark${sp}-shn`, wind: 'tree' }, BARK[sp].near),
      far: makeShadowDepthMaterial({ key: `bark${sp}-shf`, wind: 'tree' }, BARK[sp].far),
    };
  }
  const grown = [];
  for (const t of trees) {
    const tree = growTree(t);
    grown.push(tree);
    const lod = new THREE.LOD();
    lod.name = 'tree-' + t.sp;
    for (let level = 0; level < 3; level++) {
      const geo = treeWoodGeometry(tree, level);
      geo.translate(-tree.base.x, -tree.base.y, -tree.base.z);   // LOD distance is measured to the tree base
      const mesh = new THREE.Mesh(geo, level === 0 ? BARK[tree.S.bark].near : BARK[tree.S.bark].far);
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.customDepthMaterial = level === 0 ? barkDepth[tree.S.bark].near : barkDepth[tree.S.bark].far;
      lod.addLevel(mesh, [0, 24, 60][level]);
    }
    lod.position.copy(tree.base);
    reflectLayers(lod, true, false);
    scene.add(lod);
    treeObjects.push(lod);
    for (const l of tree.leaves) leafCards[tree.S.atlas].push(l);
  }
  return grown;
}

// Instanced foliage: one InstancedMesh per leaf atlas with per-instance tint, atlas cell,
// tree anchor (wind) and crown normal. Alpha-tested, double-sided, back-lit translucency.
function buildFoliage() {
  const tints = {   // per-instance tint between yellow-green and deep green
    beech: [new THREE.Color(0.78, 0.86, 0.46), new THREE.Color(0.40, 0.56, 0.30)],
    oak: [new THREE.Color(0.70, 0.80, 0.42), new THREE.Color(0.34, 0.48, 0.26)],
    alder: [new THREE.Color(0.66, 0.78, 0.42), new THREE.Color(0.32, 0.46, 0.26)],
  };
  for (const sp of SPECIES_KEYS) {
    const cards = leafCards[sp];
    if (!cards.length) continue;
    const geo = leafCardGeometry();
    const n = cards.length;
    const aTree = new Float32Array(n * 4), aAtlas = new Float32Array(n * 2), aCrown = new Float32Array(n * 3);
    const mat = new THREE.MeshStandardMaterial({ map: ATLAS[sp], alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.62, metalness: 0 });
    const o = { key: 'leaf-' + sp, wind: 'leaf', translucent: true, foliage: true, atlas: 0.5, alphaBoost: true };
    patchWorldMaterial(mat, o);
    const mesh = new THREE.InstancedMesh(geo, mat, n);
    const c = new THREE.Color();
    cards.forEach((l, i) => {
      mesh.setMatrixAt(i, l.m);
      c.copy(tints[sp][0]).lerp(tints[sp][1], l.tint);
      mesh.setColorAt(i, c);
      aTree.set([l.base.x, l.base.y, l.base.z, l.h], i * 4);
      aAtlas.set([(l.atlas % 2) * 0.5, Math.floor(l.atlas / 2) * 0.5], i * 2);
      aCrown.set(l.crown || [0, 1, 0], i * 3);
    });
    geo.setAttribute('aTree', new THREE.InstancedBufferAttribute(aTree, 4));
    geo.setAttribute('aAtlas', new THREE.InstancedBufferAttribute(aAtlas, 2));
    geo.setAttribute('aCrownN', new THREE.InstancedBufferAttribute(aCrown, 3));
    mesh.instanceMatrix.needsUpdate = true;
    mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.customDepthMaterial = makeShadowDepthMaterial(o, mat);
    mesh.computeBoundingSphere();
    mesh.name = 'foliage-' + sp;
    reflectLayers(mesh, true, false);
    scene.add(mesh);
    foliageMeshes.push(mesh);
  }
}

// ==== FAR FOREST IMPOSTORS ===================================================
// Representative trees are rendered once into an atlas; the far ring (42–90 m) is drawn
// as instanced cylindrical billboards (the third LOD tier) that never cast shadows.
let impostorMesh = null;
function buildImpostors(grown) {
  const reps = [];
  for (const sp of SPECIES_KEYS) {
    const list = grown.filter((g) => g.t.sp === sp && !g.t.forced);
    if (list.length) reps.push(list[0]);
    if (list.length > 2) reps.push(list[2]);
  }
  const cols = reps.length;
  const cellW = 256, cellH = 512;
  const rt = new THREE.WebGLRenderTarget(cellW * cols, cellH, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
  const iscene = new THREE.Scene();
  const key = new THREE.DirectionalLight(0xffe8c8, 3.0); key.position.set(-0.4, 0.8, 0.6);
  const fill = new THREE.HemisphereLight(0x9ab8d0, 0x2b3a1e, 0.8);
  iscene.add(key, fill);
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
  const prevFog = U.uAirFogDensity.value;
  U.uAirFogDensity.value = 0;
  renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(rt);
  renderer.clear();
  const ratios = [];
  reps.forEach((tree, i) => {
    const g = new THREE.Group();
    const wood = new THREE.Mesh(treeWoodGeometry(tree, 1), BARK[tree.S.bark].far);
    g.add(wood);
    const geo = leafCardGeometry();
    const mat = foliageMeshes.find((m) => m.name === 'foliage-' + tree.S.atlas).material;
    const im = new THREE.InstancedMesh(geo, mat, tree.leaves.length);
    const aTree = new Float32Array(tree.leaves.length * 4), aAtlas = new Float32Array(tree.leaves.length * 2), aCrown = new Float32Array(tree.leaves.length * 3);
    const col = new THREE.Color();
    tree.leaves.forEach((l, j) => {
      im.setMatrixAt(j, l.m); im.setColorAt(j, col.setRGB(0.45, 0.68, 0.26).lerp(new THREE.Color(0.3, 0.52, 0.18), l.tint));
      aTree.set([l.base.x, l.base.y, l.base.z, 1e4], j * 4);
      aAtlas.set([(l.atlas % 2) * 0.5, Math.floor(l.atlas / 2) * 0.5], j * 2);
      aCrown.set(l.crown, j * 3);
    });
    geo.setAttribute('aTree', new THREE.InstancedBufferAttribute(aTree, 4));
    geo.setAttribute('aAtlas', new THREE.InstancedBufferAttribute(aAtlas, 2));
    geo.setAttribute('aCrownN', new THREE.InstancedBufferAttribute(aCrown, 3));
    g.add(im);
    iscene.add(g);
    const box = new THREE.Box3().setFromObject(g);
    const w = Math.max(box.max.x - box.min.x, box.max.z - box.min.z) * 0.5;
    const hgt = box.max.y - tree.base.y;
    ratios.push((2 * w) / hgt);
    cam.left = -w; cam.right = w; cam.top = hgt; cam.bottom = 0;
    cam.position.set(tree.base.x, tree.base.y, tree.base.z + 60);
    cam.lookAt(tree.base.x, tree.base.y, tree.base.z);
    cam.updateProjectionMatrix();
    rt.viewport.set(i * cellW, 0, cellW, cellH);
    rt.scissor.set(i * cellW, 0, cellW, cellH);
    rt.scissorTest = true;
    renderer.setRenderTarget(rt);
    renderer.render(iscene, cam);
    iscene.remove(g);
    wood.geometry.dispose(); geo.dispose();
  });
  rt.viewport.set(0, 0, cellW * cols, cellH);
  rt.scissor.set(0, 0, cellW * cols, cellH);
  rt.scissorTest = false;
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, 1);
  U.uAirFogDensity.value = prevFog;

  // far ring placement
  const r = makeRng(555);
  const count = PARAMS.test ? 160 : 320;
  const aPos = new Float32Array(count * 4), aVar = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    const th = r.range(0, Math.PI * 2), d = r.range(46, 104);
    const x = Math.cos(th) * d, z = Math.sin(th) * d, v = r.int(0, cols - 1);
    aPos.set([x, terrainHeight(x, z) - 0.3, z, r.range(14, 22)], i * 4);
    aVar.set([v, ratios[v], r.range(0.75, 1.1), r.next()], i * 4);
  }
  const quad = new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0);
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index; geo.attributes.position = quad.attributes.position; geo.attributes.uv = quad.attributes.uv;
  geo.setAttribute('aPosScale', new THREE.InstancedBufferAttribute(aPos, 4));
  geo.setAttribute('aVariant', new THREE.InstancedBufferAttribute(aVar, 4));
  geo.instanceCount = count;
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      tAtlas: { value: rt.texture }, uCols: { value: cols },
      uTime: U.uTime, uWaterLevel: U.uWaterLevel, uSunDir: U.uSunDir, uSunColor: U.uSunColor, uFogMode: U.uFogMode,
      uAirFogColor: U.uAirFogColor, uAirFogDensity: U.uAirFogDensity, uWaterFogColor: U.uWaterFogColor, uWaterFogDensity: U.uWaterFogDensity,
      uWind: U.uWind,
    },
    vertexShader: /* glsl */`
      attribute vec4 aPosScale; attribute vec4 aVariant;
      uniform float uCols; uniform float uTime; uniform vec4 uWind;
      varying vec2 vUv; varying vec3 vWorldPos; varying float vShade;
      void main() {
        vec3 base = aPosScale.xyz; float H = aPosScale.w; float W = H * aVariant.y;
        vec3 toCam = cameraPosition - base; toCam.y = 0.0; toCam = normalize(toCam);
        vec3 right = vec3(toCam.z, 0.0, -toCam.x);
        vec3 wp = base + right * position.x * W + vec3(0.0, position.y * H, 0.0);
        wp.xz += uWind.xy * sin(uTime * 0.6 + base.x) * 0.15 * position.y * position.y * uWind.z;
        vWorldPos = wp;
        vUv = vec2((uv.x + aVariant.x) / uCols, uv.y);
        vShade = aVariant.z;
        gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tAtlas; uniform float uWaterLevel; uniform vec3 uSunDir; uniform vec3 uSunColor;
      varying vec2 vUv; varying vec3 vWorldPos; varying float vShade;
      ${GLSL_FOG}
      void main() {
        vec4 c = texture2D(tAtlas, vUv);
        if (c.a < 0.5) discard;
        vec3 col = c.rgb / max(c.a, 1e-3) * 0.16 * vShade;
        gl_FragColor = vec4(applyWorldFog(col, vWorldPos), 1.0);
      }`,
  });
  impostorMesh = new THREE.Mesh(geo, mat);
  impostorMesh.frustumCulled = false;
  impostorMesh.name = 'impostors';
  reflectLayers(impostorMesh, true, false);
  scene.add(impostorMesh);
  buildBackdrop();
}

// Forest wall far beyond the impostors: the horizon never shows raw sky, only haze,
// trunks and an irregular tree line.
function buildBackdrop() {
  const geo = new THREE.CylinderGeometry(122, 122, 90, 128, 1, true).translate(0, 38, 0);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uAirFogColor: U.uAirFogColor, uSunDir: U.uSunDir, uSunColor: U.uSunColor },
    vertexShader: 'varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: GLSL_NOISE + /* glsl */`
      uniform vec3 uAirFogColor, uSunDir, uSunColor;
      varying vec3 vW;
      void main() {
        float a = atan(vW.z, vW.x);
        // rounded crowns, not spikes: smooth low/mid frequencies only
        float top = 34.0 + 11.0 * fbm2(vec2(a * 12.0, 1.3)) + 3.0 * smoothstep(0.0, 1.0, vnoise(vec2(a * 45.0, 2.0)));
        if (vW.y > top) discard;
        float trunks = smoothstep(0.6, 0.66, vnoise(vec2(a * 300.0, 0.5))) * (1.0 - smoothstep(top - 20.0, top - 10.0, vW.y));
        vec3 col = uAirFogColor * (0.8 + 0.4 * fbm2(vec2(a * 45.0, vW.y * 0.12))) * mix(1.0, 0.55, trunks);
        vec2 hd = normalize(vW.xz), sd = normalize(uSunDir.xz);
        col += uSunColor * 0.0035 * pow(max(dot(hd, sd), 0.0), 4.0) * smoothstep(top - 25.0, top, vW.y);
        gl_FragColor = vec4(col * smoothstep(top + 0.5, top - 3.0, vW.y + 0.0) + uAirFogColor * 0.0, 1.0);
      }`,
    side: THREE.BackSide,
  });
  const m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.name = 'forest-wall';
  reflectLayers(m, true, false);
  scene.add(m);
}

// ==== UNDERSTORY: bushes, ferns, grass, leaf litter, exposed roots ===========
function nearTrunk(x, z, r) { return trees.some((t) => Math.hypot(t.x - x, t.z - z) < r); }
function nearRock(x, z, pad = 0) { return rockObstacles.some((o) => Math.hypot(o.x - x, o.z - z) < o.r + pad); }

// Low bushes / saplings: extra leaf cards added to the foliage instancing (same material,
// so they glow when back-lit — the bright green edges of the reference photo).
function addBushes() {
  const r = makeRng(1234);
  const centers = [];
  const tryAdd = (x, z, size) => {
    if (pondS(x, z) < 1.1) return false;
    if (isNearCameraPath(x, z, 1.35 + size * 0.4, 2.2)) return false;
    if (nearTrunk(x, z, 1.1) || nearRock(x, z, 0.3)) return false;
    if (centers.some((c) => Math.hypot(c.x - x, c.z - z) < 1.4)) return false;
    centers.push({ x, z, size });
    return true;
  };
  // framing bushes around the opening dolly
  for (let i = 0, n = 0; i < 400 && n < 7; i++) {
    const x = r.range(-2.5, 6.0), z = r.range(9.5, 15.5);
    if (tryAdd(x, z, r.range(0.8, 1.3))) n++;
  }
  for (let i = 0; i < 900 && centers.length < 78; i++) {
    const th = r.range(0, Math.PI * 2), d = pondRadius(th) * r.range(1.12, 3.0);
    tryAdd(Math.cos(th) * d, Math.sin(th) * d, r.range(0.55, 1.2));
  }
  for (const c of centers) {
    const gy = terrainHeight(c.x, c.z);
    const base = new THREE.Vector3(c.x, gy, c.z);
    const center = new THREE.Vector3(c.x, gy + 0.45 * c.size + 0.15, c.z);
    const sp = r.pick(['beech', 'beech', 'alder', 'oak']);
    const n = Math.round(r.range(14, 26) * c.size);
    for (let i = 0; i < n; i++) {
      const off = new THREE.Vector3(r.range(-1, 1), r.range(-0.6, 1), r.range(-1, 1)).multiply(new THREE.Vector3(0.55, 0.45, 0.55)).multiplyScalar(c.size);
      const p = center.clone().add(off);
      p.y = Math.max(p.y, gy + 0.08);
      const out = off.clone().normalize();
      const card = makeLeafCard(p, out, r, [0.45, 0.78], base, 2.2, null);
      card.crown = out.clone().add(new THREE.Vector3(0, 0.4, 0)).normalize().toArray();
      leafCards[sp].push(card);
    }
  }
}

function fernGeometry(r) {
  const parts = [];
  const fronds = r.int(10, 14);
  for (let i = 0; i < fronds; i++) {
    const az = (i / fronds) * Math.PI * 2 + r.range(-0.25, 0.25);
    const len = r.range(0.5, 0.85);
    const rise = r.range(0.55, 1.05);
    const segs = 8, w = len * 0.34;
    const dir = new THREE.Vector3(Math.cos(az), 0, Math.sin(az));
    const side = new THREE.Vector3(-dir.z, 0, dir.x);
    const tilt = r.range(-0.35, 0.35);
    const pos = [], uv = [], idx = [];
    let p = new THREE.Vector3(0, 0.02, 0);
    for (let k = 0; k <= segs; k++) {
      const t = k / segs;
      const a = rise - t * (rise + 0.55);   // arcs up, then droops
      const sd = side.clone().multiplyScalar(Math.cos(tilt)).add(new THREE.Vector3(0, Math.sin(tilt), 0)).multiplyScalar(w * 0.5);
      pos.push(p.x - sd.x, p.y - sd.y, p.z - sd.z, p.x + sd.x, p.y + sd.y, p.z + sd.z);
      uv.push(0, t, 1, t);
      const step = len / segs;
      p = p.clone().addScaledVector(dir, Math.cos(a) * step).add(new THREE.Vector3(0, Math.sin(a) * step, 0));
    }
    for (let k = 0; k < segs; k++) { const a = k * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    parts.push(g);
  }
  const g = mergeGeometries(parts);
  // bias normals upward: reads as a soft volume instead of flat strips
  const n = g.attributes.normal;
  for (let i = 0; i < n.count; i++) { _v.fromBufferAttribute(n, i); if (_v.y < 0) _v.negate(); _v.y += 0.8; _v.normalize(); n.setXYZ(i, _v.x, _v.y, _v.z); }
  return g;
}

function grassGeometry() {
  const parts = [];
  for (let i = 0; i < 3; i++) {
    const g = new THREE.PlaneGeometry(0.55, 0.5, 1, 2).translate(0, 0.25, 0);
    g.rotateY((i / 3) * Math.PI + 0.3);
    parts.push(g);
  }
  const g = mergeGeometries(parts);
  const n = g.attributes.normal;
  for (let i = 0; i < n.count; i++) { _v.fromBufferAttribute(n, i).multiplyScalar(0.3); _v.y += 1; _v.normalize(); n.setXYZ(i, _v.x, _v.y, _v.z); }
  return g;
}

function scatterInstanced(geo, mat, depthOpts, count, sampler, name, shadow = true) {
  const mesh = new THREE.InstancedMesh(geo, mat, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  const c = new THREE.Color();
  let n = 0;
  for (let i = 0; i < count * 30 && n < count; i++) {
    const res = sampler(p, q, s, c);
    if (!res) continue;
    m.compose(p, q, s);
    mesh.setMatrixAt(n, m);
    mesh.setColorAt(n, c);
    n++;
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = shadow; mesh.receiveShadow = true;
  if (depthOpts) mesh.customDepthMaterial = makeShadowDepthMaterial(depthOpts, mat);
  mesh.computeBoundingSphere();
  mesh.name = name;
  scene.add(mesh);
  return mesh;
}

const _up = new THREE.Vector3(0, 1, 0);
function alignToGround(x, z, yaw, q) {
  const nrm = terrainNormal(x, z);
  const qa = new THREE.Quaternion().setFromUnitVectors(_up, nrm);
  const qy = new THREE.Quaternion().setFromAxisAngle(_up, yaw);
  return q.copy(qa).multiply(qy);
}

function buildFerns() {
  const r = makeRng(808);
  const geo = fernGeometry(r);
  const mat = new THREE.MeshStandardMaterial({ map: ATLAS.fern, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.68 });
  const o = { key: 'fern', wind: 'plant', translucent: true, alphaBoost: true,
    defines: { PLANT_HEIGHT: '0.6', PLANT_SWAY: '0.10', TRANSLUCENCY_BACK: '0.8', TRANSLUCENCY_WRAP: '0.2' } };
  patchWorldMaterial(mat, o);
  const mesh = scatterInstanced(geo, mat, o, PARAMS.test ? 80 : 170, (p, q, s, c) => {
    const th = r.range(0, Math.PI * 2), d = pondRadius(th) * r.range(1.12, 3.6);
    const x = Math.cos(th) * d, z = Math.sin(th) * d;
    if (isNearCameraPath(x, z, 1.0, 1.4) || nearTrunk(x, z, 0.6) || nearRock(x, z, 0.1)) return false;
    const y = terrainHeight(x, z);
    if (y < 0.06) return false;
    p.set(x, y - 0.02, z);
    q.setFromAxisAngle(_up, r.range(0, 6.28));
    s.setScalar(r.range(0.6, 1.35));
    c.setRGB(0.75, 0.85, 0.7).lerp(new THREE.Color(1, 1, 0.85), r.next());
    return true;
  }, 'ferns');
  reflectLayers(mesh, true, false);
}

function buildGrass() {
  const r = makeRng(909);
  const geo = grassGeometry();
  const mat = new THREE.MeshStandardMaterial({ map: ATLAS.grass, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.75 });
  const o = { key: 'grass', wind: 'plant', translucent: true, alphaBoost: true,
    defines: { PLANT_HEIGHT: '0.5', PLANT_SWAY: '0.08', TRANSLUCENCY_BACK: '0.7', TRANSLUCENCY_WRAP: '0.2' } };
  patchWorldMaterial(mat, o);
  const mesh = scatterInstanced(geo, mat, o, PARAMS.test ? 250 : 700, (p, q, s, c) => {
    const th = r.range(0, Math.PI * 2);
    const band = r.next() < 0.75;
    const d = pondRadius(th) * (band ? r.range(1.0, 1.45) : r.range(1.4, 3.2));
    const x = Math.cos(th) * d, z = Math.sin(th) * d;
    const y = terrainHeight(x, z);
    if (y < 0.015) return false;
    if (isNearCameraPath(x, z, 0.55, 0.9) || nearTrunk(x, z, 0.5) || nearRock(x, z, 0.0)) return false;
    p.set(x, y - 0.03, z);
    alignToGround(x, z, r.range(0, 6.28), q);
    s.setScalar(r.range(0.55, 1.2)).multiply(new THREE.Vector3(1, r.range(0.8, 1.4), 1));
    c.setRGB(0.7, 0.8, 0.6).lerp(new THREE.Color(1.0, 1.0, 0.8), r.next());
    return true;
  }, 'grass');
  reflectLayers(mesh, true, false);
}

function buildLitter() {
  const r = makeRng(1010);
  const geo = new THREE.PlaneGeometry(1, 1, 2, 2).rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), z = pos.getZ(i); pos.setY(i, (x * x + z * z) * 0.12); }
  geo.computeVertexNormals();
  const n = PARAMS.test ? 5000 : 16000;
  const aAtlas = new Float32Array(n * 2);
  const mat = new THREE.MeshStandardMaterial({ map: ATLAS.litter, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.85 });
  const o = { key: 'litter', atlas: 0.25, alphaBoost: true, wet: { band: 0.1, darken: 0.5, rough: 0.3 } };
  patchWorldMaterial(mat, o);
  let k = 0;
  const mesh = scatterInstanced(geo, mat, null, n, (p, q, s, c) => {
    // denser in the foreground of the opening shot and within ~25 m of the pond
    let x, z;
    if (r.next() < 0.22) { x = r.range(-4, 7.5); z = r.range(7.5, 18); }
    else { const th = r.range(0, Math.PI * 2), d = pondRadius(th) * 1.02 + Math.pow(r.next(), 1.4) * 24; x = Math.cos(th) * d; z = Math.sin(th) * d; }
    const y = terrainHeight(x, z);
    if (y < 0.03 || nearTrunk(x, z, 0.35) || nearRock(x, z, -0.1)) return false;
    const cx = r.int(0, 3), cy = r.int(0, 3), clump = (cx + cy) % 3 !== 0;
    aAtlas[k * 2] = cx * 0.25; aAtlas[k * 2 + 1] = (3 - cy) * 0.25; k++;
    p.set(x, y + 0.006, z);
    alignToGround(x, z, r.range(0, 6.28), q);
    q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(r.range(-0.12, 0.12), 0, r.range(-0.12, 0.12))));
    s.setScalar(clump ? r.range(0.24, 0.46) : r.range(0.11, 0.2));
    c.setScalar(r.range(0.7, 1.15));
    return true;
  }, 'litter', false);
  geo.setAttribute('aAtlas', new THREE.InstancedBufferAttribute(aAtlas, 2));
  return mesh;
}

function buildRoots() {
  const r = makeRng(3131);
  const parts = [];
  // hero roots: from the two trees framing the opening shot, snaking across the dolly path

    const L = Math.hypot(tx - t.x, tz - t.z) * r.range(1.0, 1.25);

        const rr = lerp(rad, 0.014, Math.pow(f, 0.8));
        pts.push(new THREE.Vector3(p.x, terrainHeight(p.x, p.z) + rr * (0.3 + 0.45 * clamp(bury, -1, 1)) + (d === 0 ? rr * 0.5 : 0), p.z));
        ang += Noise.n2(ph * 2 + d * 0.45, 7.7) * 0.3;
        p.x += Math.cos(ang) * step; p.z += Math.sin(ang) * step;

        const q1 = new THREE.Vector3(q0.x + Math.cos(a2) * L2 * 0.5, 0, q0.z + Math.sin(a2) * L2 * 0.5);
        const q2 = new THREE.Vector3(q0.x + Math.cos(a2) * L2, 0, q0.z + Math.sin(a2) * L2);
        q1.y = terrainHeight(q1.x, q1.z) + 0.004; q2.y = terrainHeight(q2.x, q2.z) - 0.01;

    add(leg, (v, c) => c.copy(v.y < 0.17 ? FOX_COLORS.black : FOX_COLORS.fur).lerp(FOX_COLORS.black, v.y < 0.22 ? 0.5 : 0));
  }
  // bushy tail, sweeping down and back, white tip
  let tail = new THREE.IcosahedronGeometry(1, 1); tail.deleteAttribute('uv'); tail = jitterGeo(tail, 0.07, 3);
  tail.scale(0.3, 0.085, 0.095); tail.rotateZ(0.55); tail.rotateY(-0.35); tail.translate(-0.5, 0.2, 0.08);
  add(tail, (v, c) => { furShade(v, c); if (v.x < -0.68) c.copy(FOX_COLORS.white); });
  const g2 = mergeGeometries(parts);
  g2.computeVertexNormals();
  return g2;
}

// Hand-built ZPS glyph outlines (fallback if the typeface JSON can't be fetched).
function zpsFallbackShapes() {
  const shapes = [];
  const Z = new THREE.Shape([[0, 1], [0.66, 1], [0.66, 0.84], [0.2, 0.16], [0.68, 0.16], [0.68, 0], [0, 0], [0, 0.16], [0.46, 0.84], [0, 0.84]].map(([x, y]) => new THREE.Vector2(x, y)));
  shapes.push(Z);
  const P = new THREE.Shape();
  P.moveTo(0.82, 0); P.lineTo(0.82, 1); P.lineTo(1.2, 1); P.absarc(1.2, 0.72, 0.28, Math.PI / 2, -Math.PI / 2, true); P.lineTo(0.98, 0.44); P.lineTo(0.98, 0); P.closePath();
  const hole = new THREE.Path(); hole.moveTo(0.98, 0.58); hole.lineTo(1.2, 0.58); hole.absarc(1.2, 0.72, 0.14, -Math.PI / 2, Math.PI / 2, false); hole.lineTo(0.98, 0.86); hole.closePath();
  P.holes.push(hole);
  shapes.push(P);
  // S: offset a centreline curve on both sides
  const pts = [];
  const curve = new THREE.CubicBezierCurve(new THREE.Vector2(2.18, 0.86), new THREE.Vector2(1.72, 1.2), new THREE.Vector2(1.5, 0.58), new THREE.Vector2(1.86, 0.5));
  const curve2 = new THREE.CubicBezierCurve(new THREE.Vector2(1.86, 0.5), new THREE.Vector2(2.26, 0.42), new THREE.Vector2(2.08, -0.22), new THREE.Vector2(1.56, 0.14));
  for (let i = 0; i <= 20; i++) pts.push(curve.getPoint(i / 20));
  for (let i = 1; i <= 20; i++) pts.push(curve2.getPoint(i / 20));
  const left = [], right = [], w = 0.085;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const tx = b.x - a.x, ty = b.y - a.y, L = Math.hypot(tx, ty) || 1;
    const nx = -ty / L * w, ny = tx / L * w;
    left.push(new THREE.Vector2(pts[i].x + nx, pts[i].y + ny)); right.push(new THREE.Vector2(pts[i].x - nx, pts[i].y - ny));
  }
  shapes.push(new THREE.Shape(left.concat(right.reverse())));
  return shapes;
}

let foxGroup = null;
async function buildFox() {
  const gy = terrainHeight(FOX.pos.x, FOX.pos.z);
  FOX.pos.y = gy - 0.02;
  const mat = new THREE.MeshPhysicalMaterial({
    vertexColors: true, flatShading: true, roughness: 0.82, metalness: 0,
    sheen: 1.0, sheenRoughness: 0.45, sheenColor: new THREE.Color(1.0, 0.62, 0.3),
  });
  patchWorldMaterial(mat, { key: 'fox' });
  const body = new THREE.Mesh(buildFoxGeometry(), mat);
  body.castShadow = true; body.receiveShadow = true;
  foxGroup = new THREE.Group();
  foxGroup.name = 'fox';
  foxGroup.add(body);
  foxGroup.position.copy(FOX.pos);
  foxGroup.rotation.y = FOX.yaw;
  foxGroup.scale.setScalar(1.15);

  // "ZPS": bevelled extruded text perched on the head, facing the same way as the face
  let textGeo = null;
  try {
    const font = await Promise.race([
      new FontLoader().loadAsync('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/fonts/helvetiker_bold.typeface.json'),
      new Promise((_, rej) => setTimeout(() => rej(new Error('font timeout')), 6000)),
    ]);
    textGeo = new TextGeometry('ZPS', { font, size: 0.09, depth: 0.026, curveSegments: 6, bevelEnabled: true, bevelThickness: 0.007, bevelSize: 0.0042, bevelSegments: 3 });
  } catch (e) {
    textGeo = new THREE.ExtrudeGeometry(zpsFallbackShapes(), { depth: 0.3, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.045, bevelSegments: 3, curveSegments: 10 });
    textGeo.scale(0.087, 0.087, 0.087);
  }
  textGeo.computeBoundingBox();
  const bb = textGeo.boundingBox;
  textGeo.translate(-(bb.max.x + bb.min.x) / 2, -bb.min.y, -(bb.max.z + bb.min.z) / 2);
  const tmat = new THREE.MeshPhysicalMaterial({ color: 0xff9a2e, roughness: 0.32, metalness: 0.35, clearcoat: 0.8, clearcoatRoughness: 0.15 });
  patchWorldMaterial(tmat, { key: 'zps' });
  const text = new THREE.Mesh(textGeo, tmat);
  text.castShadow = true; text.receiveShadow = true;
  // head sits at local (0.4, 0.58, 0.02) rotated by -headYaw; put the text on top of it
  text.position.set(0.37, 0.715, -0.01);
  text.rotation.set(-0.08, Math.PI / 2 - FOX.headYaw, 0);
  foxGroup.add(text);
  reflectLayers(foxGroup, true, false);
  scene.add(foxGroup);
}

// Carve light shafts through the canopy: remove leaf cards that shade chosen spots
// (the fox gets its hero sunbeam; a few patches on the water catch the sun).
function carveSunShafts() {
  const d = U.uSunDir.value;
  const spots = [
    { p: new THREE.Vector3(FOX.pos.x, terrainHeight(FOX.pos.x, FOX.pos.z) + 0.4, FOX.pos.z), r: 1.15 },
    { p: new THREE.Vector3(-0.8, 0, -2.2), r: 0.8 },
    { p: new THREE.Vector3(2.4, 0, -1.2), r: 0.65 },
    { p: new THREE.Vector3(0.6, 0, 3.4), r: 0.7 },
    { p: new THREE.Vector3(4.6, 0.5, 1.4), r: 0.6 },
    { p: new THREE.Vector3(1.9, 0.2, 11.2), r: 1.1 },
    { p: new THREE.Vector3(0.9, 0.2, 9.0), r: 0.7 },
    { p: new THREE.Vector3(-3.5, 0, 1.0), r: 0.55 },
  ];
  const pos = new THREE.Vector3(), rel = new THREE.Vector3();
  for (const sp of SPECIES_KEYS) {
    leafCards[sp] = leafCards[sp].filter((l) => {
      pos.setFromMatrixPosition(l.m);
      for (const s of spots) {
        rel.subVectors(pos, s.p);
        const t = rel.dot(d);
        if (t < 1.5) continue;
        const perp = rel.addScaledVector(d, -t).length();
        if (perp < s.r + 0.35 + t * 0.012) return false;
      }
      return true;
    });
  }
  // keep the cinematic corridor clear of low foliage (no leaf card can clip the lens)
  for (const sp of SPECIES_KEYS) {
    leafCards[sp] = leafCards[sp].filter((l) => {
      pos.setFromMatrixPosition(l.m);
      if (pos.y > 6) return true;
      for (const s of camPathSamples) if (s.distanceToSquared(pos) < 1.44) return false;
      return true;
    });
  }
}

// ==== POST-PROCESSING ========================================================
// Frame: [ScenePass] reflection (½) → opaque HDR + depth → refraction copy → water &
// particles; [LightingPass] GTAO (½) + volumetric shafts (½) + radial god rays (¼) →
// composite; [ExposurePass] GPU luminance + adaptation; [Bloom]; [DoFPass];
// [ToneMapPass] ACES + exposure → sRGB; [SMAA]; [GradePass] → screen.
const settings = {
  sunElevation: SUN.elevation, sunAzimuth: SUN.azimuth, wind: 1.0,
  murk: 0.55, waveStrength: 1.0, fishCount: 16, caustics: true,
  dof: true, aperture: 1.0,
  ao: true, aoStrength: 0.85, volumetric: true, volStrength: 1.0, godRays: true, raysStrength: 1.0,
  bloom: true, smaa: true, grade: true, grain: true, vignette: true,
  autoExposure: true, exposure: 0.9,
  renderScale: 1.0, autoScale: !PARAMS.test && PARAMS.scale === null,
  sound: false,
};

const HDR_RT = (w, h, extra = {}) => new THREE.WebGLRenderTarget(w, h, Object.assign({ type: THREE.HalfFloatType, depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter }, extra));
function fsMat(frag, uniforms = {}, defines = {}) {
  return new THREE.ShaderMaterial({ uniforms, defines, vertexShader: FSQ_VERT, fragmentShader: frag, depthTest: false, depthWrite: false });
}
const COLOR_GLSL = /* glsl */`
float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
vec3 linearToSRGB(vec3 c) { c = max(c, 0.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
vec3 sRGBToLinear(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }
`;

// ---------------------------------------------------------------- ScenePass
const refractCopyMat = fsMat(/* glsl */`
  #include <packing>
  uniform sampler2D tColor, tDepth; uniform float uNear, uFar; varying vec2 vUv;
  void main() {
    float d = texture2D(tDepth, vUv).x;
    float z = d >= 0.999999 ? uFar : -perspectiveDepthToViewZ(d, uNear, uFar);
    gl_FragColor = vec4(texture2D(tColor, vUv).rgb, z);
  }`, { tColor: { value: null }, tDepth: { value: null }, uNear: { value: 0.05 }, uFar: { value: 420 } });

class ScenePass extends Pass {
  constructor() {
    super();
    this.needsSwap = false;
    this.depthTexture = new THREE.DepthTexture(4, 4, THREE.FloatType);
    this.sceneRT = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthTexture: this.depthTexture, depthBuffer: true, samples: 0 });
    this.sceneRT.texture.name = 'scene.hdr';
    this.refractRT = HDR_RT(4, 4);
    this.copy = new FullScreenQuad(refractCopyMat);
    this.width = 4; this.height = 4;
  }
  setSize(w, h) {
    this.width = w; this.height = h;
    this.sceneRT.setSize(w, h); this.refractRT.setSize(w, h);
    reflection.setSize(Math.round(w / 2), Math.round(h / 2));
    waterMat.uniforms.uResolution.value.set(w, h);
  }
  render(renderer) {
    const under = camState.under;
    // 1) planar reflection, half resolution
    reflection.render(renderer, scene, camera, under);
    // 2) opaque HDR frame (+ this frame's sun shadow map)
    U.uFogMode.value = under ? 1 : 0;
    renderer.shadowMap.needsUpdate = true;
    renderer.setRenderTarget(this.sceneRT);
    renderer.clear();
    renderer.render(scene, camera);
    if (sun.shadow.map) U.uShadowMap.value = sun.shadow.map.texture;
    // 3) refraction source: colour + linear depth of everything behind the surface
    refractCopyMat.uniforms.tColor.value = this.sceneRT.texture;
    refractCopyMat.uniforms.tDepth.value = this.depthTexture;
    refractCopyMat.uniforms.uNear.value = camera.near; refractCopyMat.uniforms.uFar.value = camera.far;
    renderer.setRenderTarget(this.refractRT);
    this.copy.render(renderer);
    // 4) water surface + particles over the opaque frame (shares its depth buffer)
    const wu = waterMat.uniforms;
    wu.tRefraction.value = this.refractRT.texture;
    wu.uUnderwater.value = under ? 1 : 0;
    wu.uProjInv.value.copy(camera.projectionMatrixInverse);
    wu.uCamWorld.value.copy(camera.matrixWorld);
    wu.uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    siltPoints.visible = under;
    dustPoints.visible = true;
    renderer.setRenderTarget(this.sceneRT);
    const ac = renderer.autoClear; renderer.autoClear = false;
    renderer.render(overlayScene, camera);
    renderer.autoClear = ac;
  }
}

// ---------------------------------------------------------------- GTAO (depth only)
const AO_FRAG = /* glsl */`
#include <packing>
uniform sampler2D tDepth; uniform vec2 uFullRes; uniform mat4 uProj, uProjInv;
uniform float uRadius, uFrame, uFar;
varying vec2 vUv;
${GLSL_NOISE}
vec3 vpos(vec2 uv) { float d = texture2D(tDepth, uv).x; vec4 v = uProjInv * vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0); return v.xyz / v.w; }
void main() {
  float d0 = texture2D(tDepth, vUv).x;
  if (d0 >= 0.999999) { gl_FragColor = vec4(1.0, 0.0, 0.0, uFar); return; }
  vec3 P = vpos(vUv);
  vec2 px = 1.0 / uFullRes;
  vec3 Pr = vpos(vUv + vec2(px.x, 0.0)), Pl = vpos(vUv - vec2(px.x, 0.0));
  vec3 Pu = vpos(vUv + vec2(0.0, px.y)), Pd = vpos(vUv - vec2(0.0, px.y));
  vec3 dx = abs(Pr.z - P.z) < abs(P.z - Pl.z) ? Pr - P : P - Pl;
  vec3 dy = abs(Pu.z - P.z) < abs(P.z - Pd.z) ? Pu - P : P - Pd;
  vec3 N = normalize(cross(dx, dy));
  vec3 V = normalize(-P);
  if (dot(N, V) < 0.0) N = -N;
  float rPx = min(uRadius * uProj[1][1] * 0.5 * uFullRes.y / -P.z, 90.0);
  if (rPx < 1.5) { gl_FragColor = vec4(1.0, 0.0, 0.0, -P.z); return; }
  float n0 = fract(bayer4(gl_FragCoord.xy) + uFrame * 0.618034);
  float n1 = fract(bayer4(gl_FragCoord.xy + 2.0) * 0.93 + 0.271 + uFrame * 0.414);
  float vis = 0.0;
  for (int s = 0; s < 3; s++) {
    float phi = (float(s) + n0) * 3.14159265 / 3.0;
    vec2 dir = vec2(cos(phi), sin(phi));
    vec3 dirV = vec3(dir, 0.0);
    vec3 orthoDir = dirV - dot(dirV, V) * V;
    vec3 axis = normalize(cross(dirV, V));
    vec3 projN = N - axis * dot(N, axis);
    float projNLen = length(projN);
    float cosN = clamp(dot(projN, V) / max(projNLen, 1e-4), -1.0, 1.0);
    float n = sign(dot(orthoDir, projN)) * acos(cosN);
    float h0 = -1.0, h1 = -1.0;
    for (int k = 0; k < 6; k++) {
      float t = (float(k) + n1) / 6.0;
      vec2 off = dir * max(t * t * rPx, float(k) + 1.0) * px;
      vec3 S0 = vpos(vUv + off) - P, S1 = vpos(vUv - off) - P;
      float l0 = length(S0), l1 = length(S1);
      float w0 = clamp(1.0 - l0 * l0 / (uRadius * uRadius * 2.0), 0.0, 1.0);
      float w1 = clamp(1.0 - l1 * l1 / (uRadius * uRadius * 2.0), 0.0, 1.0);
      h0 = max(h0, mix(-1.0, dot(S0, V) / max(l0, 1e-4), w0));
      h1 = max(h1, mix(-1.0, dot(S1, V) / max(l1, 1e-4), w1));
    }
    float a1 = n + min(acos(clamp(h0, -1.0, 1.0)) - n, 1.5707963);
    float a0 = n + max(-acos(clamp(h1, -1.0, 1.0)) - n, -1.5707963);
    vis += projNLen * 0.25 * ((-cos(2.0 * a1 - n) + cosN + 2.0 * a1 * sin(n)) + (-cos(2.0 * a0 - n) + cosN + 2.0 * a0 * sin(n)));
  }
  gl_FragColor = vec4(clamp(vis / 3.0, 0.0, 1.0), 0.0, 0.0, -P.z);
}
`;
// depth-aware separable blur for half-res buffers (rgb payload, linear depth in alpha)
const BILATERAL_FRAG = /* glsl */`
uniform sampler2D tInput; uniform vec2 uDir; uniform vec2 uRes;
varying vec2 vUv;
void main() {
  vec4 c = texture2D(tInput, vUv);
  float z0 = c.a;
  vec3 sum = c.rgb; float wsum = 1.0;
  for (int i = -3; i <= 3; i++) {
    if (i == 0) continue;
    vec4 s = texture2D(tInput, vUv + uDir * float(i) / uRes);
    float w = exp(-float(i * i) / 6.0) * exp(-abs(s.a - z0) / (0.03 * z0 + 0.03));
    sum += s.rgb * w; wsum += w;
  }
  gl_FragColor = vec4(sum / wsum, z0);
}
`;
// ---------------------------------------------------------------- volumetric light
const VOL_FRAG = /* glsl */`
#include <packing>
uniform sampler2D tDepth; uniform mat4 uProjInv, uCamWorld;
uniform float uFrame, uTime, uWaterLevel, uAirDensity, uWaterDensity, uUnder, uMaxAir, uMaxWater;
uniform vec3 uSunDir, uSunColor, uWaterAbsorbLight, uWaterTint;
varying vec2 vUv;
${GLSL_NOISE}
${GLSL_SUNVIS}
float hgPhase(float c, float g) { float g2 = g * g; return (1.0 - g2) / (12.566 * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5)); }
float shaftCaustic(vec2 p, float t) {
  float a = sin(p.x * 3.1 + t * 0.9 + sin(p.y * 2.3 + t * 0.6));
  float b = sin(p.y * 2.7 - t * 0.7 + sin(p.x * 1.9 - t * 0.5));
  return pow(abs(a * b), 2.0) * 2.2;
}
void main() {
  float d = texture2D(tDepth, vUv).x;
  vec4 vp = uProjInv * vec4(vUv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0); vp.xyz /= vp.w;
  vec3 wp = (uCamWorld * vec4(vp.xyz, 1.0)).xyz;
  vec3 ro = cameraPosition;
  vec3 rd = wp - ro; float L = length(rd); rd /= max(L, 1e-4);
  L = min(L, uUnder > 0.5 ? uMaxWater : uMaxAir);
  // quadratic step distribution: fine steps near the camera resolve individual shafts
  const int STEPS = 44;
  float jit = fract(bayer4(gl_FragCoord.xy) + uFrame * 0.618034);
  float cosT = dot(rd, uSunDir);
  float phAir = hgPhase(cosT, 0.62) * 0.8 + hgPhase(cosT, -0.2) * 0.2;
  float phWat = hgPhase(cosT, 0.72) * 0.85 + 0.012;
  vec3 acc = vec3(0.0);
  float trans = 1.0;
  float sy = max(uSunDir.y, 0.2);
  for (int i = 0; i < STEPS; i++) {
    float f0 = (float(i) + jit) / float(STEPS);
    float stepL = L * (2.0 * f0 + 1.0 / float(STEPS)) / float(STEPS);
    vec3 p = ro + rd * (L * f0 * f0);
    float vis = sunVisibility(p);
    // the depth buffer stops every ray at the water surface, so the whole ray lives in the
    // camera's medium (per-sample tests would flicker with the wave crests)
    if (uUnder > 0.5) {
      float db = max(uWaterLevel - p.y, 0.0);
      vec3 sp = p + uSunDir * (db / sy);
      vec3 att = exp(-uWaterAbsorbLight * db / sy);
      acc += uWaterTint * att * (vis * (0.65 + 0.7 * shaftCaustic(sp.xz, uTime)) * trans * uWaterDensity * phWat * stepL);
      trans *= exp(-uWaterDensity * 0.6 * stepL);
    } else {
      float haze = 0.5 + 0.5 * vnoise3(p * 0.13 + vec3(uTime * 0.03, 0.0, uTime * 0.02));
      acc += vec3(vis * trans * uAirDensity * haze * phAir * stepL);
      trans *= exp(-uAirDensity * 0.5 * stepL);
    }
  }
  gl_FragColor = vec4(acc * uSunColor, -vp.z);
}
`;
// ---------------------------------------------------------------- god rays (radial)
const RAYMASK_FRAG = /* glsl */`
uniform sampler2D tDepth, tColor; uniform vec2 uSunUV; uniform float uAspect;
varying vec2 vUv;
void main() {
  float sky = step(0.999999, texture2D(tDepth, vUv).x);
  vec3 c = texture2D(tColor, vUv).rgb;
  vec2 dv = (vUv - uSunUV) * vec2(uAspect, 1.0);
  float prox = exp(-dot(dv, dv) * 9.0);
  gl_FragColor = vec4(min(c, vec3(6.0)) * sky * (0.03 + prox * 1.4), 1.0);
}
`;
const RAYBLUR_FRAG = /* glsl */`
uniform sampler2D tInput; uniform vec2 uSunUV; uniform float uStep;
varying vec2 vUv;
void main() {
  vec2 delta = uSunUV - vUv;
  float dist = length(delta);
  vec2 stepv = uStep * delta / max(dist, 1e-4);
  float iters = dist / uStep;
  vec2 uv = vUv;
  vec3 col = vec3(0.0);
  for (int i = 0; i < 8; i++) {
    if (float(i) <= iters) col += texture2D(tInput, uv).rgb * (1.0 - float(i) * 0.04);
    uv += stepv;
  }
  gl_FragColor = vec4(col / 8.0, 1.0);
}
`;
const COMPOSITE_FRAG = /* glsl */`
#include <packing>
uniform sampler2D tScene, tDepth, tAO, tVol, tRays;
uniform float uAO, uVol, uRays, uNear, uFar, uDebug;
uniform vec3 uRaysTint; uniform vec2 uHalfRes;
varying vec2 vUv;
${COLOR_GLSL}
vec4 upsample(sampler2D t, vec2 uv, float z) {
  vec2 hp = uv * uHalfRes - 0.5; vec2 f = fract(hp); vec2 b = (floor(hp) + 0.5) / uHalfRes; vec2 o = 1.0 / uHalfRes;
  vec4 s00 = texture2D(t, b), s10 = texture2D(t, b + vec2(o.x, 0.0)), s01 = texture2D(t, b + vec2(0.0, o.y)), s11 = texture2D(t, b + o);
  vec4 w = vec4((1.0 - f.x) * (1.0 - f.y), f.x * (1.0 - f.y), (1.0 - f.x) * f.y, f.x * f.y);
  float tol = 0.04 * z + 0.02;
  w *= vec4(1.0 / (tol + abs(s00.a - z)), 1.0 / (tol + abs(s10.a - z)), 1.0 / (tol + abs(s01.a - z)), 1.0 / (tol + abs(s11.a - z)));
  return (s00 * w.x + s10 * w.y + s01 * w.z + s11 * w.w) / max(w.x + w.y + w.z + w.w, 1e-6);
}
void main() {
  vec3 c = texture2D(tScene, vUv).rgb;
  float d = texture2D(tDepth, vUv).x;
  float z = d >= 0.999999 ? uFar : -perspectiveDepthToViewZ(d, uNear, uFar);
  if (uAO > 0.0 && d < 0.999999) {
    float ao = upsample(tAO, vUv, z).r;
    c *= mix(1.0, ao, uAO * (1.0 - 0.75 * smoothstep(0.05, 1.2, luma(c))));
  }
  if (uVol > 0.0) c += upsample(tVol, vUv, z).rgb * uVol;
  if (uRays > 0.0) c += texture2D(tRays, vUv).rgb * uRaysTint * uRays;
  if (uDebug > 0.5 && uDebug < 1.5) c = upsample(tVol, vUv, z).rgb * 4.0;

  gl_FragColor = vec4(c, 1.0);
}
`;

class LightingPass extends Pass {
  constructor(scenePass) {
    super();

    this.volRT = HDR_RT(4, 4); this.volTmp = HDR_RT(4, 4);
    this.maskRT = HDR_RT(4, 4); this.rayA = HDR_RT(4, 4); this.rayB = HDR_RT(4, 4);
    this.aoMat = fsMat(AO_FRAG, { tDepth: { value: null }, uFullRes: { value: new THREE.Vector2() }, uProj: { value: new THREE.Matrix4() }, uProjInv: { value: new THREE.Matrix4() }, uRadius: { value: 0.7 }, uFrame: { value: 0 }, uFar: { value: 420 } });
    this.blurMat = fsMat(BILATERAL_FRAG, { tInput: { value: null }, uDir: { value: new THREE.Vector2() }, uRes: { value: new THREE.Vector2() } });
    this.volMat = fsMat(VOL_FRAG, {
      tDepth: { value: null }, uProjInv: { value: new THREE.Matrix4() }, uCamWorld: { value: new THREE.Matrix4() },
      uFrame: { value: 0 }, uTime: U.uTime, uWaterLevel: U.uWaterLevel, uAirDensity: { value: 0.017 }, uWaterDensity: { value: 0.16 },
      uUnder: { value: 0 }, uMaxAir: { value: 42 }, uMaxWater: { value: 12 }, uSunDir: U.uSunDir, uSunColor: U.uSunColor,
      uWaterAbsorbLight: U.uWaterAbsorbLight, uWaterTint: { value: new THREE.Color(0.55, 0.85, 0.6) },
      uShadowMap: U.uShadowMap, uShadowMatrix: U.uShadowMatrix, uShadowOutside: U.uShadowOutside,
    });
    this.maskMat = fsMat(RAYMASK_FRAG, { tDepth: { value: null }, tColor: { value: null }, uSunUV: { value: new THREE.Vector2() }, uAspect: { value: 1 } });
    this.rayMat = fsMat(RAYBLUR_FRAG, { tInput: { value: null }, uSunUV: { value: new THREE.Vector2() }, uStep: { value: 0.1 } });
    this.compMat = fsMat(COMPOSITE_FRAG, {
      tScene: { value: null }, tDepth: { value: null }, tAO: { value: null }, tVol: { value: null }, tRays: { value: null },
      uAO: { value: 0.85 }, uVol: { value: 1 }, uRays: { value: 0.35 }, uNear: { value: 0.05 }, uFar: { value: 420 },
      uRaysTint: { value: new THREE.Color(1.0, 0.82, 0.55) }, uHalfRes: { value: new THREE.Vector2() }, uDebug: { value: 0 },

  setSize(w, h) {
    const hw = Math.max(1, Math.round(w / 2)), hh = Math.max(1, Math.round(h / 2));
    const qw = Math.max(1, Math.round(w / 4)), qh = Math.max(1, Math.round(h / 4));
    for (const rt of [this.aoRT, this.aoTmp, this.volRT, this.volTmp]) rt.setSize(hw, hh);

  pass(renderer, mat, target) { this.quad.material = mat; renderer.setRenderTarget(target); this.quad.render(renderer); }
  blur(renderer, src, tmp) {
    const u = this.blurMat.uniforms;
    u.uRes.value.copy(this.halfRes);
    u.tInput.value = src.texture; u.uDir.value.set(1, 0); this.pass(renderer, this.blurMat, tmp);
    u.tInput.value = tmp.texture; u.uDir.value.set(0, 1); this.pass(renderer, this.blurMat, src);
  }
  render(renderer, writeBuffer) {
    this.frame = (this.frame + 1) % 64;
    const depth = this.sp.depthTexture;
    const under = camState.under;
    // --- AO
    if (settings.ao) {
      const u = this.aoMat.uniforms;
      u.tDepth.value = depth; u.uProj.value.copy(camera.projectionMatrix); u.uProjInv.value.copy(camera.projectionMatrixInverse);
      u.uFrame.value = this.frame; u.uFar.value = camera.far;

      this.blur(renderer, this.aoRT, this.aoTmp);
    }
    // --- volumetric light (shadow-map ray march)
    if (settings.volumetric) {
      const u = this.volMat.uniforms;
      u.tDepth.value = depth; u.uProjInv.value.copy(camera.projectionMatrixInverse); u.uCamWorld.value.copy(camera.matrixWorld);
      u.uFrame.value = this.frame; u.uUnder.value = under ? 1 : 0;

      this.blur(renderer, this.volRT, this.volTmp);
    }
    // --- radial god rays through the canopy occlusion mask
    const s4 = this._v4.set(U.uSunDir.value.x * 1000 + camera.position.x, U.uSunDir.value.y * 1000 + camera.position.y, U.uSunDir.value.z * 1000 + camera.position.z, 1)
      .applyMatrix4(camera.matrixWorldInverse).applyMatrix4(camera.projectionMatrix);
    let raysAmt = 0;
    if (settings.godRays && s4.w > 0 && !under) {
      this.sunUV.set(s4.x / s4.w * 0.5 + 0.5, s4.y / s4.w * 0.5 + 0.5);
      const ox = Math.max(0, Math.abs(this.sunUV.x - 0.5) - 0.5), oy = Math.max(0, Math.abs(this.sunUV.y - 0.5) - 0.5);
      raysAmt = 1 - smoothstep(0.0, 0.6, Math.hypot(ox, oy));
    }
    this.sunVisible = lerp(this.sunVisible, raysAmt, 0.15);
    if (this.sunVisible > 0.01) {
      const m = this.maskMat.uniforms;
      m.tDepth.value = depth; m.tColor.value = this.sp.sceneRT.texture; m.uSunUV.value.copy(this.sunUV); m.uAspect.value = camera.aspect;
      this.pass(renderer, this.maskMat, this.maskRT);
      const r = this.rayMat.uniforms; r.uSunUV.value.copy(this.sunUV);
      r.tInput.value = this.maskRT.texture; r.uStep.value = 1 / 8; this.pass(renderer, this.rayMat, this.rayA);
      r.tInput.value = this.rayA.texture; r.uStep.value = 1 / 64; this.pass(renderer, this.rayMat, this.rayB);
      r.tInput.value = this.rayB.texture; r.uStep.value = 1 / 512; this.pass(renderer, this.rayMat, this.rayA);
    }
    // --- composite
    const c = this.compMat.uniforms;
    c.tScene.value = this.sp.sceneRT.texture; c.tDepth.value = depth;
    c.tAO.value = this.aoRT.texture; c.tVol.value = this.volRT.texture; c.tRays.value = this.rayA.texture;
    c.uAO.value = settings.ao ? settings.aoStrength : 0;
    c.uVol.value = settings.volumetric ? settings.volStrength : 0;
    c.uRays.value = this.sunVisible > 0.01 ? 0.3 * settings.raysStrength * this.sunVisible : 0;
    c.uNear.value = camera.near; c.uFar.value = camera.far;
    this.pass(renderer, this.compMat, this.renderToScreen ? null : writeBuffer);
    if (camState.mode === 'free' && !PARAMS.test) autoFocus.update(renderer, depth);
  }
}

// ---------------------------------------------------------------- auto exposure
const LUM_FRAG = /* glsl */`
uniform sampler2D tInput; varying vec2 vUv;
${COLOR_GLSL}
void main() {
  vec3 c = texture2D(tInput, vUv).rgb;
  gl_FragColor = vec4(log2(max(luma(c), 1e-4)), 0.0, 0.0, 1.0);
}
`;
const ADAPT_FRAG = /* glsl */`
uniform sampler2D tLum, tPrev; uniform float uDt, uInstant;
varying vec2 vUv;
void main() {
  float sum = 0.0, wsum = 0.0;
  for (int j = 0; j < 6; j++) for (int i = 0; i < 6; i++) {
    vec2 uv = (vec2(float(i), float(j)) + 0.5) / 6.0;
    float w = exp(-dot(uv - 0.5, uv - 0.5) * 5.0);
    sum += textureLod(tLum, uv, 3.0).r * w; wsum += w;
  }
  float cur = sum / wsum;
  float prev = texture2D(tPrev, vec2(0.5)).r;
  float rate = cur > prev ? 2.2 : 1.1;
  float a = uInstant > 0.5 ? 1.0 : 1.0 - exp(-uDt * rate);
  gl_FragColor = vec4(mix(prev, cur, a), 0.0, 0.0, 1.0);
}
`;
class ExposurePass extends Pass {
  constructor() {
    super();
    this.needsSwap = false;
    this.lumRT = new THREE.WebGLRenderTarget(64, 64, { type: THREE.HalfFloatType, depthBuffer: false, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
    this.adapt = [0, 1].map(() => new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false }));
    this.lumMat = fsMat(LUM_FRAG, { tInput: { value: null } });
    this.adaptMat = fsMat(ADAPT_FRAG, { tLum: { value: this.lumRT.texture }, tPrev: { value: null }, uDt: { value: 0.016 }, uInstant: { value: 1 } });
    this.quad = new FullScreenQuad(null);
    this.i = 0; this.dt = 0.016; this.instant = 3;
  }
  get current() { return this.adapt[this.i].texture; }
  render(renderer, writeBuffer, readBuffer) {
    this.lumMat.uniforms.tInput.value = readBuffer.texture;
    this.quad.material = this.lumMat; renderer.setRenderTarget(this.lumRT); this.quad.render(renderer);
    const prev = this.adapt[this.i], next = this.adapt[1 - this.i];
    const u = this.adaptMat.uniforms;
    u.tPrev.value = prev.texture; u.uDt.value = this.dt; u.uInstant.value = this.instant > 0 ? 1 : 0;
    if (this.instant > 0) this.instant--;
    this.quad.material = this.adaptMat; renderer.setRenderTarget(next); this.quad.render(renderer);
    this.i = 1 - this.i;
  }
}

// ---------------------------------------------------------------- depth of field
const DOF_COMMON = /* glsl */`
#include <packing>
uniform float uFocus, uAperture, uMaxCoc, uNear, uFar;
float linZ(float d) { return d >= 0.999999 ? uFar : -perspectiveDepthToViewZ(d, uNear, uFar); }
float cocOf(float z) { return clamp(uAperture * (z - uFocus) / (z * uFocus), -1.0, 1.0) * uMaxCoc; }
`;
const DOF_PREP_FRAG = /* glsl */`
uniform sampler2D tColor, tDepth; uniform vec2 uFullRes;
varying vec2 vUv;
${DOF_COMMON}
void main() {
  vec2 o = 0.5 / uFullRes;
  vec3 c = vec3(0.0); float coc = 0.0; float cmin = 1e5;
  for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++) {
    vec2 uv = vUv + (vec2(float(i), float(j)) - 0.5) * 2.0 * o;
    float k = cocOf(linZ(texture2D(tDepth, uv).x));
    c += min(texture2D(tColor, uv).rgb, vec3(60.0));
    cmin = min(cmin, k);
    coc += k;
  }
  coc *= 0.25;
  if (cmin < 0.0) coc = min(coc, cmin);   // keep the strongest near-field blur
  gl_FragColor = vec4(c * 0.25, coc);
}
`;
const DOF_GATHER_FRAG = /* glsl */`
uniform sampler2D tHalf; uniform vec2 uHalfRes; uniform float uMaxCoc;
varying vec2 vUv;
void main() {
  vec4 c0 = texture2D(tHalf, vUv);
  float r0 = abs(c0.a);
  vec3 acc = c0.rgb; float wsum = 1.0; float nearW = 0.0;
  const int N = 48;
  for (int i = 1; i < N; i++) {
    float fi = float(i);
    float r = sqrt(fi / float(N)) * uMaxCoc;
    float a = fi * 2.39996323;
    vec4 s = texture2D(tHalf, vUv + vec2(cos(a), sin(a)) * r / uHalfRes);
    float cs = abs(s.a);
    if (s.a > c0.a) cs = min(cs, r0);            // background can't blur over sharper foreground
    float w = smoothstep(r - 1.0, r + 0.5, cs);
    acc += s.rgb * w; wsum += w;
    if (s.a < -1.0) nearW += w;
  }
  gl_FragColor = vec4(acc / wsum, clamp(nearW / float(N) * 2.5, 0.0, 1.0));
}
`;
const DOF_COMP_FRAG = /* glsl */`
uniform sampler2D tColor, tDepth, tBlur;
varying vec2 vUv;
${DOF_COMMON}
void main() {
  vec3 sharp = texture2D(tColor, vUv).rgb;
  vec4 b = texture2D(tBlur, vUv);
  float k = abs(cocOf(linZ(texture2D(tDepth, vUv).x)));
  float blend = clamp(max(smoothstep(0.5, 2.0, k), b.a), 0.0, 1.0);
  gl_FragColor = vec4(mix(sharp, b.rgb, blend), 1.0);
}
`;
class DoFPass extends Pass {
  constructor(scenePass) {
    super();
    this.sp = scenePass;
    this.halfRT = HDR_RT(4, 4, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
    this.blurRT = HDR_RT(4, 4);
    this.focus = { value: 4 }; this.aperture = { value: 4.5 }; this.maxCoc = { value: 11 };
    const common = () => ({ uFocus: this.focus, uAperture: this.aperture, uMaxCoc: this.maxCoc, uNear: { value: 0.05 }, uFar: { value: 420 } });
    this.prep = fsMat(DOF_PREP_FRAG, Object.assign(common(), { tColor: { value: null }, tDepth: { value: null }, uFullRes: { value: new THREE.Vector2() } }));
    this.gather = fsMat(DOF_GATHER_FRAG, { tHalf: { value: this.halfRT.texture }, uHalfRes: { value: new THREE.Vector2() }, uMaxCoc: this.maxCoc });
    this.comp = fsMat(DOF_COMP_FRAG, Object.assign(common(), { tColor: { value: null }, tDepth: { value: null }, tBlur: { value: this.blurRT.texture } }));
    this.quad = new FullScreenQuad(null);
  }
  setSize(w, h) {
    const hw = Math.max(1, Math.round(w / 2)), hh = Math.max(1, Math.round(h / 2));
    this.halfRT.setSize(hw, hh); this.blurRT.setSize(hw, hh);
    this.prep.uniforms.uFullRes.value.set(w, h);
    this.gather.uniforms.uHalfRes.value.set(hw, hh);
    this.maxCoc.value = clamp(Math.round(hh / 48), 5, 14);
  }
  render(renderer, writeBuffer, readBuffer) {
    for (const m of [this.prep, this.comp]) { m.uniforms.uNear.value = camera.near; m.uniforms.uFar.value = camera.far; m.uniforms.tDepth.value = this.sp.depthTexture; m.uniforms.tColor.value = readBuffer.texture; }
    this.quad.material = this.prep; renderer.setRenderTarget(this.halfRT); this.quad.render(renderer);
    this.quad.material = this.gather; renderer.setRenderTarget(this.blurRT); this.quad.render(renderer);
    this.quad.material = this.comp; renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer); this.quad.render(renderer);
  }
}

// ---------------------------------------------------------------- tone mapping
const TONEMAP_FRAG = /* glsl */`
uniform sampler2D tDiffuse, tAdapt; uniform float uExposure, uKey, uAutoStrength, uMinE, uMaxE, uMediumExp;
varying vec2 vUv;
${COLOR_GLSL}
// ACES filmic fit, as in three.js (includes its 1/0.6 exposure normalisation)
vec3 RRTAndODTFit(vec3 v) { vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
vec3 ACESFilmic(vec3 color) {
  const mat3 ACESInputMat = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));
  const mat3 ACESOutputMat = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
  color *= 1.0 / 0.6;
  color = ACESOutputMat * RRTAndODTFit(ACESInputMat * color);
  return clamp(color, 0.0, 1.0);
}
void main() {
  vec3 c = texture2D(tDiffuse, vUv).rgb;
  float avg = exp2(texture2D(tAdapt, vec2(0.5)).r);
  float autoE = clamp(pow(uKey / max(avg, 1e-4), uAutoStrength), uMinE, uMaxE);
  gl_FragColor = vec4(linearToSRGB(ACESFilmic(c * uExposure * autoE * uMediumExp)), 1.0);
}
`;
class ToneMapPass extends Pass {
  constructor(exposurePass) {
    super();
    this.ep = exposurePass;
    this.mat = fsMat(TONEMAP_FRAG, {
      tDiffuse: { value: null }, tAdapt: { value: null }, uExposure: { value: 0.9 }, uKey: { value: 0.05 },
      uAutoStrength: { value: 0.45 }, uMinE: { value: 0.6 }, uMaxE: { value: 1.6 }, uMediumExp: { value: 1 },
    });
    this.quad = new FullScreenQuad(this.mat);
  }
  render(renderer, writeBuffer, readBuffer) {
    const u = this.mat.uniforms;
    u.tDiffuse.value = readBuffer.texture;
    u.tAdapt.value = this.ep.current;
    u.uExposure.value = renderer.toneMappingExposure;
    u.uAutoStrength.value = settings.autoExposure ? 0.45 : 0.0;   // partial adaptation keeps the forest dark
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    this.quad.render(renderer);
  }
}

// ---------------------------------------------------------------- grade / lens
const GRADE_FRAG = /* glsl */`
uniform sampler2D tDiffuse; uniform float uTime, uUnder, uDrops, uDropSlide, uGrain, uVignette, uGradeOn, uAspect;
varying vec2 vUv;
${GLSL_NOISE}
${COLOR_GLSL}
// procedural water drops on the lens: xy = refraction offset, z = coverage
vec3 lensDrops(vec2 uv, float scale, float seed) {
  vec2 p = uv * vec2(uAspect, 1.0) * scale;
  p.y += uDropSlide * (0.15 + 0.2 * fract(seed * 1.7));
  vec2 id = floor(p); vec2 f = fract(p) - 0.5;
  vec3 h = hash32(id + seed * 17.0);
  if (h.z < 0.55) return vec3(0.0);
  vec2 c = (h.xy - 0.5) * 0.5;
  float r = 0.12 + 0.3 * fract(h.z * 7.3);
  vec2 d = (f - c) / r;
  float dist = length(d);
  float life = hash12(id + seed * 3.1);
  float alive = step(1.0 - uDrops, life);
  float m = (1.0 - smoothstep(0.82, 1.0, dist)) * alive;
  return vec3(-d * (1.0 - dist * dist * 0.4), m);
}
void main() {
  vec2 uv = vUv;
  uv += uUnder * vec2(sin(uv.y * 23.0 + uTime * 1.7) + 0.5 * sin(uv.y * 41.0 - uTime * 2.3),
                      cos(uv.x * 19.0 + uTime * 1.3) + 0.5 * cos(uv.x * 37.0 + uTime * 2.1)) * 0.0021;
  float dm = 0.0;
  if (uDrops > 0.001) {
    vec3 a = lensDrops(uv, 7.0, 1.0), b = lensDrops(uv, 13.0, 5.0);
    uv += (a.xy * a.z + b.xy * b.z) * 0.03;
    dm = max(a.z, b.z);
  }
  vec2 cd = uv - 0.5;
  float ca = (0.0016 + 0.0038 * uUnder + dm * 0.0025) * dot(cd, cd) * 4.0;
  vec3 col = vec3(texture2D(tDiffuse, uv - cd * ca).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv + cd * ca).b);
  if (uGradeOn > 0.5) {
    vec3 lin = sRGBToLinear(clamp(col, 0.0, 1.0));
    float l = luma(lin);
    float wS = 1.0 - smoothstep(0.0, 0.16, l), wH = smoothstep(0.2, 0.85, l);
    lin *= mix(vec3(1.0), vec3(0.84, 1.03, 1.04), wS * 0.8);      // green-teal shadows
    lin *= mix(vec3(1.0), vec3(1.08, 1.0, 0.86), wH * 0.75);      // warm highlights
    col = clamp(linearToSRGB(lin), 0.0, 1.0);
    col = mix(col, col * col * (3.0 - 2.0 * col), 0.32);          // contrast lift
    float g = luma(col); col = mix(vec3(g), col, 1.06);
  }
  col = mix(col, col * vec3(0.62, 0.92, 0.88) + vec3(0.0, 0.012, 0.02), uUnder);
  col += dm * 0.025;
  vec2 vv = (vUv - 0.5) * vec2(uAspect, 1.0);
  float vig = smoothstep(1.1, 0.28, length(vv) * (1.0 + 0.4 * uUnder));
  col *= mix(1.0, vig, uVignette + 0.3 * uUnder);
  col += (hash12(gl_FragCoord.xy + fract(uTime * 13.7) * 431.0) - 0.5) * uGrain;
  gl_FragColor = vec4(col, 1.0);
}
`;
class GradePass extends Pass {
  constructor() {
    super();
    this.mat = fsMat(GRADE_FRAG, {
      tDiffuse: { value: null }, uTime: U.uTime, uUnder: { value: 0 }, uDrops: { value: 0 }, uDropSlide: { value: 0 },
      uGrain: { value: 0.02 }, uVignette: { value: 0.35 }, uGradeOn: { value: 1 }, uAspect: { value: 1 },
    });
    this.quad = new FullScreenQuad(this.mat);
  }
  render(renderer, writeBuffer, readBuffer) {
    const u = this.mat.uniforms;
    u.tDiffuse.value = readBuffer.texture;
    u.uAspect.value = camera.aspect;
    u.uGrain.value = settings.grain ? 0.02 : 0;
    u.uVignette.value = settings.vignette ? 0.35 : 0;
    u.uGradeOn.value = settings.grade ? 1 : 0;
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);

  }
}

// Autofocus for free mode: min linear depth around the screen centre, read back async.
class AutoFocus {
  constructor() {
    this.rt = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: false });
    this.mat = fsMat(/* glsl */`
      #include <packing>
      uniform sampler2D tDepth; uniform float uNear, uFar; varying vec2 vUv;
      void main() {
        float m = uFar;
        for (int j = -2; j <= 2; j++) for (int i = -2; i <= 2; i++) {
          float d = texture2D(tDepth, vec2(0.5) + vec2(float(i), float(j)) * vec2(0.02, 0.035)).x;
          m = min(m, d >= 0.999999 ? uFar : -perspectiveDepthToViewZ(d, uNear, uFar));
        }
        float x = clamp(m / uFar, 0.0, 1.0);
        gl_FragColor = vec4(floor(x * 255.0) / 255.0, fract(x * 255.0), 0.0, 1.0);
      }`, { tDepth: { value: null }, uNear: { value: 0.05 }, uFar: { value: 420 } });
    this.quad = new FullScreenQuad(this.mat);
    this.buf = new Uint8Array(4); this.pending = false; this.value = null;   // null until the first readback lands
  }
  update(renderer, depthTexture) {
    if (this.pending || !renderer.readRenderTargetPixelsAsync) return;
    const u = this.mat.uniforms; u.tDepth.value = depthTexture; u.uNear.value = camera.near; u.uFar.value = camera.far;
